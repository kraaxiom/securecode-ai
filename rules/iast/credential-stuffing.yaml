id: credential-stuffing
category: auth
cwe: CWE-307
type: iast
instrumentation:
  hook_points:
    - "php: point d'entrée du contrôleur d'authentification, avant tout appel à un service de détection comportementale/MFA"
    - "js: middleware de connexion Express/NestJS, en amont de la vérification du mot de passe"
    - "python: vue d'authentification Django/Flask/FastAPI"
    - "java: filtre Spring Security d'authentification"
    - "csharp: action de connexion ASP.NET Core Identity"
    - "go: handler HTTP de connexion"
  taint_check: >
    Trace si une requête de connexion (source: requête d'authentification entrante,
    identifiée par IP/empreinte client) atteint la vérification du mot de passe (sink)
    sans avoir traversé un composant de détection de vélocité multi-comptes ni de
    proposition/imposition de MFA.
  trigger_condition: >
    Volume élevé de requêtes de connexion avec des identifiants différents observé
    depuis la même origine (IP/empreinte) atteignant directement le sink de vérification
    de mot de passe, sans passage par un hook de détection comportementale ou de MFA.
severity: medium
remediation_ref: rules/remediation/credential-stuffing.md
knowledge_ref: knowledge/auth/credential-stuffing.md
