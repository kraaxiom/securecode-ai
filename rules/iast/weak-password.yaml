id: weak-password
category: auth
cwe: CWE-521
type: iast
instrumentation:
  hook_points:
    - "php: fonction de validation du mot de passe lors de l'inscription/changement (règles de validation Laravel ou équivalent)"
    - "js: fonction de validation du mot de passe côté serveur (middleware de validation)"
    - "python: validateur de mot de passe (validators Django AUTH_PASSWORD_VALIDATORS ou équivalent)"
    - "java: validateur de mot de passe côté serveur (Spring Security PasswordValidator ou équivalent)"
    - "csharp: options de mot de passe ASP.NET Core Identity (PasswordOptions)"
    - "go: fonction de validation de mot de passe personnalisée"
  taint_check: >
    Trace si le mot de passe soumis par l'utilisateur (source: champ de formulaire
    d'inscription/changement) atteint le sink de création/mise à jour du compte sans
    avoir traversé un contrôle de longueur minimale suffisante ni un contrôle contre une
    liste de mots de passe compromis connus.
  trigger_condition: >
    Le mot de passe atteint le sink de persistance du compte après un contrôle limité à
    une longueur minimale insuffisante (inférieure à 12 caractères) et sans passage par
    un contrôle contre une liste de mots de passe compromis.
severity: medium
remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
