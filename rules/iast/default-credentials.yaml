id: default-credentials
category: auth
cwe: CWE-1392
type: iast
instrumentation:
  hook_points:
    - "php: fonctions de seed/migration créant des comptes applicatifs (artisan seeders, scripts d'installation)"
    - "js: scripts de provisioning/seed exécutés au démarrage ou au déploiement"
    - "python: commandes de gestion (management command) créant des utilisateurs par défaut"
    - "java: initialiseurs Spring Boot (CommandLineRunner/ApplicationRunner) créant des comptes"
    - "csharp: code d'amorçage (seed) exécuté au démarrage de l'application ASP.NET Core"
    - "go: fonctions d'initialisation créant des comptes de service au démarrage"
  taint_check: >
    Trace si un compte créé par un script de provisioning/seed (source: valeur d'identifiant
    codée en dur ou issue d'une constante non régénérée) atteint la création effective du
    compte en base (sink: insertion utilisateur) sans passer par une génération aléatoire
    du mot de passe ni un marquage "changement obligatoire à la première connexion".
  trigger_condition: >
    Un compte est créé avec un mot de passe constant/codé en dur identique entre plusieurs
    exécutions du seed, sans flag de changement obligatoire à la première connexion.
severity: high
remediation_ref: rules/remediation/default-credentials.md
knowledge_ref: knowledge/auth/default-credentials.md
