id: jwt-weak-secret
category: auth
cwe: CWE-326
type: iast
instrumentation:
  hook_points:
    - "php: fonction de signature JWT (firebase/php-jwt JWT::encode ou équivalent), source du secret utilisé"
    - "js: fonction jwt.sign (jsonwebtoken ou équivalent)"
    - "python: fonction jwt.encode (PyJWT ou équivalent)"
    - "java: méthode de construction du signer JWT (JJWT, Nimbus JOSE)"
    - "csharp: construction de SigningCredentials/SymmetricSecurityKey (System.IdentityModel.Tokens.Jwt)"
    - "go: fonction de signature jwt.SignedString (golang-jwt ou équivalent)"
  taint_check: >
    Trace l'origine de la valeur du secret utilisé pour signer/vérifier le JWT (source:
    littéral en dur dans le code, valeur de configuration par défaut documentée, ou
    variable d'environnement non générée aléatoirement) jusqu'au sink de signature/vérification HMAC.
  trigger_condition: >
    Le secret atteignant le sink de signature/vérification HMAC provient d'un littéral en
    dur, d'une valeur d'exemple documentée publiquement, ou d'une chaîne dont la longueur
    est manifestement inférieure à l'entropie minimale recommandée pour l'algorithme utilisé.
severity: high
remediation_ref: rules/remediation/jwt-weak-secret.md
knowledge_ref: knowledge/auth/jwt-weak-secret.md
