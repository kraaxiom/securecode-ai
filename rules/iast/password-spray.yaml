id: password-spray
category: auth
cwe: CWE-307
type: iast
instrumentation:
  hook_points:
    - "php: point d'entrée du contrôleur d'authentification, en amont de la comparaison de mot de passe"
    - "js: middleware de connexion Express/NestJS"
    - "python: vue d'authentification Django/Flask/FastAPI"
    - "java: filtre Spring Security d'authentification"
    - "csharp: action de connexion ASP.NET Core Identity"
    - "go: handler HTTP de connexion"
  taint_check: >
    Trace si une requête d'authentification (source: requête entrante identifiée par
    IP/empreinte client) atteint le sink de vérification de mot de passe sans avoir
    traversé un compteur d'échecs agrégé au niveau IP/source (indépendant du compteur
    par compte).
  trigger_condition: >
    Un volume élevé d'échecs d'authentification portant sur des identifiants distincts
    depuis la même origine atteint le sink de vérification sans qu'aucun hook de
    limitation globale (par IP/source, tous comptes confondus) n'ait été traversé.
severity: medium
remediation_ref: rules/remediation/password-spray.md
knowledge_ref: knowledge/auth/password-spray.md
