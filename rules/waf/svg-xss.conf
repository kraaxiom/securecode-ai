# slug: svg-xss | CWE-79 | OWASP A03:2021-Injection
# Filtre périmétrique sur le contenu de fichiers SVG uploadés (script, gestionnaires d'événements,
# schéma javascript:). Défense en profondeur — ne remplace pas la sanitisation XML côté application.

SecRule FILES_TMP_CONTENT "@rx (?i)<script[\s>/]|on(load|error|begin|click)\s*=\s*[\"']?|xlink:href\s*=\s*[\"']?\s*javascript:" \
    "id:9501012,phase:2,t:none,log,deny,status:403,msg:'Contenu actif (script/gestionnaire d''événement) détecté dans un fichier SVG uploadé',logdata:'File: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)image/svg\+xml" "chain,id:9501013,phase:1,t:none,log,pass,msg:'Upload SVG détecté — vérification du contenu requise (defense-in-depth)',severity:'NOTICE',tag:'CWE-79'"
    SecRule REQUEST_BODY "@rx (?i)<script[\s>/]" "t:none,log,deny,status:403,logdata:'%{MATCHED_VAR}'"
