# WAF rule — code-injection (CWE-94)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/code-injection.md)

SecRule ARGS "@rx (?i:\b(eval|assert|create_function|call_user_func)\s*\()" \
    "id:9500006,\
    phase:2,\
    deny,\
    msg:'Détection d\'un appel à une fonction d\'évaluation dynamique de code',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/code-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:\bnew\s+Function\s*\(|\bvm\.runInNewContext|\bsetTimeout\s*\(\s*['\"])" \
    "id:9500007,\
    phase:2,\
    deny,\
    msg:'Détection d\'une construction JavaScript permettant l\'exécution de code dynamique',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/code-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:__import__|pickle\.loads|yaml\.load\s*\(|unserialize\s*\()" \
    "id:9500008,\
    phase:2,\
    deny,\
    msg:'Détection d\'un motif de désérialisation dangereuse pouvant mener à une exécution de code',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/code-injection',\
    severity:'CRITICAL'"
