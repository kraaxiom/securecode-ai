# slug: idor
# cwe: CWE-639
# owasp: A01:2021-Broken Access Control
# Regle de perimetre (WAF) - valeur tres limitee pour une IDOR. Un WAF perimetre
# ne connait ni le proprietaire reel d'un objet ni la matrice d'appartenance
# applicative : il ne peut pas determiner si l'identifiant demande appartient a
# l'appelant. Cette regle se limite a detecter un signal indirect - l'enumeration
# rapide d'identifiants numeriques sequentiels sur un meme chemin de type objet -
# qui peut corroborer une tentative d'IDOR mais ne la confirme jamais. La
# correction reelle releve exclusivement du controle d'appartenance cote
# applicatif (WHERE owner_id = current_user) - voir remediation_ref.

# Compteur d'identifiants numeriques distincts vus sur un meme chemin de type
# ressource (ex. /invoices/123, /users/456/profile) depuis une meme IP.
SecRule REQUEST_URI "@rx ^/(?:api/)?[a-zA-Z_-]+/(\d+)(?:/|$)" \
    "id:9503060,\
    phase:1,\
    pass,\
    nolog,\
    capture,\
    setvar:'ip.idor_seen_id_%{tx.1}=1',\
    expirevar:'ip.idor_seen_id_%{tx.1}=120',\
    setvar:'ip.idor_id_scan_counter=+1',\
    expirevar:'ip.idor_id_scan_counter=120'"

# Alerte si une meme IP accede a un volume anormalement eleve d'identifiants
# numeriques distincts sur des chemins de type objet en fenetre courte - signal
# d'enumeration sequentielle a corroborer avec le controle d'appartenance
# applicatif, pas une preuve d'IDOR.
SecRule IP:IDOR_ID_SCAN_COUNTER "@gt 40" \
    "id:9503061,\
    phase:1,\
    pass,\
    log,\
    msg:'Enumeration rapide d\'identifiants numeriques sur des chemins de type objet (signal a corroborer avec le controle d\'appartenance applicatif - IDOR potentielle non confirmee par le WAF)',\
    logdata:'idor_id_scan_counter=%{ip.idor_id_scan_counter}',\
    tag:'securecode-ai/authorization/idor',\
    severity:'NOTICE'"

# Note operateur : regle en mode journalisation uniquement (pass/log). Le WAF ne
# peut pas remplacer le controle d'appartenance applicatif - il fournit un signal
# de corroboration perimetrique en defense en profondeur uniquement.
# remediation_ref: rules/remediation/idor.md
# knowledge_ref: knowledge/authorization/idor.md
