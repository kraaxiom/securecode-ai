# WAF rule — http-request-smuggling (CWE-444)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/http-request-smuggling.md)

SecRule &REQUEST_HEADERS:Content-Length "@gt 0" \
    "id:9500111,\
    phase:1,\
    chain,\
    deny,\
    msg:'Présence simultanée de Content-Length et Transfer-Encoding : risque de contrebande de requêtes HTTP',\
    tag:'securecode-ai/injections/http-request-smuggling',\
    severity:'CRITICAL'"
    SecRule &REQUEST_HEADERS:Transfer-Encoding "@gt 0" "t:none"

SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i),\s*chunked|chunked\s*,|\s{2,}" \
    "id:9500112,\
    phase:1,\
    deny,\
    msg:'En-tête Transfer-Encoding malformé ou dupliqué détecté, potentiellement utilisé pour une désynchronisation frontal/backend',\
    logdata:'Matched Data: %{MATCHED_VAR} found within TX:transfer_encoding',\
    tag:'securecode-ai/injections/http-request-smuggling',\
    severity:'CRITICAL'"

SecRule REQUEST_HEADERS:Content-Length "@rx ^\d+\s*,\s*\d+$" \
    "id:9500113,\
    phase:1,\
    deny,\
    msg:'En-tête Content-Length contenant plusieurs valeurs contradictoires détecté',\
    logdata:'Matched Data: %{MATCHED_VAR} found within TX:content_length',\
    tag:'securecode-ai/injections/http-request-smuggling',\
    severity:'CRITICAL'"
