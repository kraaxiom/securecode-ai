# slug: default-credentials
# cwe: CWE-1392
# owasp: A07:2021-Identification and Authentication Failures
# Note : ce controle est fondamentalement applicatif/organisationnel (rotation des
# identifiants par defaut, suppression des comptes de demonstration) - un WAF perimetrique
# ne peut pas savoir quels identifiants sont "par defaut" pour une application donnee.
# Ce fichier documente neanmoins une regle de detection perimetrique complementaire et
# honnete sur ses limites : signalement d'acces a des interfaces d'administration connues
# exposees sans authentification renforcee, jamais un substitut a la correction.

# Signale (log uniquement, pas de blocage) l'acces a des chemins d'administration/outils
# tiers frequemment laisses en configuration par defaut, pour revue manuelle.
SecRule REQUEST_URI "@rx /(phpmyadmin|adminer|wp-admin/install\.php|manager/html|solr/admin|kibana|rabbitmq)" \
    "id:9502006,\
    phase:1,\
    pass,\
    log,\
    msg:'Acces a une interface d''administration potentiellement en configuration par defaut (a auditer manuellement)',\
    tag:'securecode-ai/auth/default-credentials',\
    severity:'NOTICE'"

# Ce controle perimetrique ne detecte que l'exposition de l'interface, jamais l'usage
# effectif d'identifiants par defaut (hors de portee d'un WAF, qui ne connait pas les
# identifiants applicatifs). La correction reelle relève de la couche application :
# voir remediation_ref pour la rotation/suppression des comptes par defaut.
# remediation_ref: rules/remediation/default-credentials.md
# knowledge_ref: knowledge/auth/default-credentials.md
