# slug: bola
# cwe: CWE-639
# owasp: A01:2021-Broken Access Control
# Regle de perimetre (WAF) - valeur limitee pour une vulnerabilite d'autorisation
# applicative (BOLA). Un WAF ne peut pas determiner si l'appelant est proprietaire
# de l'objet demande : cette regle ne detecte qu'un signal indirect (enumeration
# rapide d'identifiants numeriques sequentiels sur un endpoint d'API par objet),
# pas la faille elle-meme. La correction reelle releve exclusivement du code
# applicatif (verification d'appartenance) - voir remediation_ref.
# Adapter le chemin d'API et les seuils au contexte reel du projet avant activation.

# Compteur d'acces distincts par identifiant numerique sur un meme endpoint d'objet,
# par IP, sur fenetre glissante de 60s (signal d'enumeration, pas de preuve de BOLA).
SecRule REQUEST_URI "@rx ^/api/[a-zA-Z0-9_/-]+/[0-9]+(/|$)" \
    "id:9503001,\
    phase:1,\
    chain,\
    pass,\
    nolog,\
    setvar:'ip.bola_object_id_hits=+1',\
    expirevar:'ip.bola_object_id_hits=60'"
    SecRule REQUEST_METHOD "@rx ^(GET|PUT|DELETE|PATCH)$"

# Alerte (pas de blocage par defaut) si un volume anormal d'identifiants numeriques
# distincts est sollicite depuis une meme IP sur un endpoint d'objet - indicateur
# d'enumeration sequentielle possible, a corroborer avec les logs applicatifs.
SecRule IP:BOLA_OBJECT_ID_HITS "@gt 50" \
    "id:9503002,\
    phase:1,\
    pass,\
    log,\
    msg:'Volume anormal de requetes sur identifiants d''objets numeriques sequentiels (signal d''enumeration, corroborer avec l''API - BOLA potentielle non confirmee par le WAF)',\
    logdata:'bola_object_id_hits=%{ip.bola_object_id_hits}',\
    tag:'securecode-ai/authorization/bola',\
    severity:'NOTICE'"

# Note operateur : cette regle ne bloque pas par defaut (pass/log) car un WAF
# perimetre ne peut pas distinguer un acces legitime d'un acces non autorise au
# niveau objet - seul le code applicatif dispose du contexte d'appartenance.
# Passer en 'deny' avec rate limiting strict uniquement en mesure compensatoire
# temporaire, jamais comme correction definitive.
# remediation_ref: rules/remediation/bola.md
# knowledge_ref: knowledge/authorization/bola.md
