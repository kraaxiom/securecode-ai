# slug: weak-password
# cwe: CWE-521
# owasp: A07:2021-Identification and Authentication Failures
# Note honnete : la politique de mot de passe (longueur minimale, verification contre les
# fuites connues) est un controle applicatif au moment de l'inscription/changement de mot
# de passe - un WAF perimetrique ne peut pas evaluer fiablement la force d'une valeur de
# mot de passe en transit (souvent chiffree en TLS jusqu'a l'application, et toute
# inspection de contenu de mot de passe par un WAF serait elle-meme une mauvaise pratique
# de securite). Ce controle appartient exclusivement a la couche application.

# Aucune regle de detection/blocage perimetrique pertinente n'est ecrite ici : inspecter
# ou journaliser la valeur d'un mot de passe au niveau WAF constituerait en soi une
# mauvaise pratique (exposition du secret dans les logs du reverse proxy).
# id reserve pour tracabilite documentaire : 9502016 (non utilise par une SecRule active).
#
# Ce controle relève exclusivement de la couche application :
# - longueur minimale d'au moins 12 caracteres, sans regle de composition artificielle,
# - verification contre une liste de mots de passe compromis connus,
# - pas de rotation periodique forcee sans motif (fuite avérée).
# Voir remediation_ref pour les correctifs par langage et knowledge_ref pour le detail
# de la vulnerabilite.
# remediation_ref: rules/remediation/weak-password.md
# knowledge_ref: knowledge/auth/weak-password.md
