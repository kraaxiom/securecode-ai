# WAF rule — blind-sql-injection (CWE-89)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/blind-sql-injection.md)

SecRule ARGS "@rx (?i:\b(sleep|benchmark|pg_sleep|waitfor\s+delay)\s*\()" \
    "id:9500000,\
    phase:2,\
    deny,\
    msg:'Détection d\'une fonction de temporisation SQL utilisée pour une injection aveugle',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/blind-sql-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:\b(and|or)\s+\d+\s*=\s*\d+\b|\b(and|or)\s+'[^']*'\s*=\s*'[^']*')" \
    "id:9500001,\
    phase:2,\
    deny,\
    msg:'Détection d\'une condition booléenne typique d\'injection SQL aveugle',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/blind-sql-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:\bif\s*\(.{1,80}\)\s*(sleep|select)\b)" \
    "id:9500002,\
    phase:2,\
    deny,\
    msg:'Détection d\'une structure conditionnelle SQL combinée à une temporisation',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/blind-sql-injection',\
    severity:'CRITICAL'"
