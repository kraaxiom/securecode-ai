# WAF rule — error-sqli (CWE-89)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/error-sqli.md)

SecRule ARGS "@rx (?i:\b(extractvalue|updatexml|exp)\s*\()" \
    "id:9500018,\
    phase:2,\
    deny,\
    msg:'Détection d\'une fonction SQL utilisée pour provoquer une erreur exploitable (extractvalue/updatexml)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/error-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:'\s*(and|or)\s*.{0,40}\s*(select|convert|cast)\s*\()" \
    "id:9500019,\
    phase:2,\
    deny,\
    msg:'Détection d\'une sous-requête SQL imbriquée typique d\'injection basée sur les erreurs',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/error-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:\bxpath\s*\(|\bfloor\s*\(\s*rand\s*\()" \
    "id:9500020,\
    phase:2,\
    deny,\
    msg:'Détection d\'un motif d\'injection SQL basé sur les erreurs XPath ou double requête',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/error-sqli',\
    severity:'CRITICAL'"
