# WAF rule — http-parameter-pollution (CWE-235)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/http-parameter-pollution.md)

SecRule ARGS_NAMES "@detectSQLi" \
    "id:9500108,\
    phase:2,\
    pass,\
    nolog,\
    skipAfter:END_HPP_CHECK,\
    t:none"

SecRule ARGS_NAMES "!@unique" \
    "id:9500109,\
    phase:2,\
    deny,\
    msg:'Pollution de paramètres HTTP détectée : nom de paramètre présent en plusieurs occurrences dans la même requête',\
    logdata:'Matched Data: %{MATCHED_VAR_NAME} duplicated',\
    tag:'securecode-ai/injections/http-parameter-pollution',\
    severity:'WARNING'"

SecMarker END_HPP_CHECK

SecRule REQUEST_URI "@rx ([?&])(\w+)=.*\1\2=" \
    "id:9500110,\
    phase:1,\
    deny,\
    msg:'Duplication du même nom de paramètre détectée dans la query string',\
    logdata:'Matched Data: %{MATCHED_VAR} found within REQUEST_URI',\
    tag:'securecode-ai/injections/http-parameter-pollution',\
    severity:'WARNING'"
