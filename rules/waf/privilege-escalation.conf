# slug: privilege-escalation
# cwe: CWE-269
# owasp: A01:2021-Broken Access Control
# Regle de perimetre (WAF) - valeur tres limitee pour une escalade de privileges.
# Un WAF perimetre ne connait ni la hierarchie de roles de l'application ni
# l'identite/le niveau de privilege reel de l'appelant : il ne peut pas
# determiner si une attribution de role est legitime. Cette regle se limite a
# journaliser les requetes de modification touchant des champs de role/privilege
# sur des endpoints de gestion de compte, comme signal de corroboration - pas de
# preuve d'escalade. La correction reelle releve exclusivement de la
# verification hierarchique de role cote applicatif - voir remediation_ref.

# Journalisation des requetes de modification vers des endpoints de gestion de
# compte/equipe/role portant un champ de role/permission dans le payload.
SecRule REQUEST_URI "@rx /(users?|account|team|members?)(/|$).*" \
    "id:9503080,\
    phase:2,\
    chain,\
    pass,\
    log,\
    msg:'Modification d\'un champ de role/permission sur un endpoint de gestion de compte (signal a corroborer avec la verification hierarchique de role applicative - escalade de privileges non confirmee par le WAF)',\
    logdata:'Matched Data: %{MATCHED_VAR} dans %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/authorization/privilege-escalation',\
    severity:'NOTICE'"
    SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH)$" "chain"
    SecRule REQUEST_BODY "@rx \"(role|is_?admin|permissions?|privileg\w*)\"\s*:" "t:none"

# Alerte si une meme IP multiplie les tentatives de modification de champs de
# role sur des endpoints de gestion de compte en fenetre courte - signal
# d'essais successifs a corroborer avec les journaux applicatifs de controle de
# role.
SecRule REQUEST_URI "@rx /(users?|account|team|members?)(/|$).*" \
    "id:9503081,\
    phase:2,\
    chain,\
    pass,\
    nolog,\
    setvar:'ip.privesc_role_attempts=+1',\
    expirevar:'ip.privesc_role_attempts=300'"
    SecRule REQUEST_BODY "@rx \"(role|is_?admin|permissions?|privileg\w*)\"\s*:" "t:none"

SecRule IP:PRIVESC_ROLE_ATTEMPTS "@gt 10" \
    "id:9503082,\
    phase:2,\
    pass,\
    log,\
    msg:'Volume anormal de tentatives de modification de champs de role depuis une meme IP (signal a corroborer - escalade de privileges non confirmee par le WAF)',\
    logdata:'privesc_role_attempts=%{ip.privesc_role_attempts}',\
    tag:'securecode-ai/authorization/privilege-escalation',\
    severity:'NOTICE'"

# Note operateur : regles en mode journalisation uniquement (pass/log), sans
# blocage - un champ "role" peut etre legitime selon le contexte (invitation
# geree par un administrateur habilite). Le WAF fournit un signal de
# corroboration perimetrique en defense en profondeur uniquement.
# remediation_ref: rules/remediation/privilege-escalation.md
# knowledge_ref: knowledge/authorization/privilege-escalation.md
