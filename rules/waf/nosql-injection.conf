# WAF rule — nosql-injection (CWE-943)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/nosql-injection.md)

SecRule ARGS|REQUEST_BODY "@rx \"\s*\$(where|ne|gt|gte|lt|lte|regex|or|and|exists)\s*\"\s*:" \
    "id:9500203,\
    phase:2,\
    deny,\
    msg:'Opérateur de requête NoSQL ($where/$ne/$gt/...) détecté dans le corps ou les paramètres',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/nosql-injection',\
    severity:'HIGH'"

SecRule ARGS "@rx ^\s*\{.*\$" \
    "id:9500204,\
    phase:2,\
    deny,\
    msg:'Structure JSON contenant un opérateur MongoDB détectée dans un paramètre attendu comme scalaire',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/nosql-injection',\
    severity:'HIGH'"

SecRule REQUEST_BODY "@rx \$where\s*:\s*[\"']?function" \
    "id:9500205,\
    phase:2,\
    deny,\
    msg:'Injection potentielle de fonction JavaScript via l opérateur $where MongoDB',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/nosql-injection',\
    severity:'CRITICAL'"
