# slug: mfa-bypass
# cwe: CWE-287
# owasp: A07:2021-Identification and Authentication Failures
# Note honnete : un contournement de MFA resulte d'une faille de sequencement dans la
# logique applicative (etat de session/token emis avant validation du second facteur).
# Un WAF perimetrique ne voit pas l'etat de session serveur ni la logique metier et ne
# peut donc pas corriger ce controle - il peut seulement signaler des motifs d'appel
# suspects a des endpoints alternatifs connus pour contourner le flux MFA principal.

# Signale (log uniquement) les appels a des endpoints d'API mobiles/legacy connus pour
# ne pas appliquer le meme flux MFA que l'interface web principale - chemins a adapter
# precisement selon l'inventaire reel des endpoints du projet.
SecRule REQUEST_URI "@rx /(api/v1/mobile-login|api/legacy/auth|api/internal/session)" \
    "id:9502011,\
    phase:1,\
    pass,\
    log,\
    msg:'Requete vers un endpoint d''authentification alternatif potentiellement non couvert par le flux MFA principal (a auditer)',\
    tag:'securecode-ai/auth/mfa-bypass',\
    severity:'NOTICE'"

# Ce controle perimetrique est purement indicatif (inventaire des points d'entree
# alternatifs) et ne peut jamais corriger un defaut de sequencement applicatif du MFA.
# La correction reelle doit garantir cote serveur qu'aucune session pleinement
# privilegiee n'est emise avant validation effective du second facteur.
# remediation_ref: rules/remediation/mfa-bypass.md
# knowledge_ref: knowledge/auth/mfa-bypass.md
