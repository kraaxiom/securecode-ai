# WAF rule — csv-injection (CWE-1236)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/csv-injection.md)

SecRule ARGS "@rx ^[=+\-@]" \
    "id:9500015,\
    phase:2,\
    deny,\
    msg:'Détection d\'un caractère déclencheur de formule en début de champ (injection CSV/Excel)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/csv-injection',\
    severity:'MEDIUM'"

SecRule ARGS "@rx (?i:hyperlink\s*\(|=\s*cmd\s*\||dde\s*\()" \
    "id:9500016,\
    phase:2,\
    deny,\
    msg:'Détection d\'une fonction tableur dangereuse (HYPERLINK/DDE) dans un champ exporté',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/csv-injection',\
    severity:'HIGH'"

SecRule ARGS "@rx ^\t[=+\-@]|^\r[=+\-@]" \
    "id:9500017,\
    phase:2,\
    deny,\
    msg:'Détection d\'un caractère déclencheur de formule précédé d\'une tabulation ou d\'un retour chariot',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/csv-injection',\
    severity:'MEDIUM'"
