# slug: reflected-xss | CWE-79 | OWASP A03:2021-Injection
# Filtre périmétrique générique sur les paramètres de requête et en-têtes reflétés en HTML.
# Défense en profondeur — ne remplace pas l'encodage contextuel côté application.

SecRule ARGS "@rx (?i)<script[\s>/]|</script|javascript:|on(error|load|mouseover|focus|click)\s*=" \
    "id:9501008,phase:2,t:none,t:urlDecodeUni,t:htmlEntityDecode,log,deny,status:403,msg:'Motif de script actif détecté dans un paramètre de requête (risque XSS réfléchi)',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"

SecRule ARGS_NAMES "@rx (?i)<script[\s>/]|on(error|load)\s*=" \
    "id:9501009,phase:2,t:none,t:urlDecodeUni,log,deny,status:403,msg:'Motif de script actif détecté dans un nom de paramètre de requête (risque XSS réfléchi)',logdata:'Arg name: %{MATCHED_VAR}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"
