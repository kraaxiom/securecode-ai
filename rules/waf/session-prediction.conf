# slug: session-prediction
# cwe: CWE-330
# owasp: A07:2021-Identification and Authentication Failures
# Note honnete : la previsibilite d'un identifiant de session est une propriete du
# generateur utilise cote application (CSPRNG vs generateur faible) - un WAF perimetrique
# ne voit qu'un identifiant deja genere et ne peut pas juger fiablement de son entropie
# ni corriger le generateur. Ce fichier documente une regle de detection perimetrique
# limitee et honnete sur ses bornes, avec renvoi explicite vers la couche applicative.

# Signale (log uniquement) les identifiants de session dont le format observe est
# anormalement court pour un identifiant de session moderne (ex: purement numerique,
# ou inferieur a 22 caracteres pour un encodage base64url de 128 bits) - motif indicatif,
# a adapter precisement au format d'identifiant reellement utilise par le projet.
SecRule REQUEST_COOKIES:sessionid "@rx ^[0-9]{1,10}$" \
    "id:9502015,\
    phase:1,\
    pass,\
    log,\
    msg:'Identifiant de session au format purement numerique court, potentiellement previsible (a auditer)',\
    tag:'securecode-ai/auth/session-prediction',\
    severity:'NOTICE'"

# Ce controle perimetrique ne peut detecter qu'un format grossierement suspect, jamais
# mesurer l'entropie reelle du generateur. La correction doit garantir cote application
# l'usage exclusif d'un CSPRNG dedie avec au moins 128 bits d'entropie pour tout
# identifiant de session.
# remediation_ref: rules/remediation/session-prediction.md
# knowledge_ref: knowledge/auth/session-prediction.md
