# slug: markdown-xss | CWE-79 | OWASP A03:2021-Injection
# Filtre périmétrique sur le contenu Markdown soumis : blocage des schémas d'URL actifs et du
# HTML brut dangereux. Défense en profondeur — ne remplace pas la sanitisation post-rendu.

SecRule ARGS "@rx (?i)\]\(\s*(javascript|data):" \
    "id:9501004,phase:2,t:none,t:urlDecodeUni,log,deny,status:403,msg:'Lien/image Markdown avec schéma d''URL actif (javascript:/data:) détecté',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"

SecRule ARGS "@rx (?i)<script[\s>/]|<iframe[\s>/]|on(error|load)\s*=" \
    "id:9501005,phase:2,t:none,t:htmlEntityDecode,log,deny,status:403,msg:'Bloc HTML brut actif détecté dans un contenu Markdown soumis',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"
