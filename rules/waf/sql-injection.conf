# WAF rule — sql-injection (CWE-89)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/sql-injection.md)

SecRule ARGS "@rx (?i:\bor\b\s+\d+\s*=\s*\d+|\band\b\s+\d+\s*=\s*\d+)" \
    "id:9500214,\
    phase:2,\
    deny,\
    msg:'Tautologie booléenne typique d une injection SQL (OR 1=1 / AND 1=1) détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/sql-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:--|#|/\*).{0,5}$|;\s*(?i:drop|delete|update|insert)\s" \
    "id:9500215,\
    phase:2,\
    deny,\
    msg:'Séquence de commentaire SQL ou requête empilée (stacked query) détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/sql-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:sleep\s*\(|benchmark\s*\(|waitfor\s+delay|pg_sleep\s*\()" \
    "id:9500216,\
    phase:2,\
    deny,\
    msg:'Fonction de temporisation SQL (time-based injection) détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/sql-injection',\
    severity:'CRITICAL'"
