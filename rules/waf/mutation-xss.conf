# slug: mutation-xss | CWE-79 | OWASP A03:2021-Injection
# Filtre périmétrique visant les constructions HTML connues pour survivre à des cycles de
# renormalisation navigateur (balises nommées imbriquées, attributs pseudo-fermés). Défense en
# profondeur — la correction réelle est une sanitisation DOM maintenue côté client.

SecRule ARGS "@rx (?i)<(noscript|noembed|template|svg|math)[^>]*>.*<(script|img|iframe)" \
    "id:9501006,phase:2,t:none,t:htmlEntityDecode,log,deny,status:403,msg:'Structure HTML imbriquée connue pour favoriser des mutations de parsing (mXSS) détectée',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"

SecRule ARGS "@rx (?i)style\s*=\s*[\"'][^\"']*expression\s*\(" \
    "id:9501007,phase:2,t:none,t:htmlEntityDecode,log,deny,status:403,msg:'Attribut style avec expression CSS active détecté (vecteur de mutation connu)',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"
