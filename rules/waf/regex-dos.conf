# WAF rule — regex-dos (CWE-1333)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/regex-dos.md)
# Note : la détection du ReDoS au niveau WAF est intrinsèquement limitée (un WAF ne peut pas évaluer la
# complexité de la regex applicative cible). Ces règles ne détectent que des motifs d'entrée suspects
# (répétition/longueur excessive) et complètent, sans les remplacer, des contrôles de rate-limiting et de timeout.

SecRule ARGS "@rx (.)\1{200,}" \
    "id:9500209,\
    phase:2,\
    deny,\
    msg:'Répétition excessive d un même caractère détectée dans un paramètre (motif typique d entrée conçue pour un ReDoS)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/regex-dos',\
    severity:'MEDIUM'"

SecRule ARGS "@gt 5000" \
    "id:9500210,\
    phase:2,\
    t:length,\
    deny,\
    msg:'Longueur de paramètre anormalement élevée susceptible d alimenter un moteur regex vulnérable côté application',\
    logdata:'Matched Data length: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/regex-dos',\
    severity:'MEDIUM'"

SecRule ARGS "@rx (?:[a-zA-Z0-9]{1,3}[+*]){10,}" \
    "id:9500211,\
    phase:2,\
    deny,\
    msg:'Motif d entrée avec quantificateurs répétés imbriqués détecté, potentiellement conçu pour exploiter une regex vulnérable',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/regex-dos',\
    severity:'MEDIUM'"
