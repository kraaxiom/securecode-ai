# WAF rule — xpath-injection (CWE-643)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/xpath-injection.md)

SecRule ARGS "@rx '\s*(or|and)\s*'?\d*'?\s*=\s*'?\d*'?" \
    "id:9500315,\
    phase:2,\
    deny,\
    msg:'Motif de tautologie booléenne de type XPath/SQL détecté dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/xpath-injection',\
    severity:'HIGH'"

SecRule ARGS "@rx \[\s*position\s*\(\s*\)|//\*\[|/text\(\)\s*=" \
    "id:9500316,\
    phase:2,\
    deny,\
    msg:'Motif d''expression XPath suspecte (position()/wildcard) détecté dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/xpath-injection',\
    severity:'HIGH'"

SecRule ARGS "@rx \bcount\s*\(|\bconcat\s*\(.*\)|\bsubstring\s*\(" \
    "id:9500317,\
    phase:2,\
    deny,\
    msg:'Fonction XPath sensible (count/concat/substring) détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/xpath-injection',\
    severity:'MEDIUM'"
