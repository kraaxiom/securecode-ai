# WAF rule — command-injection (CWE-78)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/command-injection.md)

SecRule ARGS "@rx [;&|`]\s*(cat|ls|whoami|id|uname|wget|curl|nc|bash|sh|powershell|cmd)\b" \
    "id:9500009,\
    phase:2,\
    deny,\
    msg:'Détection d\'un métacaractère shell combiné à un binaire système courant',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/command-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx \$\([^)]*\)|`[^`]*`" \
    "id:9500010,\
    phase:2,\
    deny,\
    msg:'Détection d\'une substitution de commande shell ($() ou backticks)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/command-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:&&|\|\|)\s*\w+" \
    "id:9500011,\
    phase:2,\
    deny,\
    msg:'Détection d\'un enchaînement de commandes shell (&& ou ||)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/command-injection',\
    severity:'CRITICAL'"
