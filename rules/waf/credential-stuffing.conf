# slug: credential-stuffing
# cwe: CWE-307
# owasp: A07:2021-Identification and Authentication Failures
# Regle de perimetre (WAF) - detection de volume anormal de tentatives de connexion
# avec des identifiants distincts depuis la meme source (signal comportemental, pas
# une signature de payload). Defense en profondeur : ne remplace jamais MFA ni la
# detection comportementale applicative (voir remediation_ref).

# Comptage des requetes de connexion (tous identifiants confondus) par IP sur 5 minutes.
SecRule REQUEST_URI "@rx /(login|signin|auth)" \
    "id:9502004,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'ip.credstuff_login_count=+1',\
    expirevar:'ip.credstuff_login_count=300'"

# Blocage/alerte si le volume de tentatives de connexion depuis une IP depasse un seuil
# incompatible avec un usage humain normal (exemple : 50 tentatives/5min/IP).
SecRule IP:CREDSTUFF_LOGIN_COUNT "@gt 50" \
    "id:9502005,\
    phase:1,\
    deny,\
    status:429,\
    msg:'Volume de tentatives de connexion incompatible avec un usage humain (credential-stuffing)',\
    logdata:'credstuff_login_count=%{ip.credstuff_login_count}',\
    tag:'securecode-ai/auth/credential-stuffing',\
    severity:'WARNING'"

# Note operateur : seuil indicatif a calibrer sur trafic reel (proxy d'entreprise/NAT
# peuvent partager une IP pour de nombreux utilisateurs legitimes). Deployer d'abord en
# SecRuleEngine DetectionOnly. Ce controle perimetrique reste un complement, jamais un
# substitut au MFA et a la detection comportementale applicative.
# remediation_ref: rules/remediation/credential-stuffing.md
# knowledge_ref: knowledge/auth/credential-stuffing.md
