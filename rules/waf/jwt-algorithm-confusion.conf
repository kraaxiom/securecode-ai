# slug: jwt-algorithm-confusion
# cwe: CWE-347
# owasp: A02:2021-Cryptographic Failures
# Note : cette faille depend du comportement du verificateur JWT cote application
# (choix dynamique de l'algorithme depuis le token) et ne peut pas etre corrigee par un
# WAF perimetrique, qui n'a pas la connaissance de la cle/algorithme attendu par le code.
# Ce fichier documente une regle de detection perimetrique complementaire limitee, et
# renvoie explicitement vers la correction applicative (remediation_ref).

# Signale (log uniquement) la presence d'un en-tete JWT annoncant un algorithme HMAC
# (HS256/HS384/HS512) sur des routes ou l'API documente normalement un algorithme
# asymetrique (RS256/ES256) - a adapter precisement par route selon la configuration reelle.
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+eyJhbGciOiJIUz" \
    "id:9502007,\
    phase:1,\
    pass,\
    log,\
    msg:'Jeton JWT presente avec algorithme HMAC sur une route attendant potentiellement RS256/ES256 (a verifier)',\
    tag:'securecode-ai/auth/jwt-algorithm-confusion',\
    severity:'NOTICE'"

# Ce controle perimetrique ne peut que signaler un motif suspect au niveau de l'en-tete
# du jeton (base64, non decode/verifie ici) - il ne remplace jamais la restriction stricte
# de l'algorithme attendu dans le code de verification applicatif.
# remediation_ref: rules/remediation/jwt-algorithm-confusion.md
# knowledge_ref: knowledge/auth/jwt-algorithm-confusion.md
