# slug: stored-xss | CWE-79 | OWASP A03:2021-Injection
# Filtre périmétrique sur les champs de saisie destinés à être persistés (commentaires, profils,
# avis). Défense en profondeur — ne remplace pas l'encodage contextuel à l'affichage.

SecRule ARGS "@rx (?i)<script[\s>/]|</script|javascript:|on(error|load|mouseover|focus|click)\s*=" \
    "id:9501010,phase:2,t:none,t:urlDecodeUni,t:htmlEntityDecode,log,deny,status:403,msg:'Motif de script actif détecté dans un champ destiné à être persisté (risque XSS stocké)',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"

SecRule REQUEST_BODY "@rx (?i)<iframe[\s>/]|<object[\s>/]|<embed[\s>/]" \
    "id:9501011,phase:2,t:none,t:htmlEntityDecode,log,deny,status:403,msg:'Balise active à haut risque (iframe/object/embed) détectée dans le corps de requête (risque XSS stocké)',logdata:'%{MATCHED_VAR}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"
