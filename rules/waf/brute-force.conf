# slug: brute-force
# cwe: CWE-307
# owasp: A07:2021-Identification and Authentication Failures
# Regle de perimetre (WAF) - limitation de debit sur endpoint d'authentification.
# Defense en profondeur uniquement : ne remplace jamais le verrouillage de compte
# et le rate limiting applicatifs (voir remediation_ref).
# Adapter le chemin d'endpoint (REQUEST_URI) et les seuils au contexte reel du projet
# avant activation en mode block.

SecRule REQUEST_URI "@rx /(login|signin|auth|reset-password|verify-otp)" \
    "id:9502001,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'ip.auth_endpoint_hit=1',\
    expirevar:'ip.auth_endpoint_hit=60'"

# Compteur d'echecs d'authentification par IP sur fenetre glissante de 60s.
# Incremente uniquement si l'application renvoie un statut d'echec d'authentification
# (a adapter : 401/403, ou marqueur applicatif dans le corps de reponse).
SecRule RESPONSE_STATUS "@eq 401" \
    "id:9502002,\
    phase:5,\
    chain,\
    pass,\
    nolog,\
    setvar:'ip.auth_fail_count=+1',\
    expirevar:'ip.auth_fail_count=60'"
    SecRule REQUEST_URI "@rx /(login|signin|auth)"

# Blocage si le compteur d'echecs depasse le seuil calibre (exemple : 10 echecs/60s/IP).
SecRule IP:AUTH_FAIL_COUNT "@gt 10" \
    "id:9502003,\
    phase:1,\
    deny,\
    status:429,\
    msg:'Volume d''echecs d''authentification anormal depuis cette IP (brute-force)',\
    logdata:'auth_fail_count=%{ip.auth_fail_count}',\
    tag:'securecode-ai/auth/brute-force',\
    severity:'WARNING'"

# Note operateur : ce seuil est un point de depart pour calibration en mode log_only
# (SecRuleEngine DetectionOnly) avant passage en blocage strict, afin de mesurer le
# taux de faux positifs sur trafic reel (utilisateurs partageant une IP/NAT).
# remediation_ref: rules/remediation/brute-force.md
# knowledge_ref: knowledge/auth/brute-force.md
