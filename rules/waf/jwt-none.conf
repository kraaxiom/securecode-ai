# slug: jwt-none
# cwe: CWE-347
# owasp: A02:2021-Cryptographic Failures
# Regle de perimetre (WAF) - detection d'un en-tete JWT annoncant l'algorithme "none".
# Cas rare ou un filtrage perimetrique syntaxique reste pertinent (motif d'en-tete
# reconnaissable), mais reste une defense en profondeur : la correction reelle doit se
# faire dans le verificateur JWT applicatif (liste fermee d'algorithmes forts).

# L'en-tete JWT est encode en base64url ; {"alg":"none" se retrouve typiquement sous la
# forme "eyJhbGciOiJub25lI..." une fois encode. On bloque ce motif au niveau de
# l'en-tete Authorization.
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+eyJhbGciOiJub25lI" \
    "id:9502008,\
    phase:1,\
    deny,\
    status:401,\
    msg:'Jeton JWT presente avec algorithme none refuse au perimetre (jwt-none)',\
    tag:'securecode-ai/auth/jwt-none',\
    severity:'CRITICAL'"

# Variante insensible a la casse eventuelle de l'encodage (rare mais possible selon
# l'implementation cliente) - a valider selon le format reellement observe.
SecRule REQUEST_HEADERS:Authorization "@rx (?i)^Bearer\s+ey[A-Za-z0-9_-]*Im5vbmUi" \
    "id:9502009,\
    phase:1,\
    deny,\
    status:401,\
    msg:'Jeton JWT presente avec algorithme none (variante d''encodage) refuse au perimetre',\
    tag:'securecode-ai/auth/jwt-none',\
    severity:'CRITICAL'"

# Cette regle de perimetre est un filet de securite supplementaire, pas un substitut :
# le rejet definitif et fiable de alg:none doit etre impose dans la configuration du
# verificateur JWT applicatif (liste fermee d'algorithmes forts).
# remediation_ref: rules/remediation/jwt-none.md
# knowledge_ref: knowledge/auth/jwt-none.md
