# slug: uxss | CWE-79 | OWASP A03:2021-Injection
# Vérification des en-têtes de réponse sortants pour l'absence de politiques limitant les
# composants tiers (CSP, Permissions-Policy). Défense en profondeur — n'empêche pas une faille
# navigateur/extension elle-même, seulement l'exposition applicative aux composants tiers.

SecRule RESPONSE_HEADERS:Content-Security-Policy "!@rx ." "id:9501014,phase:3,t:none,log,pass,msg:'Réponse sans en-tête Content-Security-Policy — surface d''exposition accrue aux composants tiers (UXSS)',severity:'WARNING',tag:'CWE-79'"

SecRule RESPONSE_HEADERS:Permissions-Policy "!@rx ." "id:9501015,phase:3,t:none,log,pass,msg:'Réponse sans en-tête Permissions-Policy — capacités des composants tiers non restreintes (UXSS)',severity:'WARNING',tag:'CWE-79'"
