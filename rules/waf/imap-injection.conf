# WAF rule — imap-injection (CWE-93)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/imap-injection.md)

SecRule ARGS "@rx (?i)(%0d%0a|%0d|%0a|\r\n|\n)" \
    "id:9500116,\
    phase:2,\
    deny,\
    msg:'Séquence CRLF détectée dans un paramètre lié à la messagerie, risque d\'injection de commande IMAP',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/imap-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i)\b(a\d+\s+(login|select|search|logout|delete|create))\b" \
    "id:9500117,\
    phase:2,\
    deny,\
    msg:'Motif de commande IMAP additionnelle détecté dans un paramètre de recherche ou de dossier',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/imap-injection',\
    severity:'CRITICAL'"
