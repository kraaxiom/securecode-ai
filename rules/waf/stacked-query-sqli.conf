# WAF rule — stacked-query-sqli (CWE-89)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/stacked-query-sqli.md)

SecRule ARGS "@rx ;\s*(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|EXEC)\s" \
    "id:9500306,\
    phase:2,\
    deny,\
    msg:'Point-virgule suivi d''une seconde instruction SQL détecté (stacked query)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/stacked-query-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx ;\s*(DROP\s+TABLE|DROP\s+DATABASE|TRUNCATE\s+TABLE)" \
    "id:9500307,\
    phase:2,\
    deny,\
    msg:'Instruction SQL destructive empilée après point-virgule détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/stacked-query-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx ;\s*(EXEC(UTE)?\s+(sp_|xp_)|CALL\s)" \
    "id:9500308,\
    phase:2,\
    deny,\
    msg:'Appel de procédure stockée empilé après point-virgule détecté',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/stacked-query-sqli',\
    severity:'CRITICAL'"
