# slug: dom-xss | CWE-79 | OWASP A03:2021-Injection
# Le fragment d'URL (#...) n'est jamais transmis au serveur ; ce filtre couvre les paramètres de
# requête et corps qui peuvent être repris par du JavaScript côté client (source DOM XSS courante).
# Défense en profondeur — ne remplace pas l'usage d'API texte / sanitisation DOM côté client.

SecRule ARGS "@rx (?i)<script[\s>/]|javascript:|data:text/html|on(error|load|message|mouseover)\s*=" \
    "id:9501002,phase:2,t:none,t:urlDecodeUni,log,deny,status:403,msg:'Motif de script actif détecté dans un paramètre susceptible d''être réinjecté dans un sink DOM',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"

SecRule REQUEST_HEADERS:Referer "@rx (?i)<script[\s>/]|javascript:" \
    "id:9501003,phase:1,t:none,log,deny,status:403,msg:'Motif de script actif détecté dans l''en-tête Referer (source potentielle de DOM XSS)',logdata:'%{MATCHED_VAR}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"
