# WAF rule — ssti (CWE-1336)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/ssti.md)

SecRule ARGS "@rx (\{\{.*(config|self|class|mro|subclasses|exec|import)|<%.*(exec|eval|runtime))" \
    "id:9500303,\
    phase:2,\
    deny,\
    msg:'Séquence de délimiteur de template combinée à un mot-clé sensible détectée (SSTI)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ssti',\
    severity:'CRITICAL'"

SecRule ARGS "@rx \$\{.*(class|Runtime|exec)\}" \
    "id:9500304,\
    phase:2,\
    deny,\
    msg:'Expression de type Expression Language/Template contenant un appel dangereux détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ssti',\
    severity:'CRITICAL'"

SecRule ARGS "@rx #\{.*(exec|eval|require)" \
    "id:9500305,\
    phase:2,\
    deny,\
    msg:'Délimiteur de template Ruby/Slim combiné à un appel d''exécution détecté',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ssti',\
    severity:'CRITICAL'"
