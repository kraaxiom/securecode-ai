# slug: oauth-misconfiguration
# cwe: CWE-287
# owasp: A07:2021-Identification and Authentication Failures
# Regle de perimetre (WAF) - signale les requetes d'autorisation OAuth sans parametre
# state, un indicateur syntaxique simple observable au niveau HTTP. Ne peut pas valider
# la correspondance exacte du redirect_uri ni la verification du jeton d'identite, qui
# relevent de la logique applicative (voir remediation_ref).

# Signale (log) une requete vers l'endpoint d'autorisation sans parametre state present.
SecRule REQUEST_URI "@rx /oauth/authorize" \
    "id:9502012,\
    phase:1,\
    chain,\
    pass,\
    log,\
    msg:'Requete d''autorisation OAuth sans parametre state (CSRF potentielle sur le callback)',\
    tag:'securecode-ai/auth/oauth-misconfiguration',\
    severity:'WARNING'"
    SecRule ARGS:state "!@rx ." "chain"
    SecRule REQUEST_METHOD "@streq GET"

# Ce controle perimetrique ne verifie que la presence syntaxique du parametre state, pas
# son unicite/imprevisibilite ni sa verification effective au retour, ni la correspondance
# exacte du redirect_uri, ni la validation du jeton d'identite (iss/aud/signature) -
# controles qui doivent etre imposes dans le code applicatif.
# remediation_ref: rules/remediation/oauth-misconfiguration.md
# knowledge_ref: knowledge/auth/oauth-misconfiguration.md
