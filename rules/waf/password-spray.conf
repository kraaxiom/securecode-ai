# slug: password-spray
# cwe: CWE-307
# owasp: A07:2021-Identification and Authentication Failures
# Regle de perimetre (WAF) - detection agregee des echecs d'authentification par IP,
# tous identifiants confondus, complementaire au controle par compte (voir brute-force.conf).
# Defense en profondeur : ne remplace jamais la politique de mot de passe ni le MFA
# (voir remediation_ref).

# Compteur d'identifiants distincts ayant echoue depuis la meme IP sur 10 minutes.
# Utilise une collection persistante par IP ; necessite SecAction d'initialisation de
# la collection ip en amont dans la configuration globale (hors de ce fichier).
SecRule RESPONSE_STATUS "@eq 401" \
    "id:9502013,\
    phase:5,\
    chain,\
    pass,\
    nolog,\
    setvar:'ip.pwspray_fail_count=+1',\
    expirevar:'ip.pwspray_fail_count=600'"
    SecRule REQUEST_URI "@rx /(login|signin|auth)"

# Blocage si le volume d'echecs agreges depuis cette IP depasse un seuil incompatible
# avec un ciblage sur un petit nombre de comptes (exemple : 30 echecs/10min/IP, tous
# identifiants confondus).
SecRule IP:PWSPRAY_FAIL_COUNT "@gt 30" \
    "id:9502014,\
    phase:1,\
    deny,\
    status:429,\
    msg:'Volume d''echecs d''authentification agrege sur de nombreux comptes depuis cette IP (password-spray)',\
    logdata:'pwspray_fail_count=%{ip.pwspray_fail_count}',\
    tag:'securecode-ai/auth/password-spray',\
    severity:'WARNING'"

# Note operateur : seuil a calibrer en SecRuleEngine DetectionOnly avant blocage strict ;
# ce controle perimetrique complete, sans le remplacer, le renforcement de la politique
# de mot de passe et le deploiement du MFA cote application.
# remediation_ref: rules/remediation/password-spray.md
# knowledge_ref: knowledge/auth/password-spray.md
