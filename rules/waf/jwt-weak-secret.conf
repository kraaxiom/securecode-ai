# slug: jwt-weak-secret
# cwe: CWE-326
# owasp: A02:2021-Cryptographic Failures
# Note honnete : la robustesse d'un secret de signature JWT est une propriete de la
# configuration/du code applicatif (entropie du secret, gestionnaire de secrets, rotation).
# Un WAF perimetrique ne voit ni le secret ni sa force et ne peut donc pas detecter ni
# corriger cette faiblesse - aucune regle SecRule pertinente ne peut etre ecrite ici sans
# etre trompeuse. Ce fichier est produit pour la coherence du format des 4 extensions,
# avec une note explicite renvoyant vers la couche applicative.

# Aucune regle de detection/blocage perimetrique n'est applicable a ce controle.
# id reserve pour tracabilite documentaire : 9502010 (non utilise par une SecRule active).
#
# Ce controle relève exclusivement de la couche application :
# - generation du secret HMAC avec une entropie suffisante (256 bits minimum pour HS256),
# - stockage dans un gestionnaire de secrets dedie (jamais en dur dans le code/depot),
# - rotation reguliere et procedure de revocation.
# Voir remediation_ref pour les correctifs par langage et knowledge_ref pour le detail
# de la vulnerabilite.
# remediation_ref: rules/remediation/jwt-weak-secret.md
# knowledge_ref: knowledge/auth/jwt-weak-secret.md
