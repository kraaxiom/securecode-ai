# WAF rule — xml-injection (CWE-91)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/xml-injection.md)

SecRule ARGS "@rx <[a-zA-Z][a-zA-Z0-9_:-]*[^>]*>.*</[a-zA-Z][a-zA-Z0-9_:-]*>" \
    "id:9500312,\
    phase:2,\
    deny,\
    msg:'Fragment de balise XML détecté dans un paramètre non censé contenir de XML',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/xml-injection',\
    severity:'MEDIUM'"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i:xml)" \
    "chain,\
    id:9500313,\
    phase:2,\
    deny,\
    msg:'Balise XML inattendue injectée dans un champ texte au sein d''un corps XML',\
    tag:'securecode-ai/injections/xml-injection',\
    severity:'MEDIUM'"
    SecRule ARGS "@rx [<>&]{1}[a-zA-Z]*[<>]" ""

SecRule ARGS "@rx &(#x?[0-9a-fA-F]+|[a-zA-Z]+);" \
    "id:9500314,\
    phase:2,\
    deny,\
    msg:'Référence d''entité ou caractère XML encodé suspecte détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/xml-injection',\
    severity:'MEDIUM'"
