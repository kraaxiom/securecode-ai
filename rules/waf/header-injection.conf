# WAF rule — header-injection (CWE-113)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/header-injection.md)

SecRule ARGS "@rx (?i)(%0d%0a|%0d|%0a|\r\n|\n)" \
    "id:9500106,\
    phase:2,\
    deny,\
    msg:'Séquence CRLF détectée dans un paramètre susceptible d\'être réinjecté dans un en-tête HTTP',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/header-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i)(set-cookie|content-disposition|location)\s*:" \
    "id:9500107,\
    phase:2,\
    deny,\
    msg:'Tentative d\'injection d\'un en-tête HTTP additionnel via un paramètre applicatif',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/header-injection',\
    severity:'CRITICAL'"
