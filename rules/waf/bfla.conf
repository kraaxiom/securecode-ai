# slug: bfla
# cwe: CWE-862
# owasp: A01:2021-Broken Access Control
# Regle de perimetre (WAF) - valeur limitee pour une vulnerabilite d'autorisation
# applicative (BFLA). Un WAF perimetre ne connait pas le role de l'appelant ni la
# matrice de permissions de l'application : cette regle ne peut que journaliser les
# acces directs a des chemins conventionnellement sensibles (admin, gestion), pas
# confirmer un contournement de controle de role. La correction reelle releve
# exclusivement du code applicatif (verification de role centralisee) - voir
# remediation_ref. Adapter la liste de chemins au contexte reel du projet.

# Journalisation des acces a des chemins d'administration/gestion frequemment
# non couverts par l'interface standard, pour corroboration avec les logs
# applicatifs de controle de role (pas de blocage aveugle : ces chemins peuvent
# etre legitimement accedes par des comptes autorises).
SecRule REQUEST_URI "@rx /(admin|manage|internal|backoffice)(/|$)" \
    "id:9503010,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'ip.bfla_sensitive_hits=+1',\
    expirevar:'ip.bfla_sensitive_hits=300'"

# Alerte si un volume anormal de methodes de modification (POST/PUT/DELETE/PATCH)
# est envoye vers des chemins sensibles depuis une meme IP - signal a corroborer
# avec le controle de role applicatif, pas une preuve de BFLA.
SecRule REQUEST_URI "@rx /(admin|manage|internal|backoffice)(/|$)" \
    "id:9503011,\
    phase:1,\
    chain,\
    pass,\
    log,\
    msg:'Volume anormal de requetes de modification vers des chemins sensibles (signal a corroborer avec le controle de role applicatif - BFLA potentielle non confirmee par le WAF)',\
    logdata:'bfla_sensitive_hits=%{ip.bfla_sensitive_hits}',\
    tag:'securecode-ai/authorization/bfla',\
    severity:'NOTICE'"
    SecRule REQUEST_METHOD "@rx ^(POST|PUT|DELETE|PATCH)$" "chain"
    SecRule IP:BFLA_SENSITIVE_HITS "@gt 20"

# Note operateur : regle en mode journalisation uniquement (pass/log). Le WAF ne
# doit jamais etre presente comme le controle de role - il fournit seulement un
# signal de corroboration perimetrique en defense en profondeur.
# remediation_ref: rules/remediation/bfla.md
# knowledge_ref: knowledge/authorization/bfla.md
