# WAF rule — ssi (CWE-97)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/ssi.md)

SecRule ARGS "@rx <!--#(exec|include|echo|config|fsize|flastmod)\s" \
    "id:9500300,\
    phase:2,\
    deny,\
    msg:'Directive Server-Side Include détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ssi',\
    severity:'HIGH'"

SecRule REQUEST_BODY "@rx <!--#exec\s+(cmd|cgi)\s*=" \
    "id:9500301,\
    phase:2,\
    deny,\
    msg:'Tentative d''exécution de commande via directive SSI exec dans le corps de la requête',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ssi',\
    severity:'CRITICAL'"

SecRule ARGS "@rx <!--#(printenv|include\s+virtual)" \
    "id:9500302,\
    phase:2,\
    deny,\
    msg:'Directive SSI de divulgation d''environnement ou d''inclusion de fichier détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ssi',\
    severity:'HIGH'"
