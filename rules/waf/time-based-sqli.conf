# WAF rule — time-based-sqli (CWE-89)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/time-based-sqli.md)

SecRule ARGS "@rx (?i:SLEEP\s*\(|BENCHMARK\s*\()" \
    "id:9500309,\
    phase:2,\
    deny,\
    msg:'Fonction de délai SQL MySQL (SLEEP/BENCHMARK) détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/time-based-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:WAITFOR\s+DELAY\s+'?\d)" \
    "id:9500310,\
    phase:2,\
    deny,\
    msg:'Fonction de délai SQL Server WAITFOR DELAY détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/time-based-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:pg_sleep\s*\(|dbms_lock\.sleep\s*\()" \
    "id:9500311,\
    phase:2,\
    deny,\
    msg:'Fonction de délai SQL PostgreSQL/Oracle détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/time-based-sqli',\
    severity:'CRITICAL'"
