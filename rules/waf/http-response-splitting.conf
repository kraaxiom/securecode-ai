# WAF rule — http-response-splitting (CWE-113)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/http-response-splitting.md)

SecRule ARGS "@rx (?i)(%0d%0a|%0d|%0a|\r\n|\n)" \
    "id:9500114,\
    phase:2,\
    deny,\
    msg:'Séquence CRLF détectée dans un paramètre susceptible d\'être utilisé dans une redirection ou un en-tête, risque de fractionnement de réponse HTTP',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/http-response-splitting',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i)(http/1\.[01]\s+\d{3}|content-length\s*:)" \
    "id:9500115,\
    phase:2,\
    deny,\
    msg:'Tentative d\'injection d\'une seconde réponse HTTP détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/http-response-splitting',\
    severity:'CRITICAL'"
