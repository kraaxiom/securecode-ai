# WAF rule — crlf-injection (CWE-93)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/crlf-injection.md)

SecRule ARGS "@rx %0[dD]%0[aA]|\r\n|%0[aA]%0[dD]" \
    "id:9500012,\
    phase:2,\
    deny,\
    msg:'Détection d\'une séquence CRLF encodée ou brute dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/crlf-injection',\
    severity:'HIGH'"

SecRule ARGS "@rx (?i:(set-cookie|location|content-length)\s*:)" \
    "id:9500013,\
    phase:2,\
    deny,\
    msg:'Détection d\'une tentative d\'injection d\'en-tête HTTP via un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/crlf-injection',\
    severity:'HIGH'"

SecRule REQUEST_HEADERS "@rx %0[dD]%0[aA]" \
    "id:9500014,\
    phase:1,\
    deny,\
    msg:'Détection d\'une séquence CRLF encodée dans un en-tête de requête',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/crlf-injection',\
    severity:'HIGH'"
