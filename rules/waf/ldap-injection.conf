# WAF rule — ldap-injection (CWE-90)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/ldap-injection.md)

SecRule ARGS "@rx \([\|\&][^)]*\)" \
    "id:9500200,\
    phase:2,\
    deny,\
    msg:'Métacaractères de filtre LDAP composé (&|) détectés dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ldap-injection',\
    severity:'HIGH'"

SecRule ARGS "@rx (?:\*\)|\)\(|\(\|)" \
    "id:9500201,\
    phase:2,\
    deny,\
    msg:'Séquence typique de filtre LDAP toujours vrai ou de fermeture anticipée détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ldap-injection',\
    severity:'HIGH'"

SecRule ARGS "@rx [\x00]" \
    "id:9500202,\
    phase:2,\
    deny,\
    msg:'Octet NUL détecté dans un paramètre susceptible d alimenter un filtre LDAP',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/ldap-injection',\
    severity:'HIGH'"
