# WAF rule — formula-injection (CWE-1236)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/formula-injection.md)

SecRule ARGS "@rx ^[\t\r]*[=+\-@]" \
    "id:9500103,\
    phase:2,\
    deny,\
    msg:'Valeur de champ commençant par un caractère déclencheur de formule de tableur (=, +, -, @)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/formula-injection',\
    severity:'WARNING'"

SecRule ARGS "@rx (?i)(webservice|importxml|importdata|hyperlink)\s*\(" \
    "id:9500104,\
    phase:2,\
    deny,\
    msg:'Fonction de tableur potentiellement exploitable pour exfiltration détectée dans un champ soumis',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/formula-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i)=\s*cmd\s*\|" \
    "id:9500105,\
    phase:2,\
    deny,\
    msg:'Motif DDE (Dynamic Data Exchange) potentiellement dangereux détecté dans un champ soumis',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/formula-injection',\
    severity:'CRITICAL'"
