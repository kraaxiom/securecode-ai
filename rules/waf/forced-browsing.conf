# slug: forced-browsing
# cwe: CWE-425
# owasp: A01:2021-Broken Access Control
# Regle de perimetre (WAF) - blocage de l'acces direct a des chemins/fichiers
# conventionnellement sensibles souvent laisses accessibles par oubli (sauvegardes,
# exports, fichiers de configuration) dans un repertoire servi statiquement.
# Ne remplace pas le controle d'acces applicatif ni le retrait de ces fichiers du
# repertoire public - voir remediation_ref. Adapter les extensions/chemins au
# contexte reel du projet avant activation en mode block.

# Blocage de l'acces direct a des extensions/fichiers de sauvegarde ou de
# configuration frequemment oublies dans un repertoire servi publiquement.
SecRule REQUEST_URI "@rx \.(bak|old|backup|sql|log|env|config|swp|orig|tmp)$" \
    "id:9503030,\
    phase:1,\
    deny,\
    status:404,\
    msg:'Acces direct a un fichier de sauvegarde/configuration sensible bloque (forced browsing)',\
    tag:'securecode-ai/authorization/forced-browsing',\
    severity:'WARNING'"

# Journalisation des acces directs a des chemins d'etapes intermediaires connues
# (a adapter avec les vrais chemins de flux multi-etapes du projet), pour
# corroboration avec la verification d'etat de progression cote applicatif.
SecRule REQUEST_URI "@rx /(checkout|onboarding|wizard)/step-[2-9]" \
    "id:9503031,\
    phase:1,\
    pass,\
    log,\
    msg:'Acces direct a une etape intermediaire d''un flux multi-etapes (verifier la validation d''etat cote serveur)',\
    tag:'securecode-ai/authorization/forced-browsing',\
    severity:'NOTICE'"

# Note operateur : la premiere regle (extensions sensibles) est raisonnablement
# sure a activer en mode block d'emblee. La seconde depend fortement des chemins
# reels du projet et doit rester en journalisation jusqu'a calibration.
# remediation_ref: rules/remediation/forced-browsing.md
# knowledge_ref: knowledge/authorization/forced-browsing.md
