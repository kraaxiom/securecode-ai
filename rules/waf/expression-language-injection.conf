# WAF rule — expression-language-injection (CWE-917)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/expression-language-injection.md)

SecRule ARGS "@rx (?i)\$\{.*(runtime|processbuilder|getclass|class\.forname).*\}" \
    "id:9500100,\
    phase:2,\
    deny,\
    msg:'Tentative d\'injection Spring EL/OGNL détectée : appel de classe Java dangereuse dans une expression',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/expression-language-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i)%\{.*(runtime|processbuilder|getclass|class\.forname).*\}" \
    "id:9500101,\
    phase:2,\
    deny,\
    msg:'Tentative d\'injection d\'expression JSF détectée : syntaxe %{...} contenant un appel de classe sensible',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/expression-language-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i)(@\w+@\w+|ognl\.OgnlContext|_memberAccess)" \
    "id:9500102,\
    phase:2,\
    deny,\
    msg:'Tentative de contournement du contexte de sécurité OGNL détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/expression-language-injection',\
    severity:'CRITICAL'"
