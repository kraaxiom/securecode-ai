# slug: broken-access-control
# cwe: CWE-284
# owasp: A01:2021-Broken Access Control
# Regle de perimetre (WAF) - detection generique de requetes sensibles sans preuve
# d'authentification, et journalisation des reponses de succes suspectes sur des
# chemins sensibles. Le WAF ne peut pas evaluer la logique d'autorisation
# applicative : cette regle est un filet de securite en defense en profondeur,
# pas un substitut au controle d'acces implemente dans le code (remediation_ref).
# Adapter les chemins sensibles et seuils au contexte reel du projet.

# Detection de requetes vers des chemins sensibles sans en-tete d'authentification
# usuel (Authorization/Cookie de session) - signal fort d'absence de controle.
SecRule REQUEST_URI "@rx /(admin|api/internal|export|reports|settings)(/|$)" \
    "id:9503020,\
    phase:1,\
    chain,\
    pass,\
    log,\
    msg:'Requete vers chemin sensible sans en-tete d''authentification detecte (verifier le controle d''acces applicatif)',\
    tag:'securecode-ai/authorization/broken-access-control',\
    severity:'WARNING'"
    SecRule &REQUEST_HEADERS:Authorization "@eq 0" "chain"
    SecRule &REQUEST_HEADERS:Cookie "@eq 0"

# Journalisation des reponses de succes (2xx) sur des methodes de modification
# vers des chemins sensibles, pour corroboration avec les journaux applicatifs
# d'autorisation (le WAF ne peut pas determiner si le succes est legitime).
SecRule REQUEST_URI "@rx /(admin|api/internal|export|reports|settings)(/|$)" \
    "id:9503021,\
    phase:5,\
    chain,\
    pass,\
    log,\
    msg:'Reponse de succes sur methode de modification vers chemin sensible - a corroborer avec le controle d''acces applicatif',\
    tag:'securecode-ai/authorization/broken-access-control',\
    severity:'NOTICE'"
    SecRule REQUEST_METHOD "@rx ^(POST|PUT|DELETE|PATCH)$" "chain"
    SecRule RESPONSE_STATUS "@rx ^2[0-9]{2}$"

# Note operateur : regle en mode journalisation (pass/log), volontairement non
# bloquante par defaut car le WAF n'a pas connaissance des regles d'autorisation
# metier - passer en 'deny' uniquement sur des chemins strictement identifies
# comme reserves, apres validation en environnement de test.
# remediation_ref: rules/remediation/broken-access-control.md
# knowledge_ref: knowledge/authorization/broken-access-control.md
