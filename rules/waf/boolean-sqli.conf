# WAF rule — boolean-sqli (CWE-89)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/boolean-sqli.md)

SecRule ARGS "@rx (?i:\b(and|or)\s+\d+\s*=\s*\d+\b)" \
    "id:9500003,\
    phase:2,\
    deny,\
    msg:'Détection d\'une condition booléenne numérique typique d\'injection SQL',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/boolean-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:\b(and|or)\s+'[^']{0,40}'\s*=\s*'[^']{0,40}')" \
    "id:9500004,\
    phase:2,\
    deny,\
    msg:'Détection d\'une condition booléenne sur chaîne typique d\'injection SQL',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/boolean-sqli',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:'\s*(or|and)\s*'?1'?\s*=\s*'?1)" \
    "id:9500005,\
    phase:2,\
    deny,\
    msg:'Détection d\'une tautologie SQL classique (1=1)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/boolean-sqli',\
    severity:'CRITICAL'"
