# slug: blind-xss | CWE-79 | OWASP A03:2021-Injection
# Filtre périmétrique générique visant les champs typiquement exposés au XSS aveugle
# (formulaires de contact, User-Agent journalisé, référent). Défense en profondeur —
# ne remplace pas l'encodage de sortie côté application (voir rules/remediation/blind-xss.md).

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)<script[\s>/]|javascript:|on(error|load|mouseover|focus)\s*=" \
    "id:9501000,phase:1,t:none,log,deny,status:403,msg:'Motif de script actif détecté dans l''en-tête User-Agent (risque XSS aveugle)',logdata:'%{MATCHED_VAR}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"

SecRule ARGS "@rx (?i)<script[\s>/]|javascript:|on(error|load|mouseover|focus)\s*=" \
    "id:9501001,phase:2,t:none,t:htmlEntityDecode,log,deny,status:403,msg:'Motif de script actif détecté dans un champ de formulaire (risque XSS aveugle)',logdata:'Arg: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'attack-xss',tag:'CWE-79'"
