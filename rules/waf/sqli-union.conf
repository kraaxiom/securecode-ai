# WAF rule — sqli-union (CWE-89)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/sqli-union.md)

SecRule ARGS "@rx (?i:union\s+(?:all\s+)?select)" \
    "id:9500217,\
    phase:2,\
    deny,\
    msg:'Clause UNION SELECT détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/sqli-union',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:union\s+select\s+(?:null\s*,\s*){1,20}null)" \
    "id:9500218,\
    phase:2,\
    deny,\
    msg:'Séquence UNION SELECT NULL utilisée pour aligner le nombre de colonnes détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/sqli-union',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?i:union\s+select\s+(?:@@version|version\(\)|database\(\)|current_user))" \
    "id:9500219,\
    phase:2,\
    deny,\
    msg:'Tentative d extraction d informations système via UNION SELECT (version/base/utilisateur courant) détectée',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/sqli-union',\
    severity:'CRITICAL'"
