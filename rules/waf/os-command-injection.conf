# WAF rule — os-command-injection (CWE-78)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/os-command-injection.md)

SecRule ARGS "@rx [;\|&`]\s*(?:cat|ls|whoami|id|wget|curl|nc|bash|sh|cmd|powershell)\b" \
    "id:9500206,\
    phase:2,\
    deny,\
    msg:'Métacaractère shell suivi d un binaire système courant détecté dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/os-command-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx \$\([^)]+\)|`[^`]+`" \
    "id:9500207,\
    phase:2,\
    deny,\
    msg:'Substitution de commande shell ($() ou backticks) détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/os-command-injection',\
    severity:'CRITICAL'"

SecRule ARGS "@rx (?:^|[;\|&])\s*(?:rm|chmod|chown)\s+-[a-zA-Z]*[rf]" \
    "id:9500208,\
    phase:2,\
    deny,\
    msg:'Commande destructive potentielle (rm/chmod/chown) enchaînée via métacaractère shell',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/os-command-injection',\
    severity:'CRITICAL'"
