# slug: mass-assignment
# cwe: CWE-915
# owasp: A08:2021-Software and Data Integrity Failures
# Regle de perimetre (WAF) - valeur tres limitee pour le mass assignment. Un WAF
# perimetre ne connait pas le schema de champs autorises par endpoint ni la
# liste des attributs sensibles du modele interne : il ne peut pas determiner
# avec certitude qu'un champ present dans un payload est illegitime. Cette regle
# se limite a journaliser la presence de noms de champs frequemment sensibles
# dans des corps de requete de creation/mise a jour, comme signal de
# corroboration - pas de preuve de mass assignment. La correction reelle releve
# exclusivement d'une liste blanche de champs applicative - voir remediation_ref.

# Journalisation de la presence de noms de champs sensibles courants dans le
# corps JSON d'une requete de creation/mise a jour de ressource.
SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH)$" \
    "id:9503070,\
    phase:2,\
    chain,\
    pass,\
    log,\
    msg:'Champ potentiellement sensible present dans un payload de creation/mise a jour (signal a corroborer avec la liste blanche de champs applicative - mass assignment non confirme par le WAF)',\
    logdata:'Matched Data: %{MATCHED_VAR} dans %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/authorization/mass-assignment',\
    severity:'NOTICE'"
    SecRule REQUEST_HEADERS:Content-Type "@rx json" "chain"
    SecRule REQUEST_BODY "@rx \"(role|is_?admin|is_?staff|permissions?|balance|credit|privileg\w*)\"\s*:" "t:none"

# Note operateur : regle en mode journalisation uniquement (pass/log), sans
# blocage, car un champ nomme "role" peut etre parfaitement legitime selon
# l'endpoint (ex. formulaire d'invitation gere par un administrateur). Le WAF
# fournit uniquement un signal de corroboration perimetrique en defense en
# profondeur ; la protection reelle est la liste blanche de champs applicative.
# remediation_ref: rules/remediation/mass-assignment.md
# knowledge_ref: knowledge/authorization/mass-assignment.md
