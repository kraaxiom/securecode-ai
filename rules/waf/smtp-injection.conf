# WAF rule — smtp-injection (CWE-93)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/smtp-injection.md)

SecRule ARGS "@rx %0[ad]|\\r\\n|\\n|\\r" \
    "id:9500212,\
    phase:2,\
    deny,\
    msg:'Séquence CRLF (brute ou encodée) détectée dans un paramètre susceptible d alimenter un en-tête email',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/smtp-injection',\
    severity:'MEDIUM'"

SecRule ARGS "@rx (?i:^|[\r\n])\s*(?:to|cc|bcc|subject|content-type|rcpt to|data|mail from)\s*:" \
    "id:9500213,\
    phase:2,\
    deny,\
    msg:'Injection potentielle d en-tête email ou de commande SMTP (RCPT TO/DATA) détectée dans un paramètre',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/smtp-injection',\
    severity:'MEDIUM'"
