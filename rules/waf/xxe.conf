# WAF rule — xxe (CWE-611)
# Blocage périmétrique — défense en profondeur, ne remplace pas la correction du code source (rules/remediation/xxe.md)

SecRule REQUEST_HEADERS:Content-Type "@rx (?i:xml)" \
    "chain,\
    id:9500318,\
    phase:2,\
    deny,\
    msg:'Déclaration DOCTYPE détectée dans un corps de requête XML',\
    tag:'securecode-ai/injections/xxe',\
    severity:'CRITICAL'"
    SecRule REQUEST_BODY "@rx <!DOCTYPE" ""

SecRule REQUEST_BODY "@rx <!ENTITY\s+\S+\s+(SYSTEM|PUBLIC)\s" \
    "id:9500319,\
    phase:2,\
    deny,\
    msg:'Déclaration d''entité externe XML (ENTITY SYSTEM/PUBLIC) détectée dans le corps de la requête',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/xxe',\
    severity:'CRITICAL'"

SecRule REQUEST_BODY "@rx SYSTEM\s+[\"'](file|php|expect|jar|http|ftp):" \
    "id:9500320,\
    phase:2,\
    deny,\
    msg:'Référence SYSTEM vers un schéma d''URI sensible (file/php/expect/http) détectée dans le corps XML',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'securecode-ai/injections/xxe',\
    severity:'CRITICAL'"
