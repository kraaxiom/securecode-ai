id: api-key-leakage
language: php
category: api
cwe: CWE-798
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une chaîne littérale ressemblant à une clé API ou un secret
    (préfixe connu type sk_, AKIA, ghp_, ou forte entropie) assignée
    directement à une variable ou passée en argument de constructeur/fonction,
    sans passer par une variable d'environnement ou un gestionnaire de secrets.
  patterns:
    - "$var = \"<literal_high_entropy_string>\""
    - "new $ClientClass(\"<literal_high_entropy_string>\")"
    - "define('API_KEY', \"<literal_high_entropy_string>\")"
  exclude_if:
    - "La valeur provient de getenv(), $_ENV, putenv() ou d'un gestionnaire de secrets (Vault, Secrets Manager)"
    - "La chaîne est un exemple/placeholder explicite (ex: 'YOUR_API_KEY_HERE') dans un fichier de documentation"

message: >
  Secret codé en dur détecté — déplacer cette valeur vers une variable
  d'environnement ou un gestionnaire de secrets et révoquer la clé exposée
  (voir rules/remediation/api-key-leakage.md).

false_positive_notes:
  - "Vérifier que la chaîne n'est pas un identifiant de test/sandbox documenté comme non sensible par le fournisseur."
  - "Si la chaîne provient d'un fichier de fixtures de test isolé du code de production, reclasser en `info`."

remediation_ref: rules/remediation/api-key-leakage.md
knowledge_ref: knowledge/api/api-key-leakage.md
