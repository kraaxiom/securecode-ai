id: mfa-bypass
language: php
category: auth
cwe: CWE-287
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une session pleinement authentifiée (Auth::login) émise
    immédiatement après Auth::attempt sans vérification préalable du
    statut MFA de l'utilisateur.
  patterns:
    - "Auth::attempt($_) suivi directement de redirect()->route(...) sans test sur $user->mfa_enabled"
  exclude_if:
    - "Un contrôle conditionnel sur mfa_enabled/two_factor_enabled est présent entre l'authentification et la redirection finale"
    - "Auth::logout() est appelé avant la redirection vers un challenge MFA (état intermédiaire correctement géré)"

message: >
  Session pleinement authentifiée émise avant vérification du second
  facteur — voir rules/remediation/mfa-bypass.md.

false_positive_notes:
  - "Si l'application ne propose pas de MFA du tout (fonctionnalité absente), cette règle ne s'applique pas — vérifier l'existence de la fonctionnalité MFA avant de remonter."
  - "Un état de session 'partiel' correctement scopermis peut être confondu avec un état complet par l'analyse statique — vérifier manuellement."

remediation_ref: rules/remediation/mfa-bypass.md
knowledge_ref: knowledge/auth/mfa-bypass.md
