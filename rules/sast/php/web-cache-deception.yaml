id: web-cache-deception
language: php
category: modern
cwe: CWE-524
owasp: A04:2021-Insecure Design
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un routeur applicatif qui utilise un préfixe/str_starts_with
    permissif au lieu d'une correspondance exacte de route, retournant du
    contenu authentifié pour un chemin suivi d'un suffixe arbitraire, sans
    Cache-Control: private, no-store explicite.
  patterns:
    - "str_starts_with($path, '/compte') or similar prefix routing rendering authenticated content without an exact path match or explicit 404 fallback"
    - "authenticated route handler without header('Cache-Control: private, no-store') on a response containing user data"
  exclude_if:
    - "le routeur effectue une correspondance exacte de route avant de rendre le contenu authentifié"
    - "header('Cache-Control: private, no-store') est présent sur la réponse"

message: >
  Route authentifiée accessible via un préfixe permissif et sans
  Cache-Control: private, no-store — un cache partagé peut être trompé par un
  suffixe d'URL (ex: .css) et stocker une réponse personnalisée (voir
  rules/remediation/web-cache-deception.md).

false_positive_notes:
  - "Si aucun cache/CDN partagé ne se trouve devant l'application, le risque est réduit — reclasser en `medium`."
  - "Si le framework retourne déjà une 404 stricte pour tout segment non reconnu (vérifié au niveau du routeur central), ne pas remonter."

remediation_ref: rules/remediation/web-cache-deception.md
knowledge_ref: knowledge/modern/web-cache-deception.md
