id: credential-stuffing
language: php
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un endpoint de connexion sans détection de vélocité globale par IP
    (agrégation tous comptes confondus) ni proposition de MFA après authentification réussie.
  patterns:
    - "Auth::attempt(_) suivi d'un redirect direct sans vérification de $user->mfa_enabled ni RateLimiter par IP globale"
  exclude_if:
    - "Un service anti-bot/anti-fraude tiers (reCAPTCHA, Cloudflare Turnstile) est appelé avant l'authentification"
    - "Une vérification MFA conditionnelle est présente immédiatement après Auth::attempt"

message: >
  Endpoint de connexion sans détection de trafic de credential stuffing ni
  proposition de MFA — voir rules/remediation/credential-stuffing.md.

false_positive_notes:
  - "Cette règle est indicative (confiance basse) : la détection de vélocité peut être implémentée hors du fichier analysé (WAF, service dédié)."
  - "Ne pas remonter en `high` sans confirmation manuelle de l'absence de protection au niveau infrastructure."

remediation_ref: rules/remediation/credential-stuffing.md
knowledge_ref: knowledge/auth/credential-stuffing.md
