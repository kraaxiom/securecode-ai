id: circleci-secrets
language: config
category: cicd
cwe: CWE-798
owasp: A05:2021-Security Misconfiguration
severity: critical
confidence_default: medium

match:
  type: config-pattern
  description: >
    Détecte un secret en clair dans `.circleci/config.yml`, une commande de
    debug affichant l'environnement, ou un Context sensible accessible à
    des branches/forks non protégés.
  patterns:
    - "run: ... (password|token|key|secret)\\s*[:=]\\s*['\"][A-Za-z0-9+/=_-]{8,}['\"]"
    - "run: env"
    - "run: printenv"
    - "run: echo $TOKEN"
    - "context: prod-secrets ... sans filters.branches.only"
  exclude_if:
    - "valeur référencée via une variable d'environnement de projet ou un Context, jamais littérale"
    - "commande de debug exécutée uniquement dans un environnement de test isolé sans accès aux secrets réels"

message: >
  Un identifiant apparaît en clair dans la configuration CircleCI, ou une
  commande expose le contenu de l'environnement — voir
  rules/remediation/circleci-secrets.md.

false_positive_notes:
  - "Si le Context sensible est protégé par une règle d'approbation manuelle (`type: approval`) en amont, reclasser en `medium`."
  - "Une valeur ressemblant à un secret mais utilisée dans un job de test avec un compte sandbox n'est pas critique — vérifier le contexte."

remediation_ref: rules/remediation/circleci-secrets.md
knowledge_ref: knowledge/cicd/circleci-secrets.md
