id: weak-jwt-secret
language: php
category: crypto
cwe: CWE-1391
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un secret JWT court, prévisible ou de type valeur d'exemple passé
    à une fonction d'encodage/décodage JWT (firebase/php-jwt, lcobucci/jwt).
  patterns:
    - "JWT::encode(_, string_literal, _)"
    - "JWT::decode(_, string_literal, _)"
    - "Configuration::forSymmetricSigner(_, InMemory::plainText(string_literal))"
  exclude_if:
    - "la chaîne littérale a une longueur >= 32 caractères ET provient d'un fichier de test dédié, non du code applicatif de production"
    - "la valeur est en réalité le résultat d'un appel à getenv()/config() résolu statiquement en amont, pas un secret en dur"

message: >
  Secret JWT en dur, court ou prévisible — utiliser un secret d'au moins
  256 bits d'entropie généré aléatoirement et stocké hors du code source
  (voir rules/remediation/weak-jwt-secret.md).

false_positive_notes:
  - "Un secret de test clairement isolé dans une suite de tests unitaires n'affectant pas la production reste un finding `low`, pas `high`."
  - "Vérifier la longueur/entropie réelle de la chaîne avant de conclure à un secret faible — un littéral long généré aléatoirement une fois puis figé reste un anti-pattern mais moins critique qu'un mot commun."

remediation_ref: rules/remediation/weak-jwt-secret.md
knowledge_ref: knowledge/crypto/weak-jwt-secret.md
