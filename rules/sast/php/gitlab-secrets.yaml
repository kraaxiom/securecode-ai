id: gitlab-secrets
language: config
category: cicd
cwe: CWE-798
owasp: A05:2021-Security Misconfiguration
severity: critical
confidence_default: medium

match:
  type: config-pattern
  description: >
    Détecte un secret en clair dans `.gitlab-ci.yml`, un script imprimant
    une variable sensible, ou une variable CI non marquée Protected/Masked
    utilisée dans un contexte sensible.
  patterns:
    - "script: ... (password|token|key|secret)\\s*[:=]\\s*['\"][A-Za-z0-9+/=_-]{8,}['\"]"
    - "script: ... export -p"
    - "script: ... cat .env"
    - "artifacts: ... paths: ... (config.json|.env|credentials)"
  exclude_if:
    - "valeur référencée via une variable CI/CD Protected+Masked, jamais littérale"
    - "artefact ne contenant explicitement aucun secret (fichier de build public, ex: dist/)"

message: >
  Un identifiant apparaît en clair dans le pipeline GitLab CI, ou un secret
  est exposé via les logs/artefacts — voir
  rules/remediation/gitlab-secrets.md.

false_positive_notes:
  - "Si la variable CI référencée est bien marquée 'Protected' et 'Masked' dans les paramètres du projet, reclasser en `low`."
  - "Un artefact contenant un fichier de configuration sans valeur secrète réelle (placeholder) n'est pas exploitable."

remediation_ref: rules/remediation/gitlab-secrets.md
knowledge_ref: knowledge/cicd/gitlab-secrets.md
