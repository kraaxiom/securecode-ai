id: exposed-secrets
language: php
category: cloud
cwe: CWE-798
owasp: A05:2021-Security Misconfiguration
severity: critical
confidence_default: medium

match:
  type: regex-pattern
  description: >
    Détecte des secrets codés en dur dans le code source PHP ou les fichiers de
    configuration versionnés : clés API de fournisseurs cloud reconnaissables,
    blocs de clé privée, chaînes de connexion contenant des identifiants en clair.
  patterns:
    - "AKIA[0-9A-Z]{16}                       # clé d'accès AWS"
    - "AIza[0-9A-Za-z\\-_]{35}                 # clé API Google"
    - "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
    - "(?i)(api[_-]?key|secret|password|token)\\s*=\\s*['\"][A-Za-z0-9/+=_-]{16,}['\"]  # affectation en dur"
    - "mysql://[^:]+:[^@]+@ | postgres://[^:]+:[^@]+@   # chaîne de connexion avec identifiants en clair"
  exclude_if:
    - "la valeur provient d'une variable d'environnement (getenv(), $_ENV, config()->get()) et non d'un littéral"
    - "le fichier est un exemple explicitement nommé (.env.example, config.dist.php) contenant uniquement des placeholders"

message: >
  Secret potentiellement codé en dur dans le code ou la configuration — le
  déplacer vers un gestionnaire de secrets et le faire tourner immédiatement
  s'il a été committé (voir rules/remediation/exposed-secrets.md).

false_positive_notes:
  - "Un identifiant de test/sandbox clairement marqué comme non fonctionnel (ex: clé de démo publique d'un fournisseur) peut être reclassé en `info` après vérification manuelle."
  - "Toujours traiter un secret détecté dans l'historique Git comme compromis, même si le fichier actuel a été corrigé — la rotation reste obligatoire."

remediation_ref: rules/remediation/exposed-secrets.md
knowledge_ref: knowledge/cloud/exposed-secrets.md
