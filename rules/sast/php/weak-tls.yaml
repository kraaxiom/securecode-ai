id: weak-tls
language: php
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte une configuration de suites de chiffrement TLS incluant des
    algorithmes faibles (CBC non-AEAD, absence de forward secrecy) ou la
    désactivation de la vérification de certificat.
  patterns:
    - "stream_context_create({\"ssl\": {\"ciphers\": \"*DES*\"}})"
    - "stream_context_create({\"ssl\": {\"verify_peer\": false}})"
    - "curl_setopt(_, CURLOPT_SSL_VERIFYPEER, false)"
    - "curl_setopt(_, CURLOPT_SSL_VERIFYHOST, false)"
  exclude_if:
    - "verify_peer/CURLOPT_SSL_VERIFYPEER est désactivé uniquement dans un environnement de test local clairement isolé (constante d'environnement 'test'/'local' vérifiée avant l'appel)"

message: >
  Configuration TLS faible (suites obsolètes ou vérification de certificat
  désactivée) — imposer des suites AEAD modernes avec forward secrecy et ne
  jamais désactiver la vérification de certificat en production
  (voir rules/remediation/weak-tls.md).

false_positive_notes:
  - "La désactivation de la vérification de certificat dans un script d'infrastructure interne isolé (réseau privé, pas d'Internet) reste risquée mais peut être `medium` plutôt que `high`."
  - "Confirmer l'environnement cible (prod vs dev/test) avant de fixer la sévérité finale — ce pattern a un taux de faux positifs plus élevé que les autres règles crypto."

remediation_ref: rules/remediation/weak-tls.md
knowledge_ref: knowledge/crypto/weak-tls.md
