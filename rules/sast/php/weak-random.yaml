id: weak-random
language: php
category: crypto
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'usage d'un générateur pseudo-aléatoire non cryptographique
    (rand, mt_rand, uniqid) pour produire un token, une clé ou un identifiant
    de sécurité.
  patterns:
    - "$token = rand(_, _)"
    - "$token = mt_rand(_, _)"
    - "$token = uniqid(_)"
    - "$*_token = uniqid()"
    - "$*_key = mt_rand(_, _)"
  exclude_if:
    - "la valeur générée sert uniquement à un usage non sécuritaire (ex: variation d'affichage UI, jitter de retry, données de test/fixture)"

message: >
  rand()/mt_rand()/uniqid() ne sont pas des générateurs cryptographiquement
  sûrs — utiliser random_bytes()/random_int() pour tout token, clé ou
  identifiant de sécurité (voir rules/remediation/weak-random.md).

false_positive_notes:
  - "rand()/mt_rand() utilisés pour du tirage aléatoire non sensible (jeu, A/B testing, mélange d'affichage) ne sont pas un risque de sécurité."
  - "Vérifier que la valeur générée est bien utilisée comme token/clé/session avant de remonter en `medium`."

remediation_ref: rules/remediation/weak-random.md
knowledge_ref: knowledge/crypto/weak-random.md
