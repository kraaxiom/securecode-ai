id: broken-access-control
language: php
category: authorization
cwe: CWE-284
owasp: A01:2021-Broken Access Control
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une route servant une ressource sensible (téléchargement, export,
    données financières) protégée uniquement par 'auth' middleware, sans
    aucune vérification d'autorisation propre à la ressource.
  patterns:
    - "Route::get(_, [_, 'download'|'export'])->middleware('auth') sans ->middleware('can:*') ni vérification dans le contrôleur"
  exclude_if:
    - "Une policy ou un Gate::authorize est appliqué dans le contrôleur avant l'accès à la ressource"

message: >
  Ressource sensible protégée uniquement par l'authentification, sans
  contrôle d'autorisation propre à la ressource — voir
  rules/remediation/broken-access-control.md.

false_positive_notes:
  - "Cette règle recoupe partiellement bfla/bola/idor — si l'un de ces contrôles plus spécifiques est déjà présent, ne pas dupliquer le finding."

remediation_ref: rules/remediation/broken-access-control.md
knowledge_ref: knowledge/authorization/broken-access-control.md
