id: weak-password
language: php
category: auth
cwe: CWE-521
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: medium

match:
  type: regex
  description: >
    Détecte une règle de validation de mot de passe avec une longueur minimale
    faible (inférieure à 12 caractères) ou l'absence totale de contrôle de
    longueur/complexité sur un champ mot de passe.
  patterns:
    - "'password'\\s*=>\\s*['\"]required\\|min:([1-9]|1[01])['\"]"
    - "Password::min\\(([1-9]|1[01])\\)"
  exclude_if:
    - "La règle est accompagnée de Password::uncompromised() et d'une longueur minimale >= 12."
    - "Le contrôle de longueur est délégué à un service d'authentification externe (ex: Auth0, Okta) dont la politique est gérée hors du code applicatif."

message: >
  Politique de mot de passe insuffisante (longueur minimale trop faible ou absence
  de vérification contre les mots de passe compromis) — voir rules/remediation/weak-password.md.

false_positive_notes:
  - "Si la validation de longueur minimale est appliquée en complément d'une vérification côté service tiers (SSO/IdP), reclasser en `info`."

remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
