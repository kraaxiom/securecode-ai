id: dangling-markup
language: php
category: modern
cwe: CWE-79
owasp: A03:2021-Injection
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une entrée utilisateur concaténée directement dans du HTML sans
    passer par htmlspecialchars/htmlentities, permettant l'injection d'une
    balise non fermée (ex: <img src="...).
  patterns:
    - "echo string_concat(_, $_GET[_], _) without htmlspecialchars($_GET[_], ...) wrapping"
    - "echo string_concat(_, $_POST[_], _) without htmlspecialchars($_POST[_], ...) wrapping"
    - "print string_concat('<', _, $userInput, _, '>') without encoding"
  exclude_if:
    - "la variable passe par htmlspecialchars() ou htmlentities() avec ENT_QUOTES avant insertion"
    - "le moteur de template utilisé applique un échappement automatique par défaut sur cette sortie"

message: >
  Donnée utilisateur insérée dans du HTML sans encodage — risque d'injection
  de balise non fermée (dangling markup) permettant l'exfiltration de données
  même sous CSP stricte sans 'unsafe-inline' (voir
  rules/remediation/dangling-markup.md).

false_positive_notes:
  - "Si la sortie est strictement dans un contexte JSON (Content-Type: application/json), non exploitable en dangling markup — reclasser en `info`."
  - "Vérifier qu'un échappement n'est pas appliqué en amont via une fonction wrapper maison non détectée localement."

remediation_ref: rules/remediation/dangling-markup.md
knowledge_ref: knowledge/modern/dangling-markup.md
