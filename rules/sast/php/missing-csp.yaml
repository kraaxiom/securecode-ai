id: missing-csp
language: php
category: headers
cwe: CWE-1021
owasp: A05:2021-Security Misconfiguration
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détection au niveau applicatif PHP de l'absence d'envoi de l'en-tête
    Content-Security-Policy via header(). La vérification exhaustive reste
    souvent de niveau config/infra (nginx add_header, Apache Header always
    set, middleware framework type helmet/secure_headers) et doit être
    complétée par un contrôle sur la configuration du serveur web.
  patterns:
    - "absence d'appel header('Content-Security-Policy: ...') dans le point d'entrée ou le middleware global"
    - "absence de directive add_header Content-Security-Policy dans la configuration nginx associée"
    - "absence de directive Header always set Content-Security-Policy dans la configuration Apache associée"
  exclude_if:
    - "l'en-tête Content-Security-Policy est défini globalement au niveau du reverse proxy/CDN en amont de l'application"
    - "un middleware de sécurité applique déjà une CSP, même en mode Report-Only en cours de déploiement progressif"

message: >
  En-tête Content-Security-Policy absent des réponses HTTP — une faille XSS
  serait bien plus impactante en son absence (voir rules/remediation/missing-csp.md).

false_positive_notes:
  - "Si l'en-tête est injecté par un reverse proxy, un CDN ou un middleware framework en amont du code PHP scanné, ce n'est pas un vrai positif au niveau applicatif — vérifier la configuration infra avant de remonter le finding."
  - "Une CSP en mode Content-Security-Policy-Report-Only en cours de validation ne doit pas être traitée comme absente ; c'est une étape de déploiement légitime, pas un vrai positif à sévérité pleine."

remediation_ref: rules/remediation/missing-csp.md
knowledge_ref: knowledge/headers/missing-csp.md
