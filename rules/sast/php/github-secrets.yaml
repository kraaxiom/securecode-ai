id: github-secrets
language: config
category: cicd
cwe: CWE-798
owasp: A05:2021-Security Misconfiguration
severity: critical
confidence_default: medium

match:
  type: config-pattern
  description: >
    Détecte un motif de token/clé en clair dans un workflow GitHub Actions,
    l'usage de `pull_request_target` avec checkout de code de fork, une
    action tierce épinglée sur une branche mutable, ou des permissions
    `GITHUB_TOKEN` trop larges.
  patterns:
    - "(ghp_|gho_|ghs_|AKIA|-----BEGIN PRIVATE KEY-----)[A-Za-z0-9/+=]{10,}"
    - "on: pull_request_target ... ref: ${{ github.event.pull_request.head.sha }}"
    - "uses: [^@]+@(main|master)\\b"
    - "permissions: write-all"
  exclude_if:
    - "valeur référencée via ${{ secrets.NOM }} au lieu d'un littéral"
    - "action tierce épinglée sur un SHA de commit complet (40 caractères hex)"

message: >
  Un secret apparaît en clair, ou une configuration à risque (pull_request_target
  avec checkout de fork, action non épinglée, permissions write-all) expose
  le dépôt à une exfiltration de secrets. Voir
  rules/remediation/github-secrets.md.

false_positive_notes:
  - "Un motif ressemblant à un token dans un fichier de test/fixture explicitement non fonctionnel peut être déclassé en `info` après vérification."
  - "`pull_request_target` sans checkout du code du fork (ou avec checkout limité à `github.base_ref`) n'expose pas les secrets — vérifier le `ref:` utilisé."

remediation_ref: rules/remediation/github-secrets.md
knowledge_ref: knowledge/cicd/github-secrets.md
