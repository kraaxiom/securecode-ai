id: svn-exposure
language: php
category: server
cwe: CWE-538
owasp: A05:2021-Security Misconfiguration
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Vérification config/infra : détecte la présence d'un dossier `.svn` dans
    le webroot servi par le serveur, ou l'absence de règle Nginx/Apache
    bloquant explicitement l'accès à `/.svn`.
  patterns:
    - "dossier_webroot(nom == '.svn')"
    - "config_nginx_ou_apache(absence de bloc `location ~ /\\.svn` ou `<DirectoryMatch \"\\.svn\">`)"
  exclude_if:
    - "le dossier .svn est situé strictement en dehors du DocumentRoot/root du serveur web"
    - "une règle serveur bloque déjà explicitement l'accès à /.svn ou à tous les dotdirs"

message: >
  Répertoire .svn potentiellement accessible publiquement dans le webroot —
  déployer via `svn export` et bloquer /.svn au niveau serveur (voir
  rules/remediation/svn-exposure.md).

false_positive_notes:
  - "Si le dossier .svn détecté n'existe qu'en environnement de développement local (non exposé publiquement), ce n'est pas exploitable."
  - "Vérifier que la requête HTTP sur /.svn/entries renvoie réellement un contenu (pas une page 404 custom) avant de confirmer l'exploitabilité."

remediation_ref: rules/remediation/svn-exposure.md
knowledge_ref: knowledge/server/svn-exposure.md
