id: secrets-in-image
language: config
category: docker
cwe: CWE-798
owasp: A05:2021-Security Misconfiguration
severity: high
confidence_default: medium

match:
  type: config-pattern
  description: >
    Détecte un secret intégré dans une couche d'image Docker via `ARG`/`ENV`
    littéral ou `COPY`/`ADD` d'un fichier de credentials sans mécanisme de
    build secret.
  patterns:
    - "ARG (API_KEY|PASSWORD|TOKEN|SECRET)=<valeur littérale>"
    - "ENV (API_KEY|PASSWORD|TOKEN|SECRET)=<valeur littérale>"
    - "COPY .env /app/.env"
    - "COPY credentials* /app/"
  exclude_if:
    - "RUN --mount=type=secret utilisé à la place de COPY/ADD pour la valeur sensible"
    - "build multi-stage où l'étape contenant le secret n'apparaît jamais dans l'image finale exportée"

message: >
  Un secret apparaît en dur dans une instruction Dockerfile ou est copié
  sans mécanisme de build secret — récupérable dans l'historique des
  couches de l'image. Voir rules/remediation/secrets-in-image.md.

false_positive_notes:
  - "Si la valeur est un placeholder non sensible (ex: `ARG VERSION=1.0`), ne pas remonter — vérifier le nom et la nature de la variable."
  - "Un `COPY` suivi d'une suppression dans une étape ultérieure du même stage reste vulnérable (couche persistante) — ne pas déclasser sur cette seule base."

remediation_ref: rules/remediation/secrets-in-image.md
knowledge_ref: knowledge/docker/secrets-in-image.md
