id: password-spray
language: php
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte une limitation de tentatives configurée uniquement par identifiant
    de compte (clé RateLimiter basée sur l'email), sans clé complémentaire
    agrégée par IP tous comptes confondus.
  patterns:
    - "RateLimiter::tooManyAttempts('login:' . $email, _) sans clé additionnelle de type 'login:ip:' . $request->ip()"

message: >
  Limitation de tentatives d'authentification appliquée uniquement par
  compte — un password spray distribué sur de nombreux comptes n'est pas
  détecté (voir rules/remediation/password-spray.md).

false_positive_notes:
  - "Règle à confiance basse : une agrégation par IP peut être implémentée dans un middleware séparé non visible dans ce fichier."
  - "Confirmer manuellement l'absence de toute limitation globale avant d'escalader la sévérité."

remediation_ref: rules/remediation/password-spray.md
knowledge_ref: knowledge/auth/password-spray.md
