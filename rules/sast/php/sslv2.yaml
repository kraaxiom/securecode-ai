id: sslv2
language: php
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'activation explicite de SSLv2 dans un contexte de flux PHP ou
    une configuration cURL/stream_context.
  patterns:
    - "stream_context_create({\"ssl\": {\"crypto_method\": STREAM_CRYPTO_METHOD_SSLv2_*}})"
    - "curl_setopt(_, CURLOPT_SSLVERSION, CURL_SSLVERSION_SSLv2)"
  exclude_if:
    - "la constante est utilisée uniquement pour la détecter/refuser explicitement (ex: dans une liste noire de vérification de conformité)"

message: >
  SSLv2 est interdit par la RFC 6176 (négociation non authentifiée,
  vulnérable à DROWN) — forcer TLS 1.2 minimum, idéalement TLS 1.3
  (voir rules/remediation/sslv2.md).

false_positive_notes:
  - "Aucun cas légitime connu d'activation volontaire de SSLv2 en 2026 — ce finding ne doit quasiment jamais être déclassé."
  - "Vérifier qu'il ne s'agit pas d'un test unitaire vérifiant que la connexion SSLv2 est bien rejetée par l'application."

remediation_ref: rules/remediation/sslv2.md
knowledge_ref: knowledge/crypto/sslv2.md
