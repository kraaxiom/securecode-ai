id: secret-leakage
language: php
category: llm
cwe: CWE-200
owasp: LLM02:2025-Sensitive-Information-Disclosure
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un secret (clé API, identifiant, jeton) interpolé directement
    dans une chaîne de prompt système transmise au LLM, ou l'absence de
    filtrage de sortie avant renvoi d'une réponse du modèle.
  patterns:
    - "$systemPrompt = \"...{$apiKey}...\" ou sprintf('... %s ...', $apiKey) où $apiKey est un secret/clé"
    - "return $llm->chat(...) sans appel préalable à un secret_scanner->contains_secret() sur la réponse"
  exclude_if:
    - "La valeur interpolée provient d'une référence indirecte (nom d'outil) résolue côté application, pas la valeur du secret elle-même"
    - "Un filtrage de sortie (secret scanner) est appliqué systématiquement avant renvoi de la réponse"

message: >
  Secret potentiellement inclus dans un prompt système ou absence de
  filtrage de sortie — risque de fuite de secret via le LLM (voir
  rules/remediation/secret-leakage.md).

false_positive_notes:
  - "Si la variable interpolée est un identifiant non sensible (ex: nom d'environnement), ce n'est pas un secret."
  - "Si le prompt système est un template statique versionné sans interpolation dynamique, ce pattern ne s'applique pas."

remediation_ref: rules/remediation/secret-leakage.md
knowledge_ref: knowledge/llm/secret-leakage.md
