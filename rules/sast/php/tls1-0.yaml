id: tls1-0
language: php
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une configuration acceptant explicitement TLS 1.0 ou 1.1 comme
    version minimale via stream_context ou cURL.
  patterns:
    - "stream_context_create({\"ssl\": {\"crypto_method\": STREAM_CRYPTO_METHOD_TLSv1_0_*}})"
    - "stream_context_create({\"ssl\": {\"crypto_method\": STREAM_CRYPTO_METHOD_TLSv1_1_*}})"
    - "curl_setopt(_, CURLOPT_SSLVERSION, CURL_SSLVERSION_TLSv1_0)"
    - "curl_setopt(_, CURLOPT_SSLVERSION, CURL_SSLVERSION_TLSv1_1)"
  exclude_if:
    - "la valeur minimale configurée est en réalité TLSv1_2 ou supérieure malgré la présence du mot-clé TLSv1 dans une constante englobante (ex: TLSv1_2_CLIENT contient 'TLSv1')"

message: >
  TLS 1.0/1.1 sont dépréciés par la RFC 8996 et exclus des référentiels
  PCI-DSS actuels — fixer une version minimale TLS 1.2, idéalement TLS 1.3
  (voir rules/remediation/tls1-0.md).

false_positive_notes:
  - "Vérifier que la constante matchée correspond bien à TLS 1.0/1.1 et non à une constante générique 'ANY' incluant aussi des versions modernes."
  - "Une compatibilité descendante documentée et temporaire avec un partenaire tiers legacy reste un finding réel, à planifier pour retrait."

remediation_ref: rules/remediation/tls1-0.md
knowledge_ref: knowledge/crypto/tls1-0.md
