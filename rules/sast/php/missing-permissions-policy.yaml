id: missing-permissions-policy
language: php
category: headers
cwe: CWE-1021
owasp: A05:2021-Security Misconfiguration
severity: low
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détection au niveau applicatif PHP de l'absence d'envoi de l'en-tête
    Permissions-Policy via header(). La vérification exhaustive reste
    souvent de niveau config/infra (nginx add_header, Apache Header
    always set) et doit être complétée par un contrôle sur la
    configuration du serveur web ou du reverse proxy.
  patterns:
    - "absence d'appel header('Permissions-Policy: ...') dans le point d'entrée ou le middleware global"
    - "absence de directive add_header Permissions-Policy dans la configuration nginx associée"
    - "absence de directive Header always set Permissions-Policy dans la configuration Apache associée"
  exclude_if:
    - "l'en-tête Permissions-Policy est défini globalement au niveau du reverse proxy/CDN en amont de l'application"
    - "un middleware de sécurité ajoute déjà systématiquement cet en-tête avec une politique restrictive"

message: >
  En-tête Permissions-Policy absent des réponses HTTP — les API sensibles du
  navigateur restent accessibles par défaut en cas de compromission
  (voir rules/remediation/missing-permissions-policy.md).

false_positive_notes:
  - "Si l'en-tête est injecté par un reverse proxy, un CDN ou un middleware framework en amont du code PHP scanné, ce n'est pas un vrai positif au niveau applicatif — vérifier la configuration infra avant de remonter le finding."
  - "Application n'intégrant aucun contenu tiers (pas d'iframe, pas de script publicitaire) : le risque réel est plus faible, la sévérité basse par défaut est déjà appropriée."

remediation_ref: rules/remediation/missing-permissions-policy.md
knowledge_ref: knowledge/headers/missing-permissions-policy.md
