id: error-sqli
language: php
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: regex
  description: >
    Détecte la concaténation d'une variable dans une requête SQL exécutée via
    mysqli_query/PDO::query, combinée à un bloc catch/gestion d'erreur qui
    renvoie le message d'exception brut (getMessage(), mysqli_error()) au
    client — motif typique de l'injection SQL basée sur les erreurs.
  patterns:
    - "(mysqli_query\\s*\\(|->query\\s*\\()\\s*[^,)]*\\.\\s*\\$[A-Za-z_][A-Za-z0-9_]*"
    - "echo\\s+.*(->getMessage\\(\\)|mysqli_error\\s*\\()"
  exclude_if:
    - "$var passe par une fonction de cast entier avant la requête (ex: (int)$var, intval($var))"
    - "Le message d'erreur est journalisé (error_log) mais jamais renvoyé au client (echo/response)"

message: >
  Concaténation d'une valeur utilisateur dans une requête SQL dont le message
  d'erreur détaillé peut être renvoyé au client — remplacer par une requête
  préparée et désactiver l'affichage des erreurs SQL en production (voir
  rules/remediation/error-sqli.md).

false_positive_notes:
  - "Si le message d'erreur est uniquement journalisé côté serveur (error_log) et jamais renvoyé au client, le canal d'exfiltration par erreur est fermé — reclasser en `medium` pour la seule concaténation SQL."
  - "Si la variable provient exclusivement d'une constante applicative interne, ce n'est pas exploitable — reclasser en `info`."

remediation_ref: rules/remediation/error-sqli.md
knowledge_ref: knowledge/injections/error-sqli.md
