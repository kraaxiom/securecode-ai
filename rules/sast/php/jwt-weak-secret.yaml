id: jwt-weak-secret
language: php
category: auth
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: regex-pattern
  description: >
    Détecte un secret JWT court ou en dur passé directement à JWT::encode/decode
    au lieu d'être chargé depuis une variable d'environnement/gestionnaire de secrets.
  patterns:
    - "JWT::encode\\(\\$_,\\s*['\"][A-Za-z0-9]{1,31}['\"]"
    - "\\$secret\\s*=\\s*['\"](secret|changeme|your-256-bit-secret|123456)['\"]"
  exclude_if:
    - "Le secret est chargé via env('JWT_SECRET') ou config('jwt.secret') plutôt qu'une chaîne littérale"

message: >
  Secret JWT court ou codé en dur détecté — utiliser un secret aléatoire
  d'au moins 256 bits stocké dans un gestionnaire de secrets (voir
  rules/remediation/jwt-weak-secret.md).

false_positive_notes:
  - "Une valeur littérale utilisée uniquement dans un test unitaire isolé n'est pas exploitable en production — reclasser en `info`."
  - "Vérifier la longueur réelle en octets, pas seulement en caractères visibles, avant de confirmer la sévérité."

remediation_ref: rules/remediation/jwt-weak-secret.md
knowledge_ref: knowledge/auth/jwt-weak-secret.md
