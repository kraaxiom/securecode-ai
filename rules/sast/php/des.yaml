id: des
language: php
category: crypto
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'usage explicite de DES ou 3DES/DESede via les API de chiffrement
    PHP (mcrypt historique, openssl_encrypt avec un cipher DES).
  patterns:
    - "openssl_encrypt(_, \"DES\", _)"
    - "openssl_encrypt(_, \"DES-EDE3\", _)"
    - "openssl_encrypt(_, \"des-*\", _)"
    - "mcrypt_encrypt(MCRYPT_DES, _)"
    - "mcrypt_encrypt(MCRYPT_3DES, _)"
  exclude_if:
    - "l'appel se trouve dans un fichier de test/fixture dédié à la compatibilité descendante et n'écrit aucune donnée persistée"

message: >
  Algorithme DES/3DES obsolète (clé effective 56 bits, vulnérable à
  Sweet32) — migrer vers AES-256-GCM (voir rules/remediation/des.md).

false_positive_notes:
  - "Si l'appel sert uniquement à déchiffrer un flux legacy en lecture seule avant migration, garder le finding mais abaisser la priorité de correction."
  - "Vérifier que le cipher n'est pas une chaîne dynamique non résolue statiquement avant de confirmer en `high`."

remediation_ref: rules/remediation/des.md
knowledge_ref: knowledge/crypto/des.md
