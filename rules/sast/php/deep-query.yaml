id: deep-query
language: php
category: graphql
cwe: CWE-674
owasp: A04:2021-Insecure Design
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un appel à GraphQL::executeQuery sans règle QueryDepth configurée,
    combiné à un schéma exposant des types récursifs.
  patterns:
    - "GraphQL::executeQuery($schema, $query, ...) sans DocumentValidator::addRule(new QueryDepth(_)) préalable"
  exclude_if:
    - "DocumentValidator::addRule(new QueryDepth(_)) est configuré avant l'exécution"

message: >
  Exécution de requête GraphQL sans limite de profondeur — risque de déni de
  service par requête récursive (voir rules/remediation/deep-query.md).

false_positive_notes:
  - "Si la limite de profondeur est configurée globalement dans un fichier de bootstrap séparé non analysé, vérifier manuellement avant de remonter en `medium`."
  - "Si le schéma ne comporte aucune relation récursive/circulaire, le risque réel est très faible — reclasser en `low`."

remediation_ref: rules/remediation/deep-query.md
knowledge_ref: knowledge/graphql/deep-query.md
