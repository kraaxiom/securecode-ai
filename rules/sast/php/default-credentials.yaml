id: default-credentials
language: php
category: auth
cwe: CWE-1392
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: high

match:
  type: regex-pattern
  description: >
    Détecte des identifiants par défaut en dur (admin/admin, mots de passe
    d'exemple documentés) dans du code de seed, de configuration ou de provisioning.
  patterns:
    - "Hash::make\\((['\"])(admin|admin123|password|changeme|test123)\\1\\)"
    - "'password'\\s*=>\\s*['\"](admin|admin123|password|changeme|123456)['\"]"
    - "define\\(['\"]ADMIN_PASSWORD['\"],\\s*['\"][^'\"]{1,10}['\"]\\)"
  exclude_if:
    - "Le fichier est explicitement un fichier de test unitaire (répertoire tests/) sans lien avec le provisioning de production"
    - "Une génération aléatoire (Str::random) encadre la valeur avant utilisation réelle"

message: >
  Identifiant ou mot de passe par défaut détecté en dur — générer une valeur
  aléatoire et forcer son changement (voir rules/remediation/default-credentials.md).

false_positive_notes:
  - "Les fixtures de test isolées de la production ne représentent pas un risque réel — reclasser en `info` si confirmé."
  - "Vérifier que la valeur n'est pas immédiatement remplacée par une valeur générée avant tout usage réel."

remediation_ref: rules/remediation/default-credentials.md
knowledge_ref: knowledge/auth/default-credentials.md
