id: weak-encryption
language: php
category: database
cwe: CWE-326
owasp: A02:2021-Cryptographic-Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation d'un algorithme de hachage/chiffrement obsolète
    (MD5, SHA-1 pour mot de passe, DES, mode ECB) pour protéger des données
    sensibles, au lieu d'argon2id/AES-GCM.
  patterns:
    - "md5($password)"
    - "sha1($password)"
    - "openssl_encrypt(_, \"des-ecb\", _)"
    - "openssl_encrypt(_, \"aes-256-ecb\", _)"
  exclude_if:
    - "L'appel utilise password_hash() avec PASSWORD_ARGON2ID ou PASSWORD_BCRYPT"
    - "md5()/sha1() est utilisé pour un usage non sécuritaire (checksum de fichier, cache key) et non pour un mot de passe/secret"

message: >
  Algorithme de hachage/chiffrement obsolète utilisé pour une donnée
  sensible — migrer vers argon2id (mots de passe) ou AES-GCM (données) —
  voir rules/remediation/weak-encryption.md.

false_positive_notes:
  - "md5()/sha1() utilisés pour générer un ETag ou une clé de cache non sécuritaire ne sont pas concernés."
  - "Vérifier le contexte d'appel : un md5() sur un mot de passe est critique, sur un identifiant public il ne l'est pas."

remediation_ref: rules/remediation/weak-encryption.md
knowledge_ref: knowledge/database/weak-encryption.md
