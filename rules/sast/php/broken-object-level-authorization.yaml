id: broken-object-level-authorization
language: php
category: api
cwe: CWE-639
owasp: API1:2023-Broken Object Level Authorization
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une récupération/modification d'objet ORM ou base de données par un
    identifiant issu directement de la requête (route param, $_GET, $_POST),
    sans clause de filtrage sur l'utilisateur courant.
  patterns:
    - "Model::find($route_param)"
    - "Model::findOrFail($route_param)"
    - "->where('id', $route_param)->first()"
    - "SELECT * FROM _ WHERE id = :id" # sans AND user_id = / AND owner_id =
  exclude_if:
    - "la requête contient une clause supplémentaire sur user_id/owner_id/tenant_id liée à l'utilisateur authentifié"
    - "le contrôleur applique une policy/gate Laravel (authorize(), Gate::allows) avant l'accès"

message: >
  Objet récupéré par identifiant client sans vérification de propriété —
  ajouter un filtre sur l'utilisateur/tenant authentifié ou une policy
  d'autorisation (voir rules/remediation/broken-object-level-authorization.md).

false_positive_notes:
  - "Si la ressource est publique par conception (pas de notion de propriétaire), ce n'est pas du BOLA — reclasser en `info`."
  - "Si l'autorisation est vérifiée en amont par un middleware générique appliqué à toute la route, vérifier manuellement qu'il couvre bien le niveau objet et pas seulement l'authentification."

remediation_ref: rules/remediation/broken-object-level-authorization.md
knowledge_ref: knowledge/api/broken-object-level-authorization.md
