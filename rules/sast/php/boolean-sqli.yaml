id: boolean-sqli
language: php
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte la construction d'une clause WHERE par concaténation d'une variable
    non liée, passée à une fonction d'exécution SQL (mysqli_query, PDO::query,
    $pdo->query), typiquement dans un formulaire de connexion ou de recherche.
  patterns:
    - "mysqli_query($_, string_concat(_, \"WHERE\", _, $var, _))"
    - "->query(string_concat(_, $var, _))"
  exclude_if:
    - "$var est un littéral constant (pas une variable/paramètre)"
    - "$var passe par une fonction de cast/validation stricte (ex: (int)$var, filter_var avec FILTER_VALIDATE_INT)"

message: >
  Comparaison SQL construite par concaténation d'une valeur utilisateur —
  remplacer par une requête préparée avec paramètre lié (voir
  rules/remediation/boolean-sqli.md).

false_positive_notes:
  - "Si la variable provient exclusivement d'une constante applicative interne (pas d'entrée utilisateur), ce n'est pas exploitable — reclasser en `info`."
  - "Si un ORM applique déjà un échappement systématique en amont (rare avec ->query() brut), vérifier manuellement avant de remonter en `high`."

remediation_ref: rules/remediation/boolean-sqli.md
knowledge_ref: knowledge/injections/boolean-sqli.md
