id: k8s-secret-exposure
language: config
category: kubernetes
cwe: CWE-312
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: config-pattern
  description: >
    Détecte un manifeste `Secret` avec des valeurs commitées, l'usage
    détourné de `ConfigMap` pour des données sensibles, ou une valeur
    sensible injectée en clair via `env.value` plutôt que `secretKeyRef`.
  patterns:
    - "kind: Secret ... data: <valeur base64 littérale commitée dans le dépôt>"
    - "kind: ConfigMap ... data: (password|token|api_key|secret):"
    - "env: ... name: (PASSWORD|TOKEN|API_KEY) ... value: <littéral>"
  exclude_if:
    - "manifeste Secret généré dynamiquement au déploiement (templating CI, jamais commité avec des valeurs réelles)"
    - "valeur référencée via secretKeyRef/valueFrom au lieu d'une valeur littérale"

message: >
  Une donnée sensible est stockée ou référencée en clair dans un manifeste
  Kubernetes versionné (Secret commité, ConfigMap détourné, ou env.value
  littéral) au lieu d'un gestionnaire externe. Voir
  rules/remediation/k8s-secret-exposure.md.

false_positive_notes:
  - "Un manifeste `Secret` avec des valeurs placeholder (ex: `CHANGEME`) dans un dépôt de templates n'est pas exploitable — reclasser en `info`."
  - "Vérifier si le dépôt est privé et si le chiffrement au repos (SOPS, sealed-secrets) est appliqué avant commit — dans ce cas, reclasser en `low`."

remediation_ref: rules/remediation/k8s-secret-exposure.md
knowledge_ref: knowledge/kubernetes/k8s-secret-exposure.md
