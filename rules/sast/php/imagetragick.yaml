id: imagetragick
language: php
category: upload
cwe: CWE-78
owasp: A03:2021-Injection
severity: critical
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation d'Imagick/GraphicsMagick (readImage, Imagick::readImage,
    gmagick) sur un fichier téléversé sans restriction de policy ni vérification
    du format avant décodage complet, exposant l'application à une classe de
    vulnérabilités type ImageTragick (delegates shell externes).
  patterns:
    - "(new Imagick())->readImage($_FILES[_]['tmp_name'])"
    - "gm(_)->write($_FILES[_]['name'])"
    - "shell_exec(string_concat('convert', _, $_FILES[_][_]))"
  exclude_if:
    - "un contrôle de format via pingImage() ou getimagesize() précède le décodage complet et rejette les formats hors liste blanche"
    - "l'appel s'exécute dans un environnement documenté comme isolé (conteneur dédié) avec policy.xml restrictive"

message: >
  Traitement d'image via bibliothèque à delegates (ImageMagick/GraphicsMagick)
  sans restriction préalable de format — risque de classe ImageTragick, voir
  rules/remediation/imagetragick.md.

false_positive_notes:
  - "La présence de l'appel seule ne prouve pas l'exploitabilité : vérifier la version de la bibliothèque et la configuration policy.xml avant d'escalader en critique confirmé."
  - "Si la bibliothèque est appelée uniquement sur des fichiers générés en interne (pas d'entrée utilisateur), reclasser en `info`."

remediation_ref: rules/remediation/imagetragick.md
knowledge_ref: knowledge/upload/imagetragick.md
