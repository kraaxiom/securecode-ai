id: missing-x-frame-options
language: php
category: headers
cwe: CWE-1021
owasp: A05:2021-Security Misconfiguration
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détection au niveau applicatif PHP de l'absence d'envoi de l'en-tête
    X-Frame-Options (ou de la directive CSP frame-ancestors) via header().
    La vérification exhaustive reste souvent de niveau config/infra (nginx
    add_header, Apache Header always set) et doit être complétée par un
    contrôle sur la configuration du serveur web ou du reverse proxy.
  patterns:
    - "absence d'appel header('X-Frame-Options: ...') dans le point d'entrée ou le middleware global"
    - "absence de directive frame-ancestors dans une éventuelle CSP existante"
    - "absence de directive add_header X-Frame-Options dans la configuration nginx associée"
    - "absence de directive Header always set X-Frame-Options dans la configuration Apache associée"
  exclude_if:
    - "l'en-tête X-Frame-Options ou la directive frame-ancestors est définie globalement au niveau du reverse proxy/CDN en amont de l'application"
    - "un middleware de sécurité ajoute déjà systématiquement cet en-tête"

message: >
  En-tête X-Frame-Options absent des réponses HTTP — la page peut être
  intégrée dans une iframe tierce et exposée à une attaque de clickjacking
  (voir rules/remediation/missing-x-frame-options.md).

false_positive_notes:
  - "Si l'en-tête est injecté par un reverse proxy, un CDN ou un middleware framework en amont du code PHP scanné, ce n'est pas un vrai positif au niveau applicatif — vérifier la configuration infra avant de remonter le finding."
  - "Si une directive frame-ancestors équivalente est déjà présente dans la CSP de l'application, l'absence de X-Frame-Options seul n'est pas un vrai positif — vérifier la CSP avant de remonter en sévérité pleine."

remediation_ref: rules/remediation/missing-x-frame-options.md
knowledge_ref: knowledge/headers/missing-x-frame-options.md
