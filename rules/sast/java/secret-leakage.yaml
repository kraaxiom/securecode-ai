id: secret-leakage
language: java
category: llm
cwe: CWE-200
owasp: LLM02:2025-Sensitive-Information-Disclosure
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte, dans du code LangChain4j/Spring AI, des secrets applicatifs
    (clé API, mot de passe, jeton) codés en dur et transmis dans le contexte
    du prompt ou exposés via les logs/traces d'appel au modèle, risquant une
    fuite via la sortie générée ou les journaux.
  patterns:
    - "OpenAiChatModel.builder().apiKey(\"sk-...\") ou apiKey(\"AIza...\") littéral en dur dans le code source au lieu d'une variable d'environnement/vault"
    - "PromptTemplate incluant directement une variable contenant un secret (mot de passe, clé d'API interne) dans le texte envoyé au modèle"
    - "logging.level.dev.langchain4j / logging.level.org.springframework.ai=DEBUG activé en production, journalisant l'intégralité des prompts/réponses pouvant contenir des secrets"
    - "@Tool retournant directement le contenu d'un fichier de configuration (application.yml, .env) sans filtrage des clés sensibles avant transmission au modèle"

message: >
  Secret applicatif codé en dur ou transmis dans le contexte d'un prompt/log
  LLM — risque de fuite (secret leakage) via la réponse générée, les
  journaux de débogage ou une extraction ultérieure. Externaliser les
  secrets (variables d'environnement, vault), ne jamais inclure de secret
  dans un prompt, et désactiver le logging détaillé des échanges LLM en
  production.

false_positive_notes:
  - "Si la clé API est chargée depuis une variable d'environnement ou un gestionnaire de secrets (Vault, AWS Secrets Manager) et non codée en dur, ce n'est pas un cas positif."
  - "Le logging DEBUG en environnement de développement isolé (pas de données réelles) présente un risque réduit — vérifier l'environnement cible."

remediation_ref: rules/remediation/secret-leakage.md
knowledge_ref: knowledge/llm/secret-leakage.md
