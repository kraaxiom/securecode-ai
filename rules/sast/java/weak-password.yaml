id: weak-password
language: java
category: auth
cwe: CWE-521
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une validation de mot de passe (annotation Bean Validation ou logique manuelle)
    reposant uniquement sur une longueur minimale faible, sans vérification contre une liste
    de mots de passe compromis, ou imposant une rotation périodique obligatoire sans
    justification.
  patterns:
    - "@Size(min = 6) String password  # longueur minimale insuffisante sans autre contrôle"
    - "if (password.length() < 6) { ... }  # seul contrôle appliqué"
  exclude_if:
    - "la longueur minimale exigée est d'au moins 12 caractères et/ou un contrôle contre une liste de mots de passe compromis est appliqué"
    - "aucune règle de rotation périodique obligatoire n'est imposée sans justification"

message: >
  Politique de mot de passe reposant sur une longueur minimale insuffisante sans contrôle
  contre les mots de passe compromis — exiger au moins 12 caractères et vérifier contre une
  liste de mots de passe compromis connus, sans rotation périodique injustifiée (voir
  rules/remediation/weak-password.md).

false_positive_notes:
  - "Si la validation de longueur minimale est complétée par un contrôle applicatif externe (service anti-compromission) non visible dans ce fichier, vérifier avant de conclure."
  - "Les contraintes de complexité (majuscule/spécial) sans longueur suffisante restent un vrai positif selon NIST 800-63B, même si elles semblent restrictives."

remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
