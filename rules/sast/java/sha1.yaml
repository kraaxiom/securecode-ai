id: sha1
language: java
category: crypto
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation de MessageDigest.getInstance("SHA-1") ou d'un HMAC
    SHA-1 pour du hachage de mot de passe, une signature ou une preuve
    d'intégrité opposable à un attaquant.
  patterns:
    - 'MessageDigest.getInstance("SHA-1")'
    - 'MessageDigest.getInstance("SHA1")'
    - 'DigestUtils.sha1Hex(_)'
    - 'Mac.getInstance("HmacSHA1")'
    - 'Signature.getInstance("SHA1withRSA")'
  exclude_if:
    - "L'usage sert uniquement à un checksum interne non adversarial (git-like content addressing) sans enjeu de sécurité"

message: >
  SHA-1 est cryptographiquement cassé (collision pratique démontrée) — pour
  un mot de passe utiliser Argon2id, pour une signature/intégrité utiliser
  SHA-256 ou supérieur (voir rules/remediation/sha1.md).

false_positive_notes:
  - "Si SHA-1 est utilisé uniquement comme identifiant non sécurisé (ex: clé de cache), reclasser en `low`/`info`."
  - "Un HMAC-SHA1 dans un flux OAuth1 legacy imposé par un tiers reste un risque à documenter, ne pas déclasser automatiquement."

remediation_ref: rules/remediation/sha1.md
knowledge_ref: knowledge/crypto/sha1.md
