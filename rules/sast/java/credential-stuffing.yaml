id: credential-stuffing
language: java
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte l'absence de détection comportementale (vélocité globale de tentatives, diversité
    des comptes testés depuis une même source) sur le flux d'authentification Spring
    Security, en complément de l'absence de proposition de MFA (`@RequestMapping` de login
    sans intégration de fournisseur MFA ni de service anti-abus).
  patterns:
    - "class ...LoginController ... authenticationManager.authenticate(...)  # sans intégration MFA ni service de détection d'abus"
  exclude_if:
    - "un service de détection comportementale ou de vérification contre des listes de fuites est intégré au flux d'inscription/connexion"
    - "l'authentification multi-facteurs est proposée ou imposée"

message: >
  Flux d'authentification sans détection comportementale ni MFA proposé — compléter le rate
  limiting par compte avec une détection de vélocité globale et proposer une authentification
  multi-facteurs (voir rules/remediation/credential-stuffing.md).

false_positive_notes:
  - "Ce pattern nécessite une analyse contextuelle du flux global d'authentification, pas seulement du contrôleur — confiance par défaut faible."
  - "Si le MFA est imposé pour tous les comptes sensibles, reclasser en `info`."

remediation_ref: rules/remediation/credential-stuffing.md
knowledge_ref: knowledge/auth/credential-stuffing.md
