id: boolean-sqli
language: java
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une clause WHERE construite par concaténation où une entrée
    utilisateur peut altérer la logique booléenne de la requête
    (ex: `WHERE id=' + input + '`), permettant une injection booléenne
    (`OR 1=1`).
  patterns:
    - "Statement.executeQuery(string_concat(_, \"WHERE\", _, $var, _))"
    - "JdbcTemplate.query(string_concat(_, \"AND\", _, $var, _), _)"
  exclude_if:
    - "$var est un littéral constant"
    - "$var est délimité par des guillemets échappés via une fonction d'échappement dédiée au driver JDBC ET documentée comme sûre"

message: >
  Clause conditionnelle SQL construite par concaténation directe d'une
  entrée utilisateur — un attaquant peut injecter une expression booléenne
  toujours vraie ; utiliser un PreparedStatement avec paramètre lié
  (voir rules/remediation/boolean-sqli.md).

false_positive_notes:
  - "L'échappement manuel de quotes n'est jamais considéré comme suffisant par cette règle — seul le paramétrage lié désactive l'alerte."
  - "Si la variable est un booléen Java strict (pas une chaîne), ce pattern ne s'applique pas."

remediation_ref: rules/remediation/boolean-sqli.md
knowledge_ref: knowledge/injections/boolean-sqli.md
