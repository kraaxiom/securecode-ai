id: jwt-weak-secret
language: java
category: auth
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un secret de signature JWT HMAC codé en dur, court, ou correspondant à une
    valeur d'exemple de documentation, passé à `Keys.hmacShaKeyFor()` ou équivalent dans une
    application Spring.
  patterns:
    - "Keys.hmacShaKeyFor($literalShortString.getBytes())"
    - "Jwts.builder().signWith(SignatureAlgorithm.HS256, \"secret\")"
    - "jwt.secret=changeme  # dans application.properties/application.yml"
  exclude_if:
    - "le secret est chargé depuis un gestionnaire de secrets externe (Vault, AWS Secrets Manager) avec une valeur générée aléatoirement"
    - "la longueur/entropie du secret est suffisante par rapport à l'algorithme (256 bits minimum pour HS256) et non codée en dur dans le code versionné"

message: >
  Secret JWT court ou codé en dur dans le code/la configuration — générer un secret
  cryptographiquement aléatoire d'entropie suffisante et le stocker dans un gestionnaire de
  secrets dédié, avec rotation régulière (voir rules/remediation/jwt-weak-secret.md).

false_positive_notes:
  - "Si la valeur littérale n'est présente que dans un fichier de test/exemple explicitement exclu du déploiement, reclasser en `info`."
  - "Une variable d'environnement dont la valeur réelle n'est pas visible dans le code n'est pas un vrai positif au niveau SAST, même si son nom suggère un défaut — signaler pour audit de configuration plutôt que remonter en `high` automatique."

remediation_ref: rules/remediation/jwt-weak-secret.md
knowledge_ref: knowledge/auth/jwt-weak-secret.md
