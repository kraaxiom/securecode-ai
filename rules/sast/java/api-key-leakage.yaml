id: api-key-leakage
language: java
category: api
cwe: CWE-798
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une clé API, un secret ou un jeton codé en dur dans le code source
    Java (constante String, annotation Spring @Value avec valeur littérale par
    défaut) au lieu d'être chargé depuis un gestionnaire de secrets.
  patterns:
    - "private static final String API_KEY = \"...\" avec une valeur littérale ressemblant à un secret (longueur, entropie, préfixe connu type sk_/AKIA)"
    - "@Value(\"${some.key:sk_live_...}\") avec une valeur par défaut littérale de secret dans l'annotation"
    - "clé API concaténée directement dans une URL ou un en-tête HTTP (RestTemplate, WebClient) sans passer par une variable d'environnement ou un secret manager"
  exclude_if:
    - "la valeur provient de @Value(\"${...}\") sans valeur par défaut, résolue depuis application.properties externalisé, une variable d'environnement, ou un secret manager (Vault, AWS Secrets Manager)"
    - "il s'agit d'une valeur de test/mock clairement non fonctionnelle utilisée uniquement dans le code de test unitaire"

message: >
  Une clé API ou un secret est codé en dur dans le code source — visible par
  quiconque a accès au dépôt et non révocable sans redéploiement. Charger la
  valeur depuis un gestionnaire de secrets (Vault, AWS Secrets Manager) ou une
  variable d'environnement injectée via @Value sans valeur par défaut littérale.

false_positive_notes:
  - "Dans les classes de test (@Test, src/test/java), une clé factice clairement non fonctionnelle est acceptable — reclasser en `info`."
  - "Vérifier que la valeur n'est pas déjà un placeholder résolu par un profil Spring (ex: ${VAULT_SECRET}) mal détecté comme littéral."

remediation_ref: rules/remediation/api-key-leakage.md
knowledge_ref: knowledge/api/api-key-leakage.md
