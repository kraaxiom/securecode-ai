id: weak-jwt-secret
language: java
category: crypto
cwe: CWE-1391
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un secret JWT HMAC court, littéral ou prévisible passé à une
    bibliothèque de signature (io.jsonwebtoken/jjwt, java-jwt/Auth0), ainsi
    qu'une signature HS256 sans vérification stricte de l'algorithme attendu.
  patterns:
    - 'Keys.hmacShaKeyFor("_literal_court_".getBytes())'
    - 'Jwts.builder().signWith(SignatureAlgorithm.HS256, "_literal_")'
    - 'Algorithm.HMAC256("_literal_")'
    - 'JWT.require(Algorithm.HMAC256("_literal_"))'
  exclude_if:
    - "Le secret est lu depuis System.getenv() ou un gestionnaire de configuration externe et non un littéral en dur"
    - "Le littéral fait partie d'un test unitaire isolé sans lien avec une clé de production"

message: >
  Secret JWT faible, littéral ou codé en dur — générer un secret HMAC d'au
  moins 256 bits via SecureRandom, le stocker hors du code source, et
  valider explicitement l'algorithme attendu à la vérification
  (voir rules/remediation/weak-jwt-secret.md).

false_positive_notes:
  - "Un secret suffisamment long et à haute entropie mais tout de même codé en dur reste un risque de type hardcoded-keys — signaler les deux si applicable."
  - "Vérifier si l'algorithme est explicitement épinglé côté vérification (pas de confusion HS256/RS256/alg:none) avant de conclure sur la sévérité."

remediation_ref: rules/remediation/weak-jwt-secret.md
knowledge_ref: knowledge/crypto/weak-jwt-secret.md
