id: formula-injection
language: java
category: injections
cwe: CWE-1236
owasp: A03:2021-Injection
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'écriture d'une valeur utilisateur directement comme formule de
    cellule via Apache POI (Cell.setCellFormula) ou dans un champ de feuille
    de calcul générée dynamiquement, sans validation stricte du contenu.
  patterns:
    - "Cell.setCellFormula($var)"
    - "Cell.setCellFormula(string_concat(_, $var, _))"
  exclude_if:
    - "$var est un littéral constant défini par le code (pas une entrée utilisateur)"
    - "$var est validé par whitelist stricte de formules autorisées"

message: >
  Contenu utilisateur affecté directement comme formule de cellule Excel —
  un attaquant peut injecter une formule arbitraire exécutée à l'ouverture
  du classeur ; ne jamais laisser une entrée utilisateur définir une
  formule, utiliser setCellValue() pour une valeur statique
  (voir rules/remediation/formula-injection.md).

false_positive_notes:
  - "Si la formule est entièrement définie côté serveur sans variable utilisateur, ce n'est pas concerné."
  - "L'utilisation de setCellValue() (valeur, pas formule) pour du contenu utilisateur n'est pas concernée par cette règle spécifique — voir csv-injection pour ce cas."

remediation_ref: rules/remediation/formula-injection.md
knowledge_ref: knowledge/injections/formula-injection.md
