id: default-credentials
language: java
category: auth
cwe: CWE-1392
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte des identifiants en dur dans la configuration Spring (`application.properties`/
    `application.yml`), des scripts de seed JPA/Hibernate ou une configuration Spring
    Security (`InMemoryUserDetailsManager`) avec des valeurs standards (`admin`/`admin`,
    `password`, `changeit`) réutilisées telles quelles.
  patterns:
    - "spring.security.user.password=admin"
    - "spring.security.user.password=password"
    - "InMemoryUserDetailsManager(User.withUsername(\"admin\").password(\"admin\") ...)"
    - "@Bean CommandLineRunner ... userRepository.save(new User(\"admin\", \"admin\", ...))"
  exclude_if:
    - "le mot de passe est généré aléatoirement au démarrage/déploiement et jamais codé en dur"
    - "le compte est explicitement limité aux profils de test/dev et exclu du profil de production (@Profile)"

message: >
  Identifiants par défaut codés en dur dans la configuration ou le seed applicatif — générer
  un mot de passe unique et aléatoire à l'installation et forcer son changement à la première
  connexion (voir rules/remediation/default-credentials.md).

false_positive_notes:
  - "Si le compte est strictement limité au profil `dev`/`test` via @Profile et exclu de la production, reclasser en `info`."
  - "Vérifier que la valeur n'est pas un placeholder résolu dynamiquement (variable d'environnement) plutôt qu'une valeur littérale."

remediation_ref: rules/remediation/default-credentials.md
knowledge_ref: knowledge/auth/default-credentials.md
