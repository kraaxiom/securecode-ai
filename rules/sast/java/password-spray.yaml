id: password-spray
language: java
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte une limitation des tentatives d'authentification appliquée uniquement par compte
    (ex. compteur d'échecs sur l'entité `User`) sans agrégation globale par IP/source, dans
    un contrôleur Spring Security exposé publiquement.
  patterns:
    - "user.incrementFailedAttempts()  # limitation uniquement par compte, sans compteur global par IP"
  exclude_if:
    - "une détection globale par IP/source (fenêtre de temps, volume d'échecs tous comptes confondus) complète la limitation par compte"
    - "l'authentification multi-facteurs est imposée sur les comptes sensibles"

message: >
  Limitation des tentatives d'authentification appliquée uniquement par compte, sans
  agrégation globale par source — compléter par une détection de volume d'échecs distribués
  sur de nombreux comptes depuis une même origine (voir
  rules/remediation/password-spray.md).

false_positive_notes:
  - "Une protection au niveau infrastructure (WAF, API Gateway avec rate limiting global) peut déjà couvrir ce cas — vérifier avant de remonter en vrai positif isolé."
  - "Confiance par défaut faible car ce pattern nécessite une vue d'ensemble du pipeline d'authentification, pas seulement du code applicatif."

remediation_ref: rules/remediation/password-spray.md
knowledge_ref: knowledge/auth/password-spray.md
