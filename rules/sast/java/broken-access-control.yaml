id: broken-access-control
language: java
category: authorization
cwe: CWE-284
owasp: A01:2021-Broken Access Control
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un endpoint Spring MVC/REST sensible (lecture/écriture/suppression) protégé
    uniquement par l'authentification (`@PreAuthorize(\"isAuthenticated()\")` ou absence
    totale d'annotation d'autorisation) sans vérification de rôle/permission propre à la
    ressource ou à l'action.
  patterns:
    - "@PostMapping/@DeleteMapping/@PutMapping(...)  # sans @PreAuthorize/@Secured ni vérification d'autorisation dans le corps de méthode"
    - "@PreAuthorize(\"isAuthenticated()\")  # authentification seule, pas d'autorisation propre à la ressource"
  exclude_if:
    - "une vérification d'autorisation explicite (annotation @PreAuthorize avec expression de rôle/permission, ou contrôle programmatique) est appliquée sur l'action ou la ressource"
    - "l'endpoint ne manipule aucune donnée/action sensible (endpoint public par conception)"

message: >
  Endpoint sensible protégé uniquement par l'authentification, sans vérification
  d'autorisation propre à la ressource ou à l'action — centraliser la logique d'autorisation
  dans une couche appliquée systématiquement et refuser par défaut (voir
  rules/remediation/broken-access-control.md).

false_positive_notes:
  - "Si l'autorisation est appliquée en amont via un filtre/interceptor global couvrant l'ensemble des routes sensibles, vérifier sa couverture avant de remonter en vrai positif par endpoint."
  - "Les endpoints publics par conception (contenu non sensible) ne sont pas concernés."

remediation_ref: rules/remediation/broken-access-control.md
knowledge_ref: knowledge/authorization/broken-access-control.md
