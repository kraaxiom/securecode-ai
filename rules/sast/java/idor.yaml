id: idor
language: java
category: authorization
cwe: CWE-639
owasp: A01:2021-Broken Access Control
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un endpoint Spring récupérant/modifiant une entité par identifiant transmis par
    le client (`@PathVariable`) via un repository JPA sans clause de filtrage sur le
    propriétaire/tenant courant.
  patterns:
    - "@GetMapping(\"/{id}\") ... repository.findById($id)  # sans vérification que $id appartient à l'utilisateur courant"
    - "@PutMapping(\"/{id}\") ... repository.save(...)  # même absence de vérification d'appartenance"
  exclude_if:
    - "la requête inclut une clause de filtrage sur le propriétaire/tenant courant (ex. repository.findByIdAndUserId($id, currentUser.getId()))"
    - "une vérification d'autorisation explicite par objet est appliquée après récupération, avant tout accès/modification"

message: >
  Objet récupéré/modifié par un identifiant fourni par le client sans vérification
  d'appartenance à l'utilisateur courant — inclure systématiquement une clause de filtrage
  sur le propriétaire/tenant dans la requête de données (voir rules/remediation/idor.md).

false_positive_notes:
  - "Si la vérification d'appartenance est effectuée dans une couche service/policy centralisée appelée systématiquement après la récupération, ce n'est pas un vrai positif isolé — vérifier la couverture réelle."
  - "Les ressources publiques par conception (pas de notion de propriétaire) ne sont pas concernées."

remediation_ref: rules/remediation/idor.md
knowledge_ref: knowledge/authorization/idor.md
