id: time-based-sqli
language: java
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une requête SQL concaténée exécutée sur un driver supportant les
    fonctions de délai (ex: MySQL SLEEP, PostgreSQL pg_sleep) sans validation
    de la variable injectée, exploitable en injection temporelle.
  patterns:
    - "Statement.executeQuery(string_concat(_, $var, _)) sur connexion MySQL/PostgreSQL/MSSQL"
    - "JdbcTemplate.query(string_concat(_, $var, _), _)"
  exclude_if:
    - "$var est un littéral constant"
    - "$var est casté en type numérique avant concaténation"
    - "un timeout de requête strict (setQueryTimeout) est configuré ET la variable est par ailleurs validée par whitelist"

message: >
  Requête SQL concaténée avec une entrée non validée sur un moteur supportant
  des fonctions de délai — exploitable en injection SQL time-based même sans
  restitution de données ; utiliser un PreparedStatement paramétré
  (voir rules/remediation/time-based-sqli.md).

false_positive_notes:
  - "Un setQueryTimeout() court limite l'impact mais ne supprime pas la vulnérabilité — la règle reste applicable."
  - "Si $var ne provient d'aucune entrée externe, il n'y a pas de vecteur exploitable."

remediation_ref: rules/remediation/time-based-sqli.md
knowledge_ref: knowledge/injections/time-based-sqli.md
