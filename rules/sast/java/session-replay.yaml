id: session-replay
language: java
category: sessions
cwe: CWE-294
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un jeton de session ou d'authentification réutilisable sans preuve
    de fraîcheur (nonce, timestamp validé, liaison à la requête) dans un
    contrôleur Spring, permettant le rejeu d'une requête interceptée.
  patterns:
    - "endpoint sensible (transfert, changement de mot de passe) protégé uniquement par un cookie de session sans jeton anti-rejeu (nonce/CSRF token à usage unique)"
    - "@RequestMapping consommant un en-tête d'authentification statique sans vérification d'horodatage ni de nonce"
  exclude_if:
    - "un jeton CSRF Spring Security à usage unique ou une validation de nonce/timestamp est présente"
    - "l'action est idempotente et sans impact métier (lecture seule)"

message: >
  Aucune protection contre le rejeu n'est visible pour cette action sensible —
  un attaquant interceptant une requête légitime (session/jeton) peut la
  rejouer. Ajouter un nonce à usage unique ou une validation de fraîcheur
  temporelle en plus de l'authentification par session.

false_positive_notes:
  - "TLS seul ne protège pas contre le rejeu si le canal est compromis en amont (proxy, malware) — ne pas exclure sur ce seul critère."
  - "Si l'action est en lecture seule et sans effet de bord, reclasser en `low`."

remediation_ref: rules/remediation/session-replay.md
knowledge_ref: knowledge/sessions/session-replay.md
