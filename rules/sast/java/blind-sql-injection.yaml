id: blind-sql-injection
language: java
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une requête SQL concaténée dont le résultat n'est pas directement
    renvoyé au client (utilisée seulement pour un booléen/condition ou un
    compteur), typique de l'exploitation en aveugle (boolean/time-based).
  patterns:
    - "Statement.executeQuery(string_concat(_, $var, _)) suivi de ResultSet.next() utilisé comme condition"
    - "JdbcTemplate.queryForObject(string_concat(_, $var, _), Boolean.class)"
    - "JdbcTemplate.queryForObject(string_concat(_, $var, _), Integer.class)"
  exclude_if:
    - "$var est un littéral constant"
    - "$var est casté en type numérique avant concaténation"

message: >
  Requête SQL concaténée dont le résultat sert de condition logique — même
  sans restitution directe des données, la valeur reste exploitable en
  injection aveugle (boolean/time-based) ; utiliser un PreparedStatement
  paramétré (voir rules/remediation/blind-sql-injection.md).

false_positive_notes:
  - "Si $var ne provient d'aucune entrée externe (paramètre HTTP, en-tête, fichier importé), le vecteur n'est pas exploitable."
  - "Un contrôle strict de longueur et de charset en amont réduit mais ne supprime pas totalement le risque — ne pas déclasser sans revue manuelle."

remediation_ref: rules/remediation/blind-sql-injection.md
knowledge_ref: knowledge/injections/blind-sql-injection.md
