id: tls1-0
language: java
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une configuration SSLContext ou un tableau de protocoles activant
    explicitement TLSv1.0 ou TLSv1.1, dépréciés par la RFC 8996 et exclus des
    référentiels de conformité (PCI-DSS) depuis 2018.
  patterns:
    - 'SSLContext.getInstance("TLSv1")'
    - 'SSLContext.getInstance("TLSv1.1")'
    - 'setEnabledProtocols(_) // tableau contenant "TLSv1" ou "TLSv1.1"'
    - 'new String[] { "TLSv1", _ }'
    - 'new String[] { "TLSv1.1", _ }'
  exclude_if:
    - "Le protocole apparaît uniquement dans une liste de compatibilité descendante immédiatement suivie d'un filtrage explicite au minimum TLSv1.2"

message: >
  Protocole TLS 1.0/1.1 activé — restreindre SSLContext et
  setEnabledProtocols() à ["TLSv1.2", "TLSv1.3"] au minimum
  (voir rules/remediation/tls1-0.md).

false_positive_notes:
  - "Si TLSv1.0/1.1 est listé uniquement pour un diagnostic de compatibilité et rejeté immédiatement après par une politique explicite, reclasser en `low`."
  - "Une intégration avec un système tiers legacy imposant TLS 1.0 doit être documentée comme risque accepté, pas silencieusement déclassée."

remediation_ref: rules/remediation/tls1-0.md
knowledge_ref: knowledge/crypto/tls1-0.md
