id: imap-injection
language: java
category: injections
cwe: CWE-93
owasp: A03:2021-Injection
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte la construction d'une commande IMAP (via JavaMail
    Store.getFolder/Folder.search ou une commande brute sur le protocole)
    par concaténation d'une entrée utilisateur non échappée, permettant
    l'injection de commandes IMAP additionnelles via CR/LF.
  patterns:
    - "Folder.search(string_concat(_, $var, _))"
    - "IMAPFolder.doCommand(string_concat(_, $var, _))"
  exclude_if:
    - "$var passe par une neutralisation des caractères \\r, \\n et guillemets avant concaténation"
    - "l'API SearchTerm typée (SubjectTerm, FromTerm, etc.) est utilisée au lieu d'une commande brute concaténée"

message: >
  Commande IMAP construite par concaténation d'une entrée non échappée —
  un attaquant peut injecter des séquences CRLF pour ajouter des commandes
  IMAP arbitraires ; utiliser les SearchTerm typés de JavaMail plutôt que
  des commandes texte concaténées, et neutraliser \\r\\n
  (voir rules/remediation/imap-injection.md).

false_positive_notes:
  - "L'utilisation exclusive de SearchTerm typés (SubjectTerm, FromStringTerm) n'est pas concernée car l'API échappe en interne."
  - "Si $var ne provient d'aucune entrée externe, ce n'est pas exploitable."

remediation_ref: rules/remediation/imap-injection.md
knowledge_ref: knowledge/injections/imap-injection.md
