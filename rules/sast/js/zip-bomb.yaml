id: zip-bomb
language: javascript
category: upload
cwe: CWE-409
owasp: A05:2021-Security Misconfiguration
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un appel d'extraction d'archive complète (AdmZip.extractAllTo,
    extract-zip) sur un fichier téléversé sans vérification préalable de la
    taille décompressée totale ni du nombre d'entrées, permettant une bombe de
    décompression (déni de service).
  patterns:
    - "new AdmZip(_).extractAllTo(_)"
    - "extract(zipPath, { dir: _ }) // sans lecture préalable des entrées et de leur taille cumulée"
  exclude_if:
    - "une lecture préalable des entrées (yauzl entry.uncompressedSize, AdmZip.getEntries()) calcule une taille cumulée et un nombre d'entrées comparés à des limites avant extraction"
    - "l'extraction s'effectue en streaming avec vérification incrémentale et arrêt anticipé au dépassement d'un seuil"

message: >
  Extraction d'archive sans vérification préalable de taille décompressée ni de
  nombre d'entrées — risque de bombe de décompression (déni de service), voir
  rules/remediation/zip-bomb.md.

false_positive_notes:
  - "Si l'extraction s'exécute dans un conteneur/processus avec quotas mémoire et timeout stricts configurés en dehors du code applicatif, le risque est atténué mais la vérification applicative reste recommandée en défense en profondeur."
  - "Une archive dont la source est strictement interne (générée par l'application, pas d'upload utilisateur) n'est pas concernée — reclasser en `info`."

remediation_ref: rules/remediation/zip-bomb.md
knowledge_ref: knowledge/upload/zip-bomb.md
