id: oauth-misconfiguration
language: js
category: auth
cwe: CWE-287
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un callback OAuth/OIDC (client.callback) appelé sans options
    state/nonce, ou une URL d'autorisation générée sans paramètre state.
  patterns:
    - "client.authorizationUrl({ scope: _ }) sans propriété state ni nonce"
    - "client.callback(redirectUri, params) sans options { state, nonce }"
  exclude_if:
    - "Le state et le nonce sont générés via generators.state()/generators.nonce() et stockés en session avant l'appel"

message: >
  Flux OAuth/OIDC sans génération/vérification de state ou nonce — expose
  à une CSRF sur le callback ou à un rejeu de jeton (voir
  rules/remediation/oauth-misconfiguration.md).

false_positive_notes:
  - "Certaines bibliothèques (openid-client récent) exigent PKCE en remplacement partiel du state — vérifier la configuration complète du flux avant de confirmer."

remediation_ref: rules/remediation/oauth-misconfiguration.md
knowledge_ref: knowledge/auth/oauth-misconfiguration.md
