id: data-poisoning
language: javascript
category: llm
cwe: CWE-349
owasp: LLM04:2025-Data-and-Model-Poisoning
severity: high
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un pipeline d'entraînement/fine-tuning consommant des données
    provenant d'une source externe ou d'un feedback utilisateur sans
    vérification de provenance/intégrité ni détection d'anomalies avant
    intégration.
  patterns:
    - "dataset.push(...await fetchAndParse(url)) dans une boucle sans vérification préalable de TRUSTED_SOURCES"
    - "trainingSetBuilder.addFeedback(userInput) sans passage par filterStatisticalOutliers ou revue humaine"
  exclude_if:
    - "La source est vérifiée contre une allowlist de sources de confiance avant intégration"
    - "Une étape de filtrage d'anomalies statistiques est appliquée avant l'ajout au dataset"

message: >
  Ingestion de données d'entraînement sans validation de provenance ni
  détection d'anomalies — risque d'empoisonnement du modèle (voir
  rules/remediation/data-poisoning.md).

false_positive_notes:
  - "Si le dataset provient exclusivement d'une source interne figée et versionnée, ce n'est pas exploitable — reclasser en `info`."
  - "Vérifier si un jeu de référence (golden set) est utilisé après entraînement avant de considérer la remédiation absente."

remediation_ref: rules/remediation/data-poisoning.md
knowledge_ref: knowledge/llm/data-poisoning.md
