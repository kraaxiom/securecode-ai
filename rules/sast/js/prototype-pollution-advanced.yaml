id: prototype-pollution-advanced
language: js
category: modern
cwe: CWE-1321
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une fonction de fusion/clonage récursive maison ou un appel à une
    bibliothèque de merge (lodash.merge, deepmerge, jQuery.extend) appliquée à
    une entrée utilisateur (JSON.parse, req.body) sans filtrage des clés
    __proto__/constructor/prototype ni objet sans prototype.
  patterns:
    - "recursive merge function iterating 'for (const key in source)' without excluding '__proto__'|'constructor'|'prototype'"
    - "_.merge(_, JSON.parse(userInput)) or _.merge(_, req.body) without a prior schema validation call"
    - "Object.assign(globalState, JSON.parse(userInput)) where globalState is shared across requests"
  exclude_if:
    - "la fonction de fusion exclut explicitement '__proto__', 'constructor', 'prototype' via une vérification de clé"
    - "l'objet cible est créé avec Object.create(null) ou est une instance de Map"

message: >
  Fusion récursive d'une entrée utilisateur sans filtrage des clés dangereuses
  — risque de pollution de Object.prototype pouvant se propager à toute
  l'application (voir rules/remediation/prototype-pollution-advanced.md).

false_positive_notes:
  - "Si la bibliothèque de merge utilisée est en version patchée ET qu'une validation de schéma (ajv, joi, zod) précède l'appel, reclasser en `medium`."
  - "Fusion appliquée uniquement à des données internes constantes (non issues d'une requête utilisateur) : non applicable."

remediation_ref: rules/remediation/prototype-pollution-advanced.md
knowledge_ref: knowledge/modern/prototype-pollution-advanced.md
