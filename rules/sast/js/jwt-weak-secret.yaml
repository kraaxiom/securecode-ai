id: jwt-weak-secret
language: js
category: auth
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: regex-pattern
  description: >
    Détecte un secret JWT court ou en dur passé à jwt.sign/jwt.verify au lieu
    d'être chargé depuis une variable d'environnement/gestionnaire de secrets.
  patterns:
    - "jwt\\.sign\\([^,]+,\\s*['\"][^'\"]{1,31}['\"]"
    - "(JWT_SECRET|jwtSecret)\\s*=\\s*['\"](secret|changeme|your-256-bit-secret|123456)['\"]"
  exclude_if:
    - "Le secret provient de process.env.JWT_SECRET ou d'un module de configuration/vault"

message: >
  Secret JWT court ou codé en dur détecté — utiliser un secret aléatoire
  d'au moins 256 bits stocké dans un gestionnaire de secrets (voir
  rules/remediation/jwt-weak-secret.md).

false_positive_notes:
  - "Une valeur littérale utilisée uniquement dans un test unitaire isolé n'est pas exploitable en production — reclasser en `info`."
  - "Vérifier que la variable n'est pas immédiatement écrasée par une valeur chargée depuis un vault avant utilisation réelle."

remediation_ref: rules/remediation/jwt-weak-secret.md
knowledge_ref: knowledge/auth/jwt-weak-secret.md
