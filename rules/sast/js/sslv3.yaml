id: sslv3
language: js
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'activation explicite de SSLv3 dans une configuration
    https/tls Node.js.
  patterns:
    - "https.createServer({\"secureProtocol\": \"SSLv3_method\"}, _)"
    - "tls.createServer({\"secureProtocol\": \"SSLv3_method\"}, _)"
    - "tls.connect({\"secureProtocol\": \"SSLv3_method\"})"
  exclude_if:
    - "la constante est utilisée uniquement pour la détecter/refuser explicitement dans une vérification de conformité"

message: >
  SSLv3 est vulnérable à l'attaque POODLE et interdit par la RFC 7568 —
  forcer TLS 1.2 minimum via minVersion: 'TLSv1.2', idéalement TLS 1.3
  (voir rules/remediation/sslv3.md).

false_positive_notes:
  - "Aucun cas légitime connu d'activation volontaire de SSLv3 en 2026 — ce finding ne doit quasiment jamais être déclassé."
  - "Vérifier qu'il ne s'agit pas d'un test unitaire vérifiant que la connexion SSLv3 est bien rejetée par l'application."

remediation_ref: rules/remediation/sslv3.md
knowledge_ref: knowledge/crypto/sslv3.md
