id: credential-stuffing
language: js
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte une route de connexion Node.js sans agrégation de vélocité par IP
    (tous comptes confondus) ni branchement MFA après authentification réussie.
  patterns:
    - "route /login: appel authenticate() suivi directement de issueToken() sans vérification mfaEnabled ni getFailedAttemptVelocity(ip)"
  exclude_if:
    - "Un module de détection anti-bot (reCAPTCHA, Turnstile, service de fraud-scoring) est appelé dans le handler"
    - "Un contrôle mfaEnabled est présent avant l'émission du token final"

message: >
  Route de connexion sans détection de trafic de credential stuffing ni MFA —
  voir rules/remediation/credential-stuffing.md.

false_positive_notes:
  - "Règle à confiance basse : la protection peut être assurée en amont par une passerelle API ou un WAF non visible dans le code applicatif."
  - "Confirmer manuellement avant escalade en sévérité `high`."

remediation_ref: rules/remediation/credential-stuffing.md
knowledge_ref: knowledge/auth/credential-stuffing.md
