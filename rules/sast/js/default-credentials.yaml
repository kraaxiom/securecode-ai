id: default-credentials
language: js
category: auth
cwe: CWE-1392
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: high

match:
  type: regex-pattern
  description: >
    Détecte des identifiants par défaut en dur dans du code Node.js de
    provisioning, de seed ou de configuration.
  patterns:
    - "(ADMIN_PASS|DEFAULT_PASSWORD|adminPassword)\\s*=\\s*['\"](admin|admin123|password|changeme|123456)['\"]"
    - "username:\\s*['\"]admin['\"],\\s*password:\\s*['\"](admin|admin123|password)['\"]"
  exclude_if:
    - "La constante est utilisée uniquement dans un fichier de test (répertoires test/, __tests__/, spec/)"
    - "La valeur est immédiatement remplacée par crypto.randomBytes(...) avant utilisation en base"

message: >
  Identifiant ou mot de passe par défaut détecté en dur — générer une valeur
  aléatoire et forcer son changement (voir rules/remediation/default-credentials.md).

false_positive_notes:
  - "Les données de test isolées de la production ne représentent pas un risque réel — reclasser en `info` si confirmé."
  - "Vérifier l'environnement d'exécution (NODE_ENV) associé au bloc de code avant escalade."

remediation_ref: rules/remediation/default-credentials.md
knowledge_ref: knowledge/auth/default-credentials.md
