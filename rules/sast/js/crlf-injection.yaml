id: crlf-injection
language: js
category: injections
cwe: CWE-93
owasp: A03:2021-Injection
severity: medium
confidence_default: medium

match:
  type: regex
  description: >
    Détecte l'appel à res.setHeader()/res.set() (Express) avec une valeur
    provenant directement d'une entrée requête (req.query/req.params/req.body)
    sans validation de l'absence de caractères CR/LF.
  patterns:
    - "res\\.(setHeader|set)\\s*\\(\\s*['\"][^'\"]+['\"]\\s*,\\s*req\\.(query|params|body)\\."
  exclude_if:
    - "La valeur est validée en amont par une regex ancrée rejetant explicitement \\r et \\n"
    - "L'appel utilise res.redirect() ou une API de framework qui encode déjà la valeur"

message: >
  Valeur issue d'une entrée requête affectée directement à un en-tête de
  réponse HTTP sans validation de l'absence de retour chariot/saut de ligne —
  filtrer ou rejeter les caractères CR/LF avant utilisation (voir
  rules/remediation/crlf-injection.md).

false_positive_notes:
  - "Node.js rejette nativement les en-têtes contenant des caractères CR/LF bruts depuis les versions récentes (ERR_INVALID_CHAR) — le risque direct est réduit mais le pattern reste un signal de mauvaise pratique."
  - "Si la valeur provient exclusivement d'une constante applicative interne, ce n'est pas exploitable — reclasser en `info`."

remediation_ref: rules/remediation/crlf-injection.md
knowledge_ref: knowledge/injections/crlf-injection.md
