id: web-shell-upload
language: javascript
category: upload
cwe: CWE-434
owasp: A04:2021-Insecure Design
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une configuration multer (ou équivalent) écrivant les fichiers
    téléversés dans un répertoire servi statiquement par express.static, sans
    fileFilter restrictif ni renommage côté serveur, exposant l'application au
    risque de dépôt et d'exécution de web shell (notamment via un backend
    proxifié vers un interpréteur de scripts).
  patterns:
    - "app.use(express.static(upload_destination_dir))"
    - "multer.diskStorage({ destination: string_literal_containing('public') }) // sans fileFilter défini"
  exclude_if:
    - "fileFilter valide le mimetype détecté par contenu et une liste blanche d'extensions stricte"
    - "la fonction filename génère un nom aléatoire indépendant du nom original"
    - "express.static ne sert pas le répertoire de destination des uploads (chemins distincts confirmés)"

message: >
  Répertoire d'upload servi statiquement sans filtrage ni renommage strict —
  risque de dépôt de web shell, voir rules/remediation/web-shell-upload.md.

false_positive_notes:
  - "Si le serveur ne proxifie/n'exécute aucun langage interprété sur ce chemin (SPA statique pure), l'impact d'exécution directe est nul, mais la validation de contenu reste recommandée."
  - "Un fileFilter défini dans un module importé séparément peut être manqué par une analyse locale au fichier."

remediation_ref: rules/remediation/web-shell-upload.md
knowledge_ref: knowledge/upload/web-shell-upload.md
