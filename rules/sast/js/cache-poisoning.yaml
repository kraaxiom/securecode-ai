id: cache-poisoning
language: js
category: modern
cwe: CWE-444
owasp: A04:2021-Insecure Design
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation de req.headers['x-forwarded-host'] ou req.hostname
    dérivé d'en-têtes non fiables pour construire une URL/contenu de réponse,
    sans validation contre une liste blanche d'hôtes.
  patterns:
    - "req.headers['x-forwarded-host'] used in template_literal without ALLOWED_HOSTS.has(_) check"
    - "req.headers['x-forwarded-proto'] used directly to build a redirect URL"
    - "req.headers['x-original-url'] used directly for routing or output"
  exclude_if:
    - "la valeur passe par un Set/Array whitelist .has()/.includes() avant utilisation"
    - "un middleware (ex: trust proxy configuré strictement) normalise déjà ces en-têtes"

message: >
  En-tête X-Forwarded-* utilisé sans validation pour construire du contenu —
  risque d'empoisonnement de cache si la clé de cache du CDN ne reflète pas
  cet en-tête (voir rules/remediation/cache-poisoning.md).

false_positive_notes:
  - "Si `app.set('trust proxy', ...)` est configuré avec une liste stricte d'IP de confiance, le risque est réduit."
  - "Applications sans CDN/cache partagé en frontal : reclasser en `medium`."

remediation_ref: rules/remediation/cache-poisoning.md
knowledge_ref: knowledge/modern/cache-poisoning.md
