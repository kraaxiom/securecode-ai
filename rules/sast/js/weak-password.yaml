id: weak-password
language: js
category: auth
cwe: CWE-521
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: medium

match:
  type: regex
  description: >
    Détecte un contrôle de longueur de mot de passe inférieur à 12 caractères,
    ou l'absence d'appel à un service de vérification de mots de passe compromis
    (ex: hibp, zxcvbn) à proximité d'un champ password lors de l'inscription.
  patterns:
    - "password\\.length\\s*<\\s*(?:[1-9]|1[01])\\b"
    - "min\\(\\s*(?:[1-9]|1[01])\\s*\\)"
  exclude_if:
    - "Le contrôle est délégué à un fournisseur d'identité externe (OAuth/OIDC) sans stockage local du mot de passe."

message: >
  Politique de mot de passe insuffisante (longueur minimale trop faible ou absence
  de vérification contre les mots de passe compromis) — voir rules/remediation/weak-password.md.

false_positive_notes:
  - "Un seuil de longueur faible utilisé uniquement pour un champ non-mot de passe (ex: code PIN à usage unique) est un faux positif — vérifier le contexte du champ."

remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
