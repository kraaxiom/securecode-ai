id: blind-sql-injection
language: js
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: regex
  description: >
    Détecte l'utilisation d'un template literal contenant une variable
    directement dans un appel connection.query()/db.query() dont le résultat
    est utilisé pour une décision booléenne (existence, longueur de tableau)
    plutôt qu'affiché tel quel — motif typique de l'injection SQL aveugle en
    Node.js (mysql, mysql2, pg).
  patterns:
    - "\\.(query|execute)\\s*\\(\\s*`[^`]*\\$\\{[^}]+\\}[^`]*`"
    - "rows\\.length\\s*[><=!]"
  exclude_if:
    - "L'appel utilise un placeholder positionnel (?) ou nommé avec un tableau de paramètres séparé"
    - "La variable interpolée provient d'une constante interne, pas d'une entrée req.*/params"

message: >
  Interpolation d'une valeur utilisateur dans une requête SQL dont le résultat
  conditionne un comportement binaire — remplacer par une requête paramétrée
  (placeholder ?) (voir rules/remediation/blind-sql-injection.md).

false_positive_notes:
  - "Un template literal sans variable interpolée provenant d'une entrée externe n'est pas exploitable."
  - "Si l'ORM (Sequelize, Knex) génère la requête paramétrée en interne malgré une syntaxe apparente de concaténation, vérifier manuellement avant de remonter en `high`."

remediation_ref: rules/remediation/blind-sql-injection.md
knowledge_ref: knowledge/injections/blind-sql-injection.md
