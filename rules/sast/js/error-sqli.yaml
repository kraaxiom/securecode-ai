id: error-sqli
language: js
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: regex
  description: >
    Détecte un appel connection.query()/db.query() avec un template literal
    interpolant une variable, combiné à un callback ou bloc catch qui renvoie
    err.message directement dans la réponse HTTP — motif typique de
    l'injection SQL basée sur les erreurs en Node.js.
  patterns:
    - "\\.(query|execute)\\s*\\(\\s*`[^`]*\\$\\{[^}]+\\}[^`]*`"
    - "res\\.(json|send|status)\\([^)]*\\berr\\.message\\b"
  exclude_if:
    - "L'appel utilise un placeholder positionnel (?) ou nommé avec un tableau de paramètres séparé"
    - "err.message est journalisé (logger.error) mais jamais inclus dans la réponse HTTP au client"

message: >
  Interpolation d'une valeur utilisateur dans une requête SQL dont le message
  d'erreur détaillé peut être renvoyé au client — remplacer par une requête
  paramétrée et ne jamais exposer err.message au client (voir
  rules/remediation/error-sqli.md).

false_positive_notes:
  - "Si err.message est uniquement journalisé côté serveur et jamais inclus dans la réponse HTTP, le canal d'exfiltration par erreur est fermé — reclasser en `medium` pour la seule interpolation SQL."
  - "Un template literal sans variable interpolée provenant d'une entrée externe n'est pas exploitable."

remediation_ref: rules/remediation/error-sqli.md
knowledge_ref: knowledge/injections/error-sqli.md
