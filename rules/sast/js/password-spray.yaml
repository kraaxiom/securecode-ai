id: password-spray
language: js
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un compteur d'échecs de connexion agrégé uniquement par email,
    sans agrégation complémentaire par IP tous comptes confondus.
  patterns:
    - "getFailedAttempts(email) utilisé seul dans le handler de login sans appel à getFailedAttemptsByIp(ip)"

message: >
  Limitation de tentatives d'authentification appliquée uniquement par
  compte — un password spray distribué sur de nombreux comptes n'est pas
  détecté (voir rules/remediation/password-spray.md).

false_positive_notes:
  - "Règle à confiance basse : l'agrégation par IP peut être gérée en amont par une passerelle API ou un WAF."
  - "Confirmer manuellement avant d'escalader la sévérité."

remediation_ref: rules/remediation/password-spray.md
knowledge_ref: knowledge/auth/password-spray.md
