id: dangling-markup
language: js
category: modern
cwe: CWE-79
owasp: A03:2021-Injection
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une insertion de données utilisateur dans le DOM/HTML via
    innerHTML, dangerouslySetInnerHTML ou un template EJS non échappé (<%- %>),
    sans encodage préalable.
  patterns:
    - "element.innerHTML = string_concat(_, userInput, _)"
    - "dangerouslySetInnerHTML={{ __html: userInput }} without a sanitizer call (DOMPurify.sanitize)"
    - "EJS template using <%- userInput %> instead of <%= userInput %>"
  exclude_if:
    - "la valeur passe par DOMPurify.sanitize(...) ou équivalent avant insertion"
    - "le template utilise <%= %> (échappement automatique EJS) au lieu de <%- %>"

message: >
  Donnée utilisateur insérée dans le HTML sans encodage — risque d'injection
  de balise non fermée (dangling markup) exploitable pour exfiltrer des
  données même sous CSP restrictive (voir
  rules/remediation/dangling-markup.md).

false_positive_notes:
  - "Si un sanitizer (DOMPurify) est appliqué juste avant l'assignation, ne pas remonter en `medium` — reclasser en `info`."
  - "Contenu strictement statique/constant (pas d'entrée utilisateur) : non applicable."

remediation_ref: rules/remediation/dangling-markup.md
knowledge_ref: knowledge/modern/dangling-markup.md
