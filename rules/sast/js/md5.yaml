id: md5
language: js
category: crypto
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'usage de MD5 (crypto.createHash('md5') ou CryptoJS.MD5) pour
    hacher un mot de passe, un token ou toute valeur nécessitant une garantie
    cryptographique.
  patterns:
    - "crypto.createHash(\"md5\")"
    - "CryptoJS.MD5(_)"
  exclude_if:
    - "le résultat est utilisé uniquement comme clé de cache non adversariale sans lien avec l'authentification"
    - "le résultat sert de simple checksum d'intégrité non opposable à un attaquant (détection de doublon de fichier interne)"

message: >
  MD5 est cryptographiquement cassé — pour un mot de passe utiliser
  bcrypt/argon2 (ex: bcryptjs, argon2), pour un token utiliser
  crypto.randomBytes() (voir rules/remediation/md5.md).

false_positive_notes:
  - "Un usage MD5 pour un ETag HTTP ou une clé de cache non sensible n'est pas un risque de sécurité — reclasser en `info`."
  - "Confirmer que la donnée hachée est bien sensible (mot de passe, secret, token) avant de remonter en `medium`/`high`."

remediation_ref: rules/remediation/md5.md
knowledge_ref: knowledge/crypto/md5.md
