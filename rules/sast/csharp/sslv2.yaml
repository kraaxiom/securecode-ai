id: sslv2
language: csharp
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'activation explicite de SslProtocols.Ssl2 dans une configuration
    SslStream, HttpClientHandler ou ServicePointManager.SecurityProtocol.
  patterns:
    - "SslProtocols.Ssl2"
    - "ServicePointManager.SecurityProtocol = SecurityProtocolType.Ssl2"
  exclude_if:
    - "aucune (SSLv2 ne doit jamais être activé, même conditionnellement)"

message: >
  SSLv2 est interdit par la RFC 6176 et vulnérable à l'attaque DROWN — retirer
  toute référence à SslProtocols.Ssl2 et laisser .NET négocier TLS 1.2/1.3.

false_positive_notes:
  - "Aucun cas légitime connu : toute présence de ce flag doit être remontée en `critical`."

remediation_ref: rules/remediation/sslv2.md
knowledge_ref: knowledge/crypto/sslv2.md
