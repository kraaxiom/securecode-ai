id: ssrf-classique
language: csharp
category: ssrf
cwe: CWE-918
owasp: A10:2021-Server-Side Request Forgery (SSRF)
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte, dans du code C#/.NET, des patterns caractéristiques de SSRF classique
    lorsqu'une entrée non fiable (utilisateur, requête HTTP, paramètre externe)
    atteint une opération sensible sans validation ni contrôle préalable.
  patterns:
    - "httpClient.GetAsync($userInput)"
    - "new HttpClient().GetAsync($userUrl)"
    - "WebRequest.Create($userInput)"
    - "httpClient.PostAsync($userUrl, _)"
  exclude_if:
    - "$userUrl est comparé à une liste blanche stricte de domaines/IP avant l'appel réseau"
    - "l'URL est une constante applicative interne, non influencée par une entrée utilisateur"

message: >
  Pattern potentiellement vulnérable à SSRF classique détecté — une entrée non validée
  semble atteindre une opération sensible. Vérifier la provenance de la donnée
  et appliquer une validation/liste blanche avant utilisation
  (voir rules/remediation/ssrf-classique.md). Recommandation : valider l'URL/l'hôte cible contre une liste blanche stricte et bloquer les plages d'adresses internes/privées avant l'appel réseau.

false_positive_notes:
  - "Si la valeur incriminée provient exclusivement d'une constante interne ou d'une configuration serveur, ce n'est pas exploitable — reclasser en `info`."
  - "Si une validation stricte (liste blanche, normalisation de chemin, vérification de signature/ownership) est appliquée immédiatement avant l'opération sensible, vérifier manuellement avant de remonter en `high`."

remediation_ref: rules/remediation/ssrf-classique.md
knowledge_ref: knowledge/ssrf/ssrf-classique.md
