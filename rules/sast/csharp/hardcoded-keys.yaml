id: hardcoded-keys
language: csharp
category: crypto
cwe: CWE-798
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une clé, un secret HMAC ou une clé privée assignés littéralement
    à une variable/constante (Key, IV, SecretKey, ApiSecret) puis passés à une
    API cryptographique (Aes.Key, HMACSHA256, RSA.ImportPem) ou de configuration.
  patterns:
    - "aes.Key = Convert.FromBase64String(\"_littéral_\")"
    - "new HMACSHA256(Encoding.UTF8.GetBytes(\"_littéral_\"))"
    - "const string ApiSecret = \"_littéral_\""
    - "rsa.ImportFromPem(\"-----BEGIN PRIVATE KEY-----...\")"
  exclude_if:
    - "la valeur provient d'IConfiguration, d'un Key Vault, ou d'une variable d'environnement (Environment.GetEnvironmentVariable)"
    - "la valeur est manifestement un exemple factice (\"changeme\", \"your-secret-here\") dans un fichier de documentation"

message: >
  Clé cryptographique ou secret codé en dur dans le source — extraire vers un
  gestionnaire de secrets (Azure Key Vault, variable d'environnement) et faire
  tourner la clé compromise.

false_positive_notes:
  - "Si la constante est un identifiant public (ex: clé publique, alias non secret), reclasser en `info`."
  - "Vérifier l'historique Git : même supprimée depuis, la clé doit être considérée compromise et rotée."

remediation_ref: rules/remediation/hardcoded-keys.md
knowledge_ref: knowledge/crypto/hardcoded-keys.md
