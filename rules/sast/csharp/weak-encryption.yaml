id: weak-encryption
language: csharp
category: database
cwe: CWE-326
owasp: A02:2021-Cryptographic-Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte le chiffrement de données sensibles avant stockage en base avec
    un algorithme/mode faible ou une gestion de clé défaillante en .NET
    (DES/RC2, ECB, clé statique en dur), ou l'absence totale de chiffrement
    pour des colonnes de données sensibles (PII, secrets).
  patterns:
    - "DES.Create() / RC2.Create() — algorithme obsolète (DES, RC2) utilisé pour chiffrer une colonne avant écriture en base"
    - "Aes.Create(); aes.Mode = CipherMode.ECB — mode ECB (fuite de motifs) utilisé pour chiffrer des données stockées"
    - "clé de chiffrement en dur dans le code (byte[] key = { 0x01, 0x02, ... }) utilisée pour chiffrer une colonne sensible, au lieu d'être chargée depuis Azure Key Vault/un gestionnaire de secrets"
    - "colonne base de données stockant SSN/carte bancaire/mot de passe en clair (propriété string sans passage par un service de chiffrement avant SaveChanges())"
  exclude_if:
    - "le chiffrement utilise un algorithme moderne (AES-GCM, ChaCha20-Poly1305) avec IV/nonce unique par opération et clé chargée depuis Azure Key Vault/un KMS, jamais en dur dans le code"

message: >
  Chiffrement de données sensibles avant stockage utilisant un algorithme
  obsolète, un mode non authentifié (ECB), ou une clé en dur — ou absence
  totale de chiffrement pour des données sensibles. Utiliser AES-GCM (ou
  équivalent authentifié) avec IV/nonce unique et une clé gérée par Azure Key
  Vault/un KMS externe au code — voir rules/remediation/weak-encryption.md.

false_positive_notes:
  - "Les mots de passe utilisateurs doivent être hachés (ASP.NET Identity PasswordHasher, argon2id), pas chiffrés — vérifier qu'il s'agit bien de données nécessitant un chiffrement réversible avant de signaler."
  - "Une clé chargée depuis IConfiguration/variable d'environnement (pas en dur) mais avec un algorithme encore faible reste `high` — les deux critères sont évalués indépendamment."

remediation_ref: rules/remediation/weak-encryption.md
knowledge_ref: knowledge/database/weak-encryption.md
