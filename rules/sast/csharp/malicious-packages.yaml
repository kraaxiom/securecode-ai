id: malicious-packages
language: csharp
category: supply-chain
cwe: CWE-1357
owasp: A08:2021-Software-and-Data-Integrity-Failures
severity: critical
confidence_default: medium

match:
  type: dependency-scan
  description: >
    Détecte dans *.csproj / packages.config des références à des paquets
    NuGet identifiés comme malveillants (retirés/quarantainés) ou des
    comportements caractéristiques (scripts MSBuild/PowerShell exécutant du
    code réseau) dans un paquet vendorisé.
  patterns:
    - "*.csproj / packages.config: nom de paquet figurant dans une liste connue de paquets NuGet malveillants retirés (NuGet Malware Removals)"
    - "paquet vendorisé: fichier build/*.targets ou tools/init.ps1 exécutant Invoke-WebRequest, System.Net.WebClient ou Start-Process pendant l'installation/le build"
    - "*.csproj: <PackageReference> pointant vers une source NuGet non officielle (feed HTTP non chiffré ou domaine non reconnu) pour un paquet ayant normalement un équivalent officiel sur nuget.org"
  exclude_if:
    - "le paquet vendorisé exécute uniquement des vérifications de compatibilité (version .NET, plateforme cible) sans appel réseau ni exécution de commande arbitraire"

message: >
  Dépendance NuGet correspondant à un paquet malveillant connu ou présentant
  un comportement d'installation/build suspect (exécution de code/réseau via
  un script PowerShell ou une cible MSBuild). Retirer immédiatement la
  dépendance, auditer les environnements où elle a été restaurée, et faire
  tourner tout secret potentiellement exposé — voir
  rules/remediation/malicious-packages.md.

false_positive_notes:
  - "Un faux positif fréquent est un paquet interne légitime au nom proche d'un paquet malveillant connu — vérifier la source (feed privé vs nuget.org public)."
  - "Les scripts init.ps1/*.targets légitimes de configuration de build ne sont pas malveillants en soi — évaluer la présence d'exfiltration réseau, pas la simple présence d'un script."

remediation_ref: rules/remediation/malicious-packages.md
knowledge_ref: knowledge/supply-chain/malicious-packages.md
