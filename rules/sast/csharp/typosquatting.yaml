id: typosquatting
language: csharp
category: supply-chain
cwe: CWE-1357
owasp: A08:2021-Software-and-Data-Integrity-Failures
severity: high
confidence_default: medium

match:
  type: config-pattern
  description: >
    Détecte dans *.csproj / packages.config des noms de paquets NuGet très
    proches (distance de Levenshtein faible, permutation de caractères, casse
    différente) de paquets NuGet populaires largement utilisés.
  patterns:
    - "*.csproj: <PackageReference Include=\"...\"> à distance d'édition 1-2 d'un paquet NuGet très populaire (ex: 'Newtonsoft.Json2', 'NewtonSoft.Json', 'Microsoft.EntityFrameworkCor' au lieu de 'Microsoft.EntityFrameworkCore')"
    - "packages.config: id de paquet avec point/tiret substitué par rapport au nom officiel (ex: 'System-Text-Json' au lieu de 'System.Text.Json')"
    - "using dans le code source: espace de noms importé ne correspondant à aucun PackageReference déclaré (assembly potentiellement introduit manuellement/typosquatté hors suivi)"
  exclude_if:
    - "le paquet au nom proche est documenté comme fork légitime maintenu et publié par une organisation identifiable (page nuget.org vérifiée)"

message: >
  Nom de paquet NuGet très proche d'un paquet légitime largement utilisé —
  risque de typosquatting (paquet malveillant installé par erreur de frappe
  ou copier-coller). Vérifier l'identité du mainteneur sur nuget.org avant
  installation et corriger le nom si erreur — voir
  rules/remediation/typosquatting.md.

false_positive_notes:
  - "Certains noms proches sont des paquets légitimes distincts de longue date (ex: variantes officielles Microsoft.* vs System.*) — vérifier l'historique de publication nuget.org avant de conclure."
  - "Les paquets internes de l'organisation au nom proche d'un paquet public ne sont pas du typosquatting si publiés uniquement sur un feed privé."

remediation_ref: rules/remediation/typosquatting.md
knowledge_ref: knowledge/supply-chain/typosquatting.md
