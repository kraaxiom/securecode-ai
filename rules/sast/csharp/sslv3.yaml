id: sslv3
language: csharp
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'activation explicite de SslProtocols.Ssl3 dans une configuration
    SslStream, HttpClientHandler ou ServicePointManager.SecurityProtocol.
  patterns:
    - "SslProtocols.Ssl3"
    - "ServicePointManager.SecurityProtocol = SecurityProtocolType.Ssl3"
  exclude_if:
    - "aucune (SSLv3 ne doit jamais être activé, même conditionnellement)"

message: >
  SSLv3 est interdit par la RFC 7568 et vulnérable à l'attaque POODLE — retirer
  toute référence à SslProtocols.Ssl3 et laisser .NET négocier TLS 1.2/1.3.

false_positive_notes:
  - "Aucun cas légitime connu : toute présence de ce flag doit être remontée en `critical`."

remediation_ref: rules/remediation/sslv3.md
knowledge_ref: knowledge/crypto/sslv3.md
