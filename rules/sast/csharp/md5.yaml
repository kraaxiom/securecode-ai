id: md5
language: csharp
category: crypto
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'usage de MD5 (MD5.Create(), MD5CryptoServiceProvider) pour
    hacher un mot de passe ou produire une preuve d'intégrité opposable.
  patterns:
    - "MD5.Create(...)"
    - "new MD5CryptoServiceProvider(...)"
    - "MD5.HashData(_)"
  exclude_if:
    - "usage exclusif comme clé de cache non adversariale (ex: ETag interne, clé de dictionnaire) sans enjeu de sécurité"

message: >
  MD5 est une fonction de hachage cassée (collisions triviales) — pour un mot
  de passe utiliser Argon2id/BCrypt, pour une intégrité opposable utiliser SHA-256.

false_positive_notes:
  - "Si MD5 sert uniquement de somme de contrôle non adversariale (détection de corruption accidentelle), reclasser en `low`."
  - "Vérifier si le résultat sert à un hachage de mot de passe : dans ce cas maintenir `high`, pas `medium`."

remediation_ref: rules/remediation/md5.md
knowledge_ref: knowledge/crypto/md5.md
