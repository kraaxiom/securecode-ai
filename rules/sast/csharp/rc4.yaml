id: rc4
language: csharp
category: crypto
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'usage de RC4 via une suite de chiffrement TLS explicitement
    activée (SslStream avec CipherAlgorithmType.Rc4) ou une implémentation
    RC4 tierce/maison pour chiffrer un flux ou un fichier.
  patterns:
    - "CipherAlgorithmType.Rc4"
    - "new RC4(...)"
    - "RC4CryptoServiceProvider"
  exclude_if:
    - "usage exclusif dans un test de compatibilité avec un protocole legacy externe, documenté comme tel"

message: >
  RC4 présente des biais statistiques exploitables et est interdit dans TLS
  depuis la RFC 7465 — migrer vers AES-GCM ou ChaCha20-Poly1305.

false_positive_notes:
  - "Si la suite RC4 est présente dans une liste de compatibilité mais jamais négociée en pratique côté serveur, vérifier la configuration effective avant de conclure."

remediation_ref: rules/remediation/rc4.md
knowledge_ref: knowledge/crypto/rc4.md
