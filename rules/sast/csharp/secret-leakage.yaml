id: secret-leakage
language: csharp
category: llm
cwe: CWE-200
owasp: LLM02:2025-Sensitive-Information-Disclosure
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'inclusion de secrets applicatifs (clés API, identifiants,
    tokens internes, chaînes de connexion) dans le prompt système ou le
    contexte envoyé au LLM (Azure OpenAI SDK, Semantic Kernel), avec risque
    de restitution du secret dans une réponse générée si le modèle est
    manipulé (prompt injection).
  patterns:
    - "chatHistory.AddSystemMessage($\"...clé API: {Environment.GetEnvironmentVariable(\"API_KEY\")}...\") — secret injecté directement dans le prompt système"
    - "var systemPrompt = $\"Voici la config: DB_PASSWORD={configuration[\"DB_PASSWORD\"]}\" transmis au LLM comme contexte"
    - "contexte de plugin (résultat de fonction) contenant une chaîne de connexion ou un token brut renvoyé sans redaction avant d'être ré-injecté dans le prompt"
  exclude_if:
    - "le secret est nécessaire à l'exécution d'un plugin interne mais n'est jamais inséré dans le texte du prompt (utilisé uniquement côté serveur, hors du contexte LLM)"

message: >
  Secret applicatif (clé API, mot de passe, token) injecté dans le prompt ou
  le contexte envoyé au LLM — un attaquant capable de manipuler le modèle
  (prompt injection) peut le faire restituer le secret dans sa réponse.
  Ne jamais inclure de secret dans un prompt ; utiliser des références
  indirectes/vault et exécuter les opérations nécessitant le secret côté
  serveur hors du contexte LLM — voir rules/remediation/secret-leakage.md.

false_positive_notes:
  - "Un identifiant non sensible (ex: ID de ressource publique) confondu avec un secret n'est pas concerné — vérifier la nature réelle de la valeur."
  - "Si le prompt est strictement interne et jamais retourné à un client externe (aucune fuite possible), la sévérité peut être réduite à `medium`, mais le risque de prompt injection en amont reste à évaluer."

remediation_ref: rules/remediation/secret-leakage.md
knowledge_ref: knowledge/llm/secret-leakage.md
