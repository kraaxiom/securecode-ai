id: missing-audit
language: csharp
category: database
cwe: CWE-778
owasp: A09:2021-Security-Logging-and-Monitoring-Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte des opérations .NET sensibles sur la base de données
    (suppression, modification de données financières/PII, changement de
    privilèges) effectuées via Entity Framework/ADO.NET sans journalisation
    d'audit associée (qui, quoi, quand).
  patterns:
    - "context.Users.Remove(user); context.SaveChanges() sur une entité sensible (utilisateur, transaction, permission) sans appel à ILogger d'audit ni enregistrement dans une table d'historique"
    - "user.IsAdmin = true; context.SaveChanges() (élévation de privilèges) sans trace d'audit (qui a effectué le changement, quand, depuis quelle requête)"
    - "new SqlCommand(\"UPDATE Accounts SET Balance=@b ...\", conn).ExecuteNonQuery() sur une table financière sans insertion correspondante dans une table de journal d'audit (AuditLog/TransactionHistory)"
  exclude_if:
    - "l'opération sensible est systématiquement accompagnée d'un enregistrement d'audit (table dédiée, interceptor EF Core SaveChanges, ou trigger SQL d'audit) capturant l'acteur et l'horodatage"

message: >
  Opération sensible sur la base de données (suppression, changement de
  privilèges, modification financière) sans journalisation d'audit associée
  — en cas d'incident, impossible de reconstituer qui a fait quoi. Journaliser
  systématiquement les opérations sensibles (acteur, horodatage, valeur
  avant/après) dans une table d'audit immuable ou via un interceptor EF Core
  centralisé — voir rules/remediation/missing-audit.md.

false_positive_notes:
  - "Si la journalisation est centralisée via un SaveChangesInterceptor EF Core connecté globalement plutôt qu'à chaque appel, vérifier la couverture réelle avant de signaler chaque occurrence individuellement."
  - "Les opérations sur des données non sensibles (préférences UI, cache) ne nécessitent pas d'audit."

remediation_ref: rules/remediation/missing-audit.md
knowledge_ref: knowledge/database/missing-audit.md
