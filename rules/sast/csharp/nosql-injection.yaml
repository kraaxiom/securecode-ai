id: nosql-injection
language: csharp
category: injections
cwe: CWE-943
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un usage non sécurisé d'une entrée utilisateur pouvant conduire à injection nosql.
  patterns:
    - "MongoDB: collection.Find(string_concat(_, $var, _)) ou BsonDocument.Parse($var) avec entrée JSON utilisateur brute"
  exclude_if:
    - "la valeur est validée par liste blanche ou échappée via l'API dédiée du framework avant usage"
    - "$var provient d'une constante interne (pas d'entrée utilisateur), non exploitable"

message: >
  Injection NoSQL détectée — valider/échapper strictement toute entrée utilisateur avant usage dans ce contexte (voir rules/remediation/nosql-injection.md).

false_positive_notes:
  - "Si la valeur est validée par une liste blanche stricte ou échappée via l'API dédiée du framework avant usage, ce n'est pas exploitable."
  - "Si $var provient d'une constante interne (pas d'entrée utilisateur), reclasser en `info`."

remediation_ref: rules/remediation/nosql-injection.md
knowledge_ref: knowledge/injections/nosql-injection.md
