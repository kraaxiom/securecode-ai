id: missing-secure
language: csharp
category: sessions
cwe: CWE-614
owasp: A05:2021-Security Misconfiguration
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une CookieOptions ou une configuration de session/authentification
    ASP.NET Core n'activant pas explicitement Secure sur un cookie de session
    ou d'authentification destiné à la production.
  patterns:
    - "new CookieOptions { Secure = false, _ }"
    - "new CookieOptions { _ }" # Secure absent de l'initialisation
    - "services.AddSession(options => { options.Cookie.SecurePolicy = CookieSecurePolicy.None; })"
    - "options.Cookie.SecurePolicy = CookieSecurePolicy.None" # dans AddAuthentication/AddIdentity
  exclude_if:
    - "Secure = true (ou SecurePolicy.Always) est explicitement défini dans le même bloc"
    - "le bloc est visiblement conditionné à l'environnement de développement (ex: if (env.IsDevelopment()))"

message: >
  Cookie créé sans attribut Secure (ou avec Secure = false) — ce cookie de
  session pourrait être transmis en clair sur une connexion HTTP non
  chiffrée (voir rules/remediation/missing-secure.md).

false_positive_notes:
  - "Si la désactivation de Secure est explicitement limitée à un bloc conditionné par IsDevelopment(), ce n'est pas un risque en production — reclasser en `info`."
  - "Vérifier CookiePolicyOptions.Secure au niveau global avant de remonter le signal."

remediation_ref: rules/remediation/missing-secure.md
knowledge_ref: knowledge/sessions/missing-secure.md
