id: expression-language-injection
language: csharp
category: injections
cwe: CWE-917
owasp: A03:2021-Injection
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un usage non sécurisé d'une entrée utilisateur pouvant conduire à injection dans un langage d'expression (el).
  patterns:
    - "Construction dynamique non sécurisée impliquant expression-language-injection avec une variable utilisateur $var non validée/échappée."
  exclude_if:
    - "la valeur est validée par liste blanche ou échappée via l'API dédiée du framework avant usage"
    - "$var provient d'une constante interne (pas d'entrée utilisateur), non exploitable"

message: >
  Injection dans un langage d'expression (EL) détectée — valider/échapper strictement toute entrée utilisateur avant usage dans ce contexte (voir rules/remediation/expression-language-injection.md).

false_positive_notes:
  - "Si la valeur est validée par une liste blanche stricte ou échappée via l'API dédiée du framework avant usage, ce n'est pas exploitable."
  - "Si $var provient d'une constante interne (pas d'entrée utilisateur), reclasser en `info`."

remediation_ref: rules/remediation/expression-language-injection.md
knowledge_ref: knowledge/injections/expression-language-injection.md
