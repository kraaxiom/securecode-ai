id: weak-jwt-secret
language: csharp
category: crypto
cwe: CWE-1391
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un secret JWT court ou littéral passé à SymmetricSecurityKey pour
    la signature HS256 via System.IdentityModel.Tokens.Jwt.
  patterns:
    - "new SymmetricSecurityKey(Encoding.UTF8.GetBytes(\"_littéral_court_\"))"
    - "TokenValidationParameters { IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(\"secret\")) }"
    - "SecurityAlgorithms.HmacSha256 combiné à une clé littérale de moins de 32 caractères"
  exclude_if:
    - "la clé est chargée depuis IConfiguration/Key Vault avec une longueur générée aléatoirement (non vérifiable statiquement, à valider manuellement)"

message: >
  Secret JWT HS256 court ou codé en dur — un attaquant peut le retrouver par
  force brute hors ligne et forger des tokens valides ; utiliser un secret
  aléatoire d'au moins 256 bits stocké dans un gestionnaire de secrets.

false_positive_notes:
  - "Si l'algorithme est RS256/ES256 (clé asymétrique), ce pattern ne s'applique pas — vérifier l'algorithme avant de remonter."
  - "Une clé chargée dynamiquement mais dont la valeur par défaut de fallback est faible reste vulnérable — vérifier le chemin de fallback."

remediation_ref: rules/remediation/weak-jwt-secret.md
knowledge_ref: knowledge/crypto/weak-jwt-secret.md
