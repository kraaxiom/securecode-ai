id: alias-abuse
language: csharp
category: graphql
cwe: CWE-770
owasp: A04:2021-Insecure Design
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un serveur GraphQL HotChocolate (`AddGraphQLServer`) exposé sans
    limite sur le nombre d'alias par requête, permettant de multiplier un
    même resolver des centaines de fois dans un seul appel HTTP.
  patterns:
    - "services.AddGraphQLServer().AddQueryType<Query>() sans .AddMaxExecutionDepthRule(...) ni règle de validation limitant le nombre d'alias"
    - "services.AddGraphQLServer() sans .ModifyRequestOptions(o => o.ComplexityAnalyzerOptions...) prenant en compte les alias"
    - "RequestExecutorBuilder personnalisé sans DocumentValidatorRule de comptage d'alias enregistrée"
  exclude_if:
    - "une DocumentValidatorRule personnalisée compte explicitement les alias et rejette au-delà d'un seuil (implémentation de IDocumentValidatorRule)"
    - "l'API est strictement interne, authentifiée, et soumise à un rate-limiting au niveau de la complexité de requête (MaxAllowedComplexity)"

message: >
  Serveur GraphQL HotChocolate sans limite sur le nombre d'alias par requête —
  un attaquant peut multiplier les appels à un resolver sensible (ex:
  bruteforce de mot de passe) en une seule requête HTTP, contournant le
  rate-limiting classique (voir rules/remediation/alias-abuse.md).

false_positive_notes:
  - "Si `ModifyRequestOptions` configure une analyse de coût de requête (ComplexityAnalyzerOptions) prenant en compte la duplication par alias, reclasser en `low`."
  - "Un schéma exposant uniquement des données publiques non sensibles au bruteforce réduit fortement l'impact réel."

remediation_ref: rules/remediation/alias-abuse.md
knowledge_ref: knowledge/graphql/alias-abuse.md
