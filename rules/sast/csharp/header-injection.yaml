id: header-injection
language: csharp
category: injections
cwe: CWE-113
owasp: A03:2021-Injection
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un usage non sécurisé d'une entrée utilisateur pouvant conduire à injection d'en-tête http.
  patterns:
    - "Response.Headers[_] = string_concat(_, $var, _) avec une valeur utilisateur non filtrée"
  exclude_if:
    - "la valeur est validée par liste blanche ou échappée via l'API dédiée du framework avant usage"
    - "$var provient d'une constante interne (pas d'entrée utilisateur), non exploitable"

message: >
  Injection d'en-tête HTTP détectée — valider/échapper strictement toute entrée utilisateur avant usage dans ce contexte (voir rules/remediation/header-injection.md).

false_positive_notes:
  - "Si la valeur est validée par une liste blanche stricte ou échappée via l'API dédiée du framework avant usage, ce n'est pas exploitable."
  - "Si $var provient d'une constante interne (pas d'entrée utilisateur), reclasser en `info`."

remediation_ref: rules/remediation/header-injection.md
knowledge_ref: knowledge/injections/header-injection.md
