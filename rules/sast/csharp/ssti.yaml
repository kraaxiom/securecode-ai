id: ssti
language: csharp
category: injections
cwe: CWE-1336
owasp: A03:2021-Injection
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un usage non sécurisé d'une entrée utilisateur pouvant conduire à injection de template côté serveur (ssti).
  patterns:
    - "RazorEngine.Compile($var) ou Handlebars.Net Compile($var) sur un template fourni par l'utilisateur"
  exclude_if:
    - "la valeur est validée par liste blanche ou échappée via l'API dédiée du framework avant usage"
    - "$var provient d'une constante interne (pas d'entrée utilisateur), non exploitable"

message: >
  Injection de template côté serveur (SSTI) détectée — valider/échapper strictement toute entrée utilisateur avant usage dans ce contexte (voir rules/remediation/ssti.md).

false_positive_notes:
  - "Si la valeur est validée par une liste blanche stricte ou échappée via l'API dédiée du framework avant usage, ce n'est pas exploitable."
  - "Si $var provient d'une constante interne (pas d'entrée utilisateur), reclasser en `info`."

remediation_ref: rules/remediation/ssti.md
knowledge_ref: knowledge/injections/ssti.md
