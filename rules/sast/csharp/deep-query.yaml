id: deep-query
language: csharp
category: graphql
cwe: CWE-674
owasp: A04:2021-Insecure Design
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un schéma GraphQL HotChocolate exposant des types récursifs/
    imbriqués (relations `Friends`, `Children`, `Replies`) sans limite de
    profondeur de requête configurée au niveau du serveur.
  patterns:
    - "services.AddGraphQLServer().AddQueryType<Query>() sans .AddMaxExecutionDepthRule(N)"
    - "services.AddGraphQLServer() sans ModifyRequestOptions configurant une limite de profondeur d'exécution"
    - "type *(class exposant une relation auto-référente via [UseFiltering]/résolveur récursif) sans plafond de profondeur au niveau du RequestExecutorBuilder"
  exclude_if:
    - "`.AddMaxExecutionDepthRule(N)` (avec N raisonnable, ex: <= 10) est explicitement configuré sur le RequestExecutorBuilder"
    - "le schéma ne contient aucun type auto-référent ou relation cyclique exploitable en profondeur"

message: >
  Schéma GraphQL HotChocolate sans limite de profondeur de requête — une
  requête imbriquée récursivement (ex: `user { friends { friends { ... } } }`)
  peut provoquer un déni de service par consommation exponentielle de
  ressources (voir rules/remediation/deep-query.md).

false_positive_notes:
  - "Si le schéma ne contient aucune relation auto-référente, le risque de profondeur exponentielle est nul même sans limite explicite."
  - "Un timeout global d'exécution de requête (ex: au niveau de Kestrel ou d'un middleware ASP.NET Core) atténue partiellement le risque sans le supprimer — signaler quand même."

remediation_ref: rules/remediation/deep-query.md
knowledge_ref: knowledge/graphql/deep-query.md
