id: jwt-algorithm-confusion
language: csharp
category: auth
cwe: CWE-347
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte, dans du code C#/.NET, des patterns caractéristiques de confusion d'algorithme JWT
    lorsqu'une entrée non fiable (utilisateur, requête HTTP, paramètre externe)
    atteint une opération sensible sans validation ni contrôle préalable.
  patterns:
    - "[AllowAnonymous]  // sur un endpoint sensible sans re-verification"
    - "JwtSecurityTokenHandler.ValidateToken(_, new TokenValidationParameters { ValidateIssuerSigningKey = false })"
    - "services.AddAuthentication().AddJwtBearer(o => o.TokenValidationParameters.RequireSignedTokens = false)"
    - "symmetricKey = Encoding.UTF8.GetBytes("secret")  // secret JWT hardcode/faible"
  exclude_if:
    - "le secret/la clé provient d'un gestionnaire de secrets (Key Vault, Vault, KMS) avec rotation, pas d'une valeur hardcodée"
    - "la vérification de signature est explicitement forcée en amont (algorithme et clé imposés côté serveur)"

message: >
  Pattern potentiellement vulnérable à confusion d'algorithme JWT détecté — une entrée non validée
  semble atteindre une opération sensible. Vérifier la provenance de la donnée
  et appliquer une validation/liste blanche avant utilisation
  (voir rules/remediation/jwt-algorithm-confusion.md). Recommandation : utiliser une vérification de signature stricte avec un algorithme et une clé forte imposés côté serveur, jamais dérivés de l'entrée.

false_positive_notes:
  - "Si la valeur incriminée provient exclusivement d'une constante interne ou d'une configuration serveur, ce n'est pas exploitable — reclasser en `info`."
  - "Si une validation stricte (liste blanche, normalisation de chemin, vérification de signature/ownership) est appliquée immédiatement avant l'opération sensible, vérifier manuellement avant de remonter en `critical`."

remediation_ref: rules/remediation/jwt-algorithm-confusion.md
knowledge_ref: knowledge/auth/jwt-algorithm-confusion.md
