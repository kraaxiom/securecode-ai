id: des
language: csharp
category: crypto
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'instanciation ou l'usage de DES/3DES via System.Security.Cryptography
    (DESCryptoServiceProvider, TripleDESCryptoServiceProvider, DES.Create(),
    TripleDES.Create()) pour chiffrer des données.
  patterns:
    - "new DESCryptoServiceProvider(...)"
    - "DES.Create(...)"
    - "new TripleDESCryptoServiceProvider(...)"
    - "TripleDES.Create(...)"
  exclude_if:
    - "usage exclusif dans un test unitaire de compatibilité avec un format legacy externe, documenté comme tel"

message: >
  DES/3DES est un algorithme de chiffrement obsolète (clé effective 56 bits,
  vulnérable à Sweet32) — migrer vers AES-256-GCM via System.Security.Cryptography.Aes.

false_positive_notes:
  - "Si l'appel sert uniquement à déchiffrer des données legacy en lecture seule pour migration, reclasser en `medium` avec plan de migration explicite."
  - "Vérifier qu'aucune donnée sensible nouvelle n'est chiffrée avec cet algorithme avant de conclure."

remediation_ref: rules/remediation/des.md
knowledge_ref: knowledge/crypto/des.md
