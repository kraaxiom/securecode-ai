id: open-redirect
language: csharp
category: frontend
cwe: CWE-601
owasp: A01:2021-Broken Access Control
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un appel à Redirect()/RedirectPermanent() avec une URL provenant
    directement d'une entrée utilisateur (query string, formulaire), sans
    validation contre une liste blanche de destinations autorisées.
  patterns:
    - "return Redirect($userInput)"
    - "return Redirect(Request.Query[\"returnUrl\"])"
    - "return RedirectPermanent($userInput)"
    - "Response.Redirect($userInput)"
  exclude_if:
    - "$userInput est validé via Url.IsLocalUrl($userInput) avant l'appel à Redirect"
    - "$userInput est comparé contre une liste blanche statique de chemins/domaines autorisés"
    - "$userInput est un identifiant interne mappé côté serveur vers une URL fixe (pas l'URL elle-même)"

message: >
  L'URL de redirection provient directement d'une entrée utilisateur sans
  validation (ni Url.IsLocalUrl, ni liste blanche) — un attaquant peut
  construire un lien vers ce domaine de confiance redirigeant ensuite vers un
  site malveillant (voir rules/remediation/open-redirect.md).

false_positive_notes:
  - "Si Url.IsLocalUrl() est appelé sur la valeur avant redirection, le contournement par URL absolue ou protocol-relative est déjà bloqué."
  - "Si la valeur est un identifiant opaque résolu côté serveur (pas une URL brute), il n'y a pas de redirection ouverte."
  - "Vérifier que la vérification n'utilise pas seulement StartsWith(\"/\") — contournable par des URL protocol-relative (//evil.com)."

remediation_ref: rules/remediation/open-redirect.md
knowledge_ref: knowledge/frontend/open-redirect.md
