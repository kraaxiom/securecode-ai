id: time-based-sqli
language: csharp
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte la construction d'une requête SQL par concaténation/formatage d'une variable non liée (injection sql basée sur le temps).
  patterns:
    - "new SqlCommand(string_concat(_, $var, _), _)"
    - "command.CommandText = string_concat(_, $var, _)"
    - "interpolated SQL string (contenant $var) passé à SqlCommand/ExecuteReader/ExecuteNonQuery"
    - "context.Database.ExecuteSqlRaw(string_concat(_, $var, _))"
  exclude_if:
    - "$var est ajouté via SqlParameter/AddWithValue et non concaténé dans CommandText"
    - "$var provient d'une constante interne (enum, config statique), pas d'une entrée utilisateur"

message: >
  Injection SQL basée sur le temps détectée — utiliser SqlParameter / paramètres liés (@param) au lieu de concaténer dans CommandText (voir rules/remediation/time-based-sqli.md).

false_positive_notes:
  - "Si la variable provient exclusivement d'une constante applicative interne, non exploitable — reclasser en `info`."
  - "Vérifier que l'ORM/ODBC ne réalise pas déjà un échappement systématique avant de remonter en `high`/`critical`."

remediation_ref: rules/remediation/time-based-sqli.md
knowledge_ref: knowledge/injections/time-based-sqli.md
