id: missing-audit
language: go
category: database
cwe: CWE-778
owasp: A09:2021-Security-Logging-and-Monitoring-Failures
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte des opérations Go sensibles sur la base de données (suppression,
    modification de données financières/PII, changement de privilèges)
    effectuées via database/sql ou gorm sans journalisation d'audit associée
    (qui, quoi, quand).
  patterns:
    - "db.Delete(&user) (gorm) / db.Exec(\"DELETE FROM users WHERE id=?\", id) sur une entité sensible (utilisateur, transaction, permission) sans appel à un logger d'audit ni enregistrement dans une table d'historique"
    - "user.IsAdmin = true; db.Save(&user) (élévation de privilèges) sans trace d'audit (qui a effectué le changement, quand, depuis quelle requête)"
    - "db.Exec(\"UPDATE accounts SET balance=? ...\", balance) sur une table financière sans insertion correspondante dans une table de journal d'audit (audit_log/transaction_history)"
  exclude_if:
    - "l'opération sensible est systématiquement accompagnée d'un enregistrement d'audit (table dédiée, hook gorm BeforeUpdate/AfterDelete connecté à un logger, ou trigger SQL d'audit) capturant l'acteur et l'horodatage"

message: >
  Opération sensible sur la base de données (suppression, changement de
  privilèges, modification financière) sans journalisation d'audit associée
  — en cas d'incident, impossible de reconstituer qui a fait quoi. Journaliser
  systématiquement les opérations sensibles (acteur, horodatage, valeur
  avant/après) dans une table d'audit immuable ou via un hook gorm centralisé
  — voir rules/remediation/missing-audit.md.

false_positive_notes:
  - "Si la journalisation est centralisée via des hooks gorm (BeforeUpdate/AfterDelete) connectés globalement plutôt qu'à chaque appel, vérifier la couverture réelle avant de signaler chaque occurrence individuellement."
  - "Les opérations sur des données non sensibles (préférences UI, cache) ne nécessitent pas d'audit."

remediation_ref: rules/remediation/missing-audit.md
knowledge_ref: knowledge/database/missing-audit.md
