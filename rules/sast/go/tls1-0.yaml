id: tls1-0
language: go
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une configuration tls.Config dont MinVersion est fixé à
    tls.VersionTLS10 ou tls.VersionTLS11, autorisant la négociation de
    protocoles dépréciés.
  patterns:
    - "MinVersion: tls.VersionTLS10"
    - "MinVersion: tls.VersionTLS11"
  exclude_if:
    - "présence conjointe et documentée avec un flag legacy explicitement requis par un partenaire tiers, avec ticket de dépréciation planifié"

message: >
  TLS 1.0/1.1 sont dépréciés par la RFC 8996 et exclus des référentiels PCI-DSS
  depuis 2018 — fixer MinVersion à tls.VersionTLS12 au minimum.

false_positive_notes:
  - "Si MinVersion est écrasé plus loin par une valeur supérieure via une autre affectation, vérifier l'ordre d'exécution avant de conclure."
  - "Compatibilité avec un partenaire legacy documentée ne change pas la sévérité, seulement la priorité de remédiation."

remediation_ref: rules/remediation/tls1-0.md
knowledge_ref: knowledge/crypto/tls1-0.md
