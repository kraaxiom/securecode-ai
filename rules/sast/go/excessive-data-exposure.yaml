id: excessive-data-exposure
language: go
category: api
cwe: CWE-213
owasp: API3:2023-Broken Object Property Level Authorization
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un handler Go qui sérialise directement une struct de base de
    données complète en réponse JSON au lieu de projeter vers une struct de
    sortie (DTO) restreinte, exposant potentiellement des champs internes
    ou sensibles.
  patterns:
    - "json.NewEncoder(w).Encode($dbModel)"
    - "c.JSON(http.StatusOK, $dbModel)"
    - "return db.Find(&$dbModels)"
  exclude_if:
    - "la struct est projetée vers un DTO de sortie avant sérialisation (ex: struct dédiée sans champs sensibles, ou mapping explicite champ par champ)"
    - "les champs sensibles portent un tag json:\"-\" les excluant systématiquement de la sérialisation"

message: >
  Sérialisation directe d'une struct de base de données en réponse API sans
  DTO de sortie — risque d'exposition de champs internes ou sensibles
  (voir rules/remediation/excessive-data-exposure.md).

false_positive_notes:
  - "Si la struct ne contient que des champs déjà publics, le risque réel est faible — reclasser en `low`."
  - "Vérifier les relations chargées (preload GORM) qui pourraient exposer des données liées non voulues."

remediation_ref: rules/remediation/excessive-data-exposure.md
knowledge_ref: knowledge/api/excessive-data-exposure.md
