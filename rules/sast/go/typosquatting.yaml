id: typosquatting
language: go
category: supply-chain
cwe: CWE-1357
owasp: A08:2021-Software-and-Data-Integrity-Failures
severity: high
confidence_default: medium

match:
  type: config-pattern
  description: >
    Détecte dans go.mod des chemins de module très proches (distance de
    Levenshtein faible, permutation de caractères, faute de frappe sur le nom
    d'organisation) de modules Go populaires largement utilisés.
  patterns:
    - "go.mod: require d'un chemin de module à distance d'édition 1-2 d'un module Go très populaire (ex: 'github.com/sirupsen/logrus2', 'github.com/gorila/mux' au lieu de 'github.com/gorilla/mux')"
    - "go.mod: chemin de module avec organisation orthographiée différemment du dépôt officiel (ex: 'github.com/pkgerrors/errors' au lieu de 'github.com/pkg/errors')"
    - "import dans le code source: chemin de package importé ne correspondant à aucune entrée require de go.mod (module potentiellement introduit manuellement/typosquatté hors suivi)"
  exclude_if:
    - "le module au chemin proche est documenté comme fork légitime maintenu et publié par une organisation identifiable (README/pkg.go.dev vérifié)"

message: >
  Chemin de module Go très proche d'un module légitime largement utilisé —
  risque de typosquatting (module malveillant installé par erreur de frappe
  ou copier-coller). Vérifier l'identité du mainteneur sur pkg.go.dev avant
  installation et corriger le chemin si erreur — voir
  rules/remediation/typosquatting.md.

false_positive_notes:
  - "Certains chemins proches sont des modules légitimes distincts de longue date — vérifier l'historique de publication pkg.go.dev avant de conclure."
  - "Les modules internes de l'organisation au chemin proche d'un module public ne sont pas du typosquatting si publiés uniquement sur un proxy privé."

remediation_ref: rules/remediation/typosquatting.md
knowledge_ref: knowledge/supply-chain/typosquatting.md
