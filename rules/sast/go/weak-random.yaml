id: weak-random
language: go
category: crypto
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'usage du paquet math/rand pour générer un token, une clé, un
    identifiant de session, un sel ou un code OTP, au lieu de crypto/rand.
  patterns:
    - "import \"math/rand\" utilisé pour générer un token/clé/session/OTP"
    - "rand.Intn(_) affecté à un token ou une clé"
    - "rand.Read(_) provenant de math/rand (et non crypto/rand) pour un secret"
  exclude_if:
    - "l'usage de math/rand sert à une fonctionnalité non sécuritaire (ex: jitter de retry, tirage de jeu sans enjeu financier)"

message: >
  math/rand est un PRNG non cryptographique et prévisible — pour tout token,
  clé, sel ou identifiant de session, utiliser crypto/rand.Read() ou
  crypto/rand.Int().

false_positive_notes:
  - "Si la valeur générée n'a aucun rôle de sécurité (jitter, UI, jeu non compétitif), reclasser en `info`."
  - "Vérifier le sink final de la valeur (token de reset de mot de passe, clé API) avant de conclure sur la sévérité."

remediation_ref: rules/remediation/weak-random.md
knowledge_ref: knowledge/crypto/weak-random.md
