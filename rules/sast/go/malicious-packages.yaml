id: malicious-packages
language: go
category: supply-chain
cwe: CWE-1357
owasp: A08:2021-Software-and-Data-Integrity-Failures
severity: critical
confidence_default: medium

match:
  type: dependency-scan
  description: >
    Détecte dans go.mod / go.sum des références à des modules Go identifiés
    comme malveillants (typosquattés retirés du proxy public) ou des
    comportements caractéristiques (fonction init() exécutant du code réseau
    ou système) dans un module vendorisé.
  patterns:
    - "go.mod: chemin de module figurant dans une liste connue de modules Go malveillants signalés (Go vulnerability/malware reports)"
    - "module vendorisé (vendor/.../*.go): fonction 'func init()' appelant net/http, os/exec ou net.Dial vers une destination codée en dur au chargement du package"
    - "go.mod: require pointant vers une pseudo-version d'un dépôt Git non officiel (replace vers github.com/<fork-inconnu>/...) pour un module ayant normalement un dépôt officiel reconnu"
  exclude_if:
    - "le module vendorisé exécute uniquement des vérifications de compatibilité (version Go, plateforme) dans son init() sans appel réseau ni exécution de commande arbitraire"

message: >
  Dépendance Go correspondant à un module malveillant connu ou présentant un
  comportement suspect au chargement (appel réseau/système dans une fonction
  init() exécutée automatiquement). Retirer immédiatement la dépendance,
  auditer les environnements où elle a été compilée, et faire tourner tout
  secret potentiellement exposé — voir
  rules/remediation/malicious-packages.md.

false_positive_notes:
  - "Un faux positif fréquent est un module interne légitime au chemin proche d'un module malveillant connu — vérifier la source (dépôt privé vs proxy public)."
  - "Les fonctions init() légitimes d'enregistrement de driver/plugin ne sont pas malveillantes en soi — évaluer la présence d'exfiltration réseau, pas la simple présence d'un init()."

remediation_ref: rules/remediation/malicious-packages.md
knowledge_ref: knowledge/supply-chain/malicious-packages.md
