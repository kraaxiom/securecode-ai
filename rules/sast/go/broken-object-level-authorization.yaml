id: broken-object-level-authorization
language: go
category: api
cwe: CWE-639
owasp: API1:2023-Broken Object Level Authorization
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un handler HTTP Go qui récupère une ressource à partir d'un
    identifiant extrait de l'URL (mux.Vars, chi.URLParam) et exécute une
    requête base de données sans filtrer sur l'utilisateur authentifié
    courant.
  patterns:
    - "id := mux.Vars(r)[\"id\"]; db.First(&$model, id)"
    - "id := chi.URLParam(r, \"id\"); db.Where(\"id = ?\", id).First(&$model)"
    - "func $Handler(w http.ResponseWriter, r *http.Request) { $repo.GetByID(id) }"
  exclude_if:
    - "la requête inclut une clause de filtrage sur l'utilisateur courant (ex: db.Where(\"id = ? AND user_id = ?\", id, currentUserID))"
    - "un middleware d'autorisation vérifie explicitement la propriété de la ressource avant d'atteindre le handler"

message: >
  Récupération d'une ressource par identifiant de route sans vérification
  que l'utilisateur authentifié courant en est propriétaire — ajouter un
  filtre sur l'utilisateur courant ou une vérification d'autorisation
  explicite (voir rules/remediation/broken-object-level-authorization.md).

false_positive_notes:
  - "Si le handler est réservé à un rôle admin vérifié en amont par un middleware, reclasser en `info`."
  - "Vérifier que le repository sous-jacent n'applique pas déjà un filtre implicite par utilisateur avant de remonter en `high`."

remediation_ref: rules/remediation/broken-object-level-authorization.md
knowledge_ref: knowledge/api/broken-object-level-authorization.md
