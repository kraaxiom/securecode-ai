id: clickjacking
language: go
category: frontend
cwe: CWE-1021
owasp: A05:2021-Security Misconfiguration
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'absence ou la suppression de l'en-tête anti-framing
    (X-Frame-Options ou CSP frame-ancestors) dans les handlers net/http ou un
    middleware Go.
  patterns:
    - "w.Header().Del(\"X-Frame-Options\")"
    - "w.Header().Set(\"X-Frame-Options\", \"ALLOWALL\")"
    - "http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) { _ })  # sans w.Header().Set(\"X-Frame-Options\", _) ni CSP frame-ancestors"
    - "mux.HandleFunc($route, $handler)  # $handler ne définit ni X-Frame-Options ni frame-ancestors"
  exclude_if:
    - "un middleware global (ex: secure.New(...), nosurf, gorilla/handlers) applique déjà X-Frame-Options ou frame-ancestors sur toutes les routes"
    - "la Content-Security-Policy définie contient une directive frame-ancestors restrictive"
    - "la route sert exclusivement une API JSON non rendue dans un navigateur"

message: >
  Le handler ou middleware Go ne définit pas l'en-tête X-Frame-Options ni de
  directive CSP frame-ancestors sur les réponses HTML — la page peut être
  intégrée dans un iframe tiers et exposée au clickjacking (voir
  rules/remediation/clickjacking.md).

false_positive_notes:
  - "Si un middleware global (ex: unrolled/secure) applique déjà ces en-têtes sur toutes les routes, ce n'est pas un vrai positif isolé."
  - "Les endpoints d'API JSON pure ne sont pas concernés par le clickjacking."
  - "Vérifier si l'intégration en iframe est un besoin métier documenté avant de remonter la sévérité."

remediation_ref: rules/remediation/clickjacking.md
knowledge_ref: knowledge/frontend/clickjacking.md
