id: os-command-injection
language: go
category: injections
cwe: CWE-78
owasp: A03:2021-Injection
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'exécution d'un processus/shell avec des arguments construits par concaténation d'une entrée utilisateur (injection de commande os).
  patterns:
    - "exec.Command(\"sh\", \"-c\", string_concat(_, $var, _))"
    - "exec.Command(\"cmd\", \"/C\", fmt.Sprintf(_, $var))"
  exclude_if:
    - "exec.Command est appelé avec des arguments séparés sans invocation de shell (\"sh -c\"), donc pas d'interprétation shell"
    - "$var est validée par une liste blanche stricte avant utilisation"

message: >
  Injection de commande OS détectée — préférer l'exécution directe du binaire avec arguments séparés (sans shell) et une liste blanche stricte (voir rules/remediation/os-command-injection.md).

false_positive_notes:
  - "Si les arguments sont passés séparément sans invocation d'un interpréteur shell, le risque d'injection de métacaractères shell est fortement réduit — reclasser en `medium`."
  - "Si $var provient d'une constante interne, non exploitable."

remediation_ref: rules/remediation/os-command-injection.md
knowledge_ref: knowledge/injections/os-command-injection.md
