id: hardcoded-keys
language: go
category: crypto
cwe: CWE-798
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une clé, un secret HMAC ou une clé privée assignés littéralement
    à une constante/variable (const key, apiSecret) puis passés à une fonction
    cryptographique (aes.NewCipher, hmac.New, jwt.ParseRSAPrivateKeyFromPEM).
  patterns:
    - "const apiSecret = \"_littéral_\""
    - "aes.NewCipher([]byte(\"_littéral_\"))"
    - "hmac.New(sha256.New, []byte(\"_littéral_\"))"
    - "jwt.ParseRSAPrivateKeyFromPEM([]byte(`-----BEGIN PRIVATE KEY-----...`))"
  exclude_if:
    - "la valeur provient d'os.Getenv, d'un flag de configuration, ou d'un gestionnaire de secrets"
    - "la valeur est manifestement un exemple factice (\"changeme\", \"your-secret-here\") dans un fichier de documentation"

message: >
  Clé cryptographique ou secret codé en dur dans le source — extraire vers une
  variable d'environnement ou un gestionnaire de secrets, puis faire tourner
  la clé compromise.

false_positive_notes:
  - "Si la constante est un identifiant public (ex: clé publique, alias non secret), reclasser en `info`."
  - "Vérifier l'historique Git : même supprimée depuis, la clé doit être considérée compromise et rotée."

remediation_ref: rules/remediation/hardcoded-keys.md
knowledge_ref: knowledge/crypto/hardcoded-keys.md
