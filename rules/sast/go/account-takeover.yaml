id: account-takeover
language: go
category: business-logic
cwe: CWE-640
owasp: A07:2021-Identification-and-Authentication-Failures
severity: critical
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte des flux Go de réinitialisation de mot de passe ou de changement
    d'e-mail sans contrôles anti-abus : token prévisible, absence
    d'expiration, absence de vérification que l'utilisateur courant est bien
    le propriétaire du compte avant la modification.
  patterns:
    - "resetToken := fmt.Sprintf(\"%d\", rand.Int()) ou uuid.New().String() basé sur math/rand utilisé comme token de réinitialisation — générateur non cryptographiquement sûr (au lieu de crypto/rand)"
    - "func ResetPassword(token, newPassword string) error { user, _ := db.GetUserByResetToken(token); user.PasswordHash = Hash(newPassword); return db.Save(user) } — sans vérification d'expiration du token (CreatedAt/ExpiresAt) ni invalidation après usage"
    - "func ChangeEmail(w http.ResponseWriter, r *http.Request) { user := getCurrentUser(r); user.Email = r.FormValue(\"email\"); db.Save(user) } — changement d'e-mail sans revérification du mot de passe courant ni confirmation par lien envoyé à l'ancien e-mail"
  exclude_if:
    - "le token est généré avec crypto/rand (rand.Read suivi d'un encodage hex/base64), possède une expiration courte vérifiée, est invalidé après usage, et le changement d'email/mot de passe déclenche une notification/confirmation vers l'adresse existante"

message: >
  Flux de réinitialisation de mot de passe ou de changement d'e-mail avec
  contrôles anti-abus insuffisants (token prévisible, pas d'expiration, pas
  de reconfirmation) — un attaquant peut détourner un compte sans connaître
  le mot de passe actuel. Utiliser crypto/rand pour les tokens, appliquer une
  expiration courte et un usage unique, et notifier/confirmer tout changement
  sensible sur l'ancien canal — voir rules/remediation/account-takeover.md.

false_positive_notes:
  - "Un token généré via crypto/rand avec un nombre suffisant d'octets (≥ 32) est déjà cryptographiquement sûr — vérifier son usage correct plutôt que le signaler comme faible."
  - "Si l'expiration est appliquée au niveau base de données (TTL) plutôt que dans le code applicatif visible, vérifier l'architecture avant de confirmer l'absence de contrôle."

remediation_ref: rules/remediation/account-takeover.md
knowledge_ref: knowledge/business-logic/account-takeover.md
