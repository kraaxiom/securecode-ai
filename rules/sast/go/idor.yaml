id: idor
language: go
category: authorization
cwe: CWE-639
owasp: A01:2021-Broken Access Control
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte, dans du code Go, des patterns caractéristiques de Insecure Direct Object Reference (IDOR)
    lorsqu'une entrée non fiable (utilisateur, requête HTTP, paramètre externe)
    atteint une opération sensible sans validation ni contrôle préalable.
  patterns:
    - "r.HandleFunc("/admin", handler)  // sans middleware autorisation"
    - "db.First(&user, r.URL.Query().Get("id"))  // pas de verification ownership"
    - "json.NewDecoder(r.Body).Decode(&user)  // bind direct de tous les champs sans whitelist"
  exclude_if:
    - "l'action est protégée par un middleware/attribut d'autorisation vérifié en amont dans le pipeline"
    - "l'identifiant est dérivé du contexte utilisateur authentifié et non d'une entrée contrôlable par le client"

message: >
  Pattern potentiellement vulnérable à Insecure Direct Object Reference (IDOR) détecté — une entrée non validée
  semble atteindre une opération sensible. Vérifier la provenance de la donnée
  et appliquer une validation/liste blanche avant utilisation
  (voir rules/remediation/idor.md). Recommandation : vérifier explicitement l'appartenance (ownership) et les droits de l'utilisateur authentifié avant tout accès à la ressource.

false_positive_notes:
  - "Si la valeur incriminée provient exclusivement d'une constante interne ou d'une configuration serveur, ce n'est pas exploitable — reclasser en `info`."
  - "Si une validation stricte (liste blanche, normalisation de chemin, vérification de signature/ownership) est appliquée immédiatement avant l'opération sensible, vérifier manuellement avant de remonter en `high`."

remediation_ref: rules/remediation/idor.md
knowledge_ref: knowledge/authorization/idor.md
