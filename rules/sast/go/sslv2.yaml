id: sslv2
language: go
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une configuration tls.Config autorisant SSLv2. Go n'implémente
    plus nativement SSLv2 ; ce pattern couvre les bindings cgo/openssl ou les
    dépendances tierces exposant explicitement ce protocole.
  patterns:
    - "openssl.SSLv2_method()"
    - "MinVersion: tls.VersionSSL20 (constante non standard réintroduite par binding tiers)"
  exclude_if:
    - "aucune (SSLv2 ne doit jamais être activé, même conditionnellement)"

message: >
  SSLv2 est interdit par la RFC 6176 et vulnérable à l'attaque DROWN — retirer
  toute configuration autorisant ce protocole et forcer tls.VersionTLS12 minimum.

false_positive_notes:
  - "Aucun cas légitime connu : toute présence de ce flag doit être remontée en `critical`."

remediation_ref: rules/remediation/sslv2.md
knowledge_ref: knowledge/crypto/sslv2.md
