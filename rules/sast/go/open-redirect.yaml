id: open-redirect
language: go
category: frontend
cwe: CWE-601
owasp: A01:2021-Broken Access Control
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un appel à http.Redirect avec une URL provenant directement d'une
    entrée utilisateur (query string, formulaire), sans validation contre une
    liste blanche de destinations autorisées.
  patterns:
    - "http.Redirect(w, r, $userInput, http.StatusFound)"
    - "http.Redirect(w, r, r.URL.Query().Get(\"redirect\"), _)"
    - "http.Redirect(w, r, r.FormValue(\"next\"), _)"
  exclude_if:
    - "$userInput est validé par une fonction locale vérifiant strings.HasPrefix($userInput, \"/\") ET l'absence de '//' en tête (protection protocol-relative)"
    - "$userInput est comparé contre une liste blanche statique de chemins/domaines autorisés"
    - "$userInput est un identifiant interne mappé côté serveur vers une URL fixe (pas l'URL elle-même)"

message: >
  L'URL de redirection provient directement d'une entrée utilisateur sans
  validation stricte — un attaquant peut construire un lien vers ce domaine de
  confiance redirigeant ensuite vers un site malveillant (voir
  rules/remediation/open-redirect.md).

false_positive_notes:
  - "Si une validation complète (chemin relatif strict, rejet des URL protocol-relative //) est appliquée avant l'appel, ce n'est pas un vrai positif."
  - "Si la valeur est un identifiant opaque résolu côté serveur (pas une URL brute), il n'y a pas de redirection ouverte."
  - "Une simple vérification strings.HasPrefix(url, \"/\") sans exclure \"//\" reste contournable — signaler malgré tout."

remediation_ref: rules/remediation/open-redirect.md
knowledge_ref: knowledge/frontend/open-redirect.md
