id: malicious-packages
language: python
category: supply-chain
cwe: CWE-1357
owasp: A08:2021-Software-and-Data-Integrity-Failures
severity: critical
confidence_default: medium

match:
  type: dependency-scan
  description: >
    Détecte dans requirements.txt / pyproject.toml des références à des
    paquets PyPI identifiés comme malveillants (retirés/quarantainés) ou des
    comportements caractéristiques (code d'installation exécutant des
    commandes réseau) dans un setup.py vendorisé.
  patterns:
    - "requirements.txt / poetry.lock: nom de paquet figurant dans une liste connue de paquets PyPI malveillants retirés (PyPI Malware Removals)"
    - "setup.py local d'une dépendance vendorisée: bloc 'class install(install_command)' ou 'cmdclass' exécutant urllib.request/requests/os.system/subprocess pendant l'installation"
    - "requirements.txt: URL directe vers un dépôt Git non officiel (git+https://...) pour un paquet ayant normalement un équivalent officiel sur PyPI"
  exclude_if:
    - "le paquet vendorisé exécute uniquement des vérifications de compatibilité (version Python, plateforme) sans appel réseau ni exécution de commande arbitraire"

message: >
  Dépendance Python correspondant à un paquet malveillant connu ou présentant
  un comportement d'installation suspect (exécution de code/réseau au moment
  du pip install). Retirer immédiatement la dépendance, auditer les
  environnements où elle a été installée, et faire tourner tout secret
  potentiellement exposé — voir rules/remediation/malicious-packages.md.

false_positive_notes:
  - "Un faux positif fréquent est un paquet interne légitime au nom proche d'un paquet malveillant connu — vérifier la source (registre privé vs PyPI public)."
  - "Les hooks setup.py légitimes de compilation (build d'extensions C) ne sont pas malveillants en soi — évaluer la présence d'exfiltration réseau, pas la simple présence d'un hook."

remediation_ref: rules/remediation/malicious-packages.md
knowledge_ref: knowledge/supply-chain/malicious-packages.md
