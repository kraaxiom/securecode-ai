id: vulnerable-libraries
language: python
category: supply-chain
cwe: CWE-1035
owasp: A06:2021-Vulnerable-and-Outdated-Components
severity: medium
confidence_default: high

match:
  type: dependency-scan
  description: >
    Détecte des dépendances Python obsolètes (retard de versions majeures,
    fin de maintenance officielle) dans requirements.txt / pyproject.toml,
    indépendamment d'une CVE précise déjà publiée.
  patterns:
    - "requirements.txt: version épinglée avec un retard de plusieurs versions majeures par rapport à la dernière version stable publiée sur PyPI"
    - "requirements.txt / setup.py: dépendance sur un paquet marqué 'unmaintained'/'deprecated' sur PyPI (ex: dernière publication > 3 ans)"
    - "runtime.txt / pyproject.toml [project] requires-python: version Python en fin de vie officielle (ex: Python 2.7, Python <3.9) toujours ciblée"
  exclude_if:
    - "un correctif de sécurité amont est appliqué localement via patch/vendoring documenté malgré l'ancienneté de la version de base"

message: >
  Dépendance ou version d'interpréteur Python obsolète, sans CVE identifiée
  mais en dehors de la fenêtre de maintenance — risque accru de
  vulnérabilités non corrigées et non détectées. Planifier une mise à jour
  régulière (pip-audit, dependabot) — voir
  rules/remediation/vulnerable-libraries.md.

false_positive_notes:
  - "Un paquet stable et volontairement figé (API interne gelée, pas de faille connue) reste `low` tant qu'aucune CVE n'est publiée."
  - "Les dépendances de build/dev uniquement (non déployées en production) doivent être évaluées séparément avec une sévérité réduite."

remediation_ref: rules/remediation/vulnerable-libraries.md
knowledge_ref: knowledge/supply-chain/vulnerable-libraries.md
