id: known-cves
language: python
category: supply-chain
cwe: CWE-1104
owasp: A06:2021-Vulnerable-and-Outdated-Components
severity: high
confidence_default: high

match:
  type: dependency-scan
  description: >
    Détecte dans requirements.txt / pyproject.toml / Pipfile.lock des versions
    de paquets Python figées correspondant à des CVE publiées connues
    (nécessite une base CVE à jour type OSV/PyPA Advisory Database).
  patterns:
    - "requirements.txt: 'paquet==X.Y.Z' où (paquet, X.Y.Z) correspond à une entrée de la base CVE/OSV pour l'écosystème PyPI"
    - "Pipfile.lock / poetry.lock: version épinglée dans une plage vulnérable connue (ex: Django<3.2.14, PyYAML<5.4, Pillow<9.0)"
    - "requirements.txt: absence de borne supérieure ('paquet' sans version) empêchant de garantir l'exclusion d'une version vulnérable lors de l'installation"
  exclude_if:
    - "un correctif backporté est documenté (changelog interne) rendant la CVE non exploitable malgré le numéro de version"
    - "le paquet vulnérable est listé uniquement dans les dépendances de développement/test et n'atteint jamais un environnement exposé"

message: >
  Dépendance Python figée à une version associée à une CVE publiée connue.
  Mettre à jour vers une version corrigée et intégrer un scan continu
  (pip-audit, safety, Dependabot) — voir rules/remediation/known-cves.md.

false_positive_notes:
  - "Vérifier que la CVE s'applique réellement au module utilisé dans le code (certaines CVE ne touchent qu'une fonctionnalité optionnelle non importée)."
  - "Une CVE 'low' sur un composant non exposé en frontière de confiance peut être reclassée en `medium`."

remediation_ref: rules/remediation/known-cves.md
knowledge_ref: knowledge/supply-chain/known-cves.md
