id: sql-injection
language: python
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte la construction d'une requête SQL par f-string, %-formatting,
    .format() ou concaténation d'une variable non liée, passée à une méthode
    d'exécution SQL (cursor.execute, cursor.executemany, connection.execute,
    session.execute avec du texte brut via SQLAlchemy).
  patterns:
    - "cursor.execute(f\"... {var} ...\")"
    - "cursor.execute(\"...\" % var)"
    - "cursor.execute(\"...\".format(var))"
    - "cursor.execute(\"...\" + var + \"...\")"
    - "connection.execute(f\"... {var} ...\")"
    - "session.execute(text(f\"... {var} ...\"))"
  exclude_if:
    - "var est un littéral constant (pas une variable/paramètre)"
    - "la requête utilise des paramètres liés (%s avec un tuple/liste passé en second argument à execute)"

message: >
  Construction d'une requête SQL par interpolation de chaîne — utiliser des
  requêtes paramétrées (cursor.execute(query, params)) ou l'ORM (SQLAlchemy
  Core/ORM avec bindparam) au lieu d'insérer la variable dans le texte SQL.

false_positive_notes:
  - "Si la variable interpolée est un identifiant de table/colonne validé contre une liste blanche stricte (whitelist), le risque est réduit — reclasser en `medium` après revue manuelle."
  - "Si le pilote applique un échappement automatique documenté avant l'appel (rare), vérifier manuellement avant de remonter en `critical`."

remediation_ref: rules/remediation/sql-injection.md
knowledge_ref: knowledge/injections/sql-injection.md
