id: jwt-weak-secret
language: python
category: auth
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation d'un secret JWT (HS256) faible ou codé en dur —
    littéral court, mot commun, ou valeur par défaut de framework, passé à
    jwt.encode/jwt.decode comme clé de signature.
  patterns:
    - "jwt.encode($payload, 'secret', algorithm='HS256')"
    - "jwt.encode($payload, $short_hardcoded_string, algorithm='HS256')"
    - "SECRET_KEY = 'changeme'"
  exclude_if:
    - "le secret est chargé depuis une variable d'environnement ou un secret manager (os.environ, vault) et non codé en dur dans le code source"
    - "le secret a une entropie suffisante (généré via secrets.token_hex(32) ou équivalent) même si stocké en configuration"

message: >
  Secret de signature JWT faible ou codé en dur dans le code source — un
  attaquant peut le retrouver par force brute (hors ligne) ou lecture du
  dépôt et forger des jetons valides. Utiliser un secret généré
  aléatoirement (≥256 bits) stocké dans un secret manager (voir
  rules/remediation/jwt-weak-secret.md).

false_positive_notes:
  - "Un secret chargé dynamiquement mais dont la valeur par défaut de fallback est faible (os.environ.get('SECRET', 'changeme')) reste vulnérable si la variable n'est pas définie — signaler malgré le chargement dynamique."

remediation_ref: rules/remediation/jwt-weak-secret.md
knowledge_ref: knowledge/auth/jwt-weak-secret.md
