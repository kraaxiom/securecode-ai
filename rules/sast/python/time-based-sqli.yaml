id: time-based-sqli
language: python
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: regex
  description: >
    Détecte une requête SQL interpolée pouvant véhiculer des fonctions de
    délai/temporisation propres au moteur (pg_sleep, SLEEP, WAITFOR DELAY,
    BENCHMARK) — signature d'exploitation par SQLi temporelle, ou simplement
    une surface vulnérable si la variable atteint ces fonctions.
  patterns:
    - "cursor\\.execute\\(f[\"'].*\\{.*\\}.*(SLEEP|pg_sleep|WAITFOR DELAY|BENCHMARK)"
    - "cursor\\.execute\\([\"'].*[\"']\\s*%\\s*\\w+.*\\).*"
    - "connection\\.execute\\(f[\"'].*\\{.*\\}.*\\)"
  exclude_if:
    - "aucune variable n'est interpolée dans la requête (chaîne 100% statique)"
    - "la requête utilise des paramètres liés"

message: >
  Requête SQL interpolée susceptible d'être exploitée par injection
  temporelle (SLEEP/pg_sleep/WAITFOR DELAY) pour exfiltrer des données sans
  réponse directe — paramétrer systématiquement la requête.

false_positive_notes:
  - "Un appel légitime à pg_sleep()/SLEEP() dans du code de test ou de charge n'est pas une vulnérabilité en soi si aucune entrée utilisateur n'atteint la requête."
  - "Confirmer que la variable interpolée provient d'une entrée externe avant de remonter en `high`."

remediation_ref: rules/remediation/time-based-sqli.md
knowledge_ref: knowledge/injections/time-based-sqli.md
