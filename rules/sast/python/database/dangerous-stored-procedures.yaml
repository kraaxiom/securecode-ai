id: dangerous-stored-procedures
language: python
category: database
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un appel Python (psycopg2, SQLAlchemy, mysql-connector) à une
    procédure stockée ou fonction SQL dont les paramètres sont construits par
    concaténation/formatage de chaîne à partir d'une entrée non fiable, au
    lieu d'utiliser le mécanisme d'appel paramétré natif.
  patterns:
    - "cursor.execute(f\"CALL update_balance({user_input})\") — appel de procédure stockée par formatage de chaîne au lieu de cursor.callproc('update_balance', [user_input])"
    - "cursor.execute(\"SELECT * FROM \" + table_name + \"()\") — nom de fonction/procédure ou paramètre construit par concaténation directe"
    - "session.execute(text(f\"EXEC dbo.sp_search '{query}'\")) (SQLAlchemy) — paramètre interpolé dans le texte SQL brut au lieu de text(...).bindparams(...)"
  exclude_if:
    - "l'appel utilise cursor.callproc()/text(...).bindparams() avec liaison de paramètres, ou tous les paramètres proviennent de constantes internes non influençables par l'utilisateur"

message: >
  Appel de procédure stockée ou fonction SQL avec des paramètres construits
  par concaténation/formatage de chaîne — équivalent à une injection SQL
  classique si un paramètre provient d'une entrée utilisateur. Utiliser
  cursor.callproc() ou la liaison de paramètres native (bindparams) plutôt
  que d'interpoler les valeurs dans le texte de la requête — voir
  rules/remediation/dangerous-stored-procedures.md.

false_positive_notes:
  - "Si tous les paramètres interpolés proviennent de constantes applicatives internes (jamais d'entrée utilisateur), non exploitable — reclasser en `info`."
  - "Le nom de la procédure/fonction elle-même n'est généralement pas injectable via bindparams — s'il est dynamique, vérifier qu'il provient d'une allowlist fermée."

remediation_ref: rules/remediation/dangerous-stored-procedures.md
knowledge_ref: knowledge/database/dangerous-stored-procedures.md
