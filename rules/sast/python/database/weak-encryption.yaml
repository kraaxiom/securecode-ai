id: weak-encryption
language: python
category: database
cwe: CWE-326
owasp: A02:2021-Cryptographic-Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte le chiffrement de données sensibles avant stockage en base avec
    un algorithme/mode faible ou une gestion de clé défaillante en Python
    (DES/RC4, ECB, clé statique en dur), ou l'absence totale de chiffrement
    pour des colonnes de données sensibles (PII, secrets).
  patterns:
    - "Crypto.Cipher.DES.new(_) / Crypto.Cipher.ARC4.new(_) — algorithme obsolète (DES, RC4) utilisé pour chiffrer une colonne avant écriture en base"
    - "Crypto.Cipher.AES.new(key, AES.MODE_ECB) — mode ECB (fuite de motifs) utilisé pour chiffrer des données stockées"
    - "clé de chiffrement en dur dans le code (key = b'0123456789abcdef') utilisée pour chiffrer une colonne sensible, au lieu d'être chargée depuis un gestionnaire de secrets/KMS"
    - "colonne base de données stockant SSN/carte bancaire/mot de passe en clair (models.CharField sans passage par une fonction de chiffrement avant .save())"
  exclude_if:
    - "le chiffrement utilise un algorithme moderne (AES-GCM/AES-CBC avec HMAC, ChaCha20-Poly1305) avec IV/nonce unique par opération et clé chargée depuis un KMS/vault, jamais en dur dans le code"

message: >
  Chiffrement de données sensibles avant stockage utilisant un algorithme
  obsolète, un mode non authentifié (ECB), ou une clé en dur — ou absence
  totale de chiffrement pour des données sensibles. Utiliser AES-GCM (ou
  équivalent authentifié) avec IV/nonce unique et une clé gérée par un
  KMS/vault externe au code — voir rules/remediation/weak-encryption.md.

false_positive_notes:
  - "Les mots de passe utilisateurs doivent être hachés (argon2id/bcrypt), pas chiffrés — vérifier qu'il s'agit bien de données nécessitant un chiffrement réversible avant de signaler."
  - "Une clé chargée depuis une variable d'environnement (pas en dur) mais avec un algorithme encore faible reste `high` — les deux critères sont évalués indépendamment."

remediation_ref: rules/remediation/weak-encryption.md
knowledge_ref: knowledge/database/weak-encryption.md
