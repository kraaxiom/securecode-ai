id: boolean-sqli
language: python
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: regex
  description: >
    Détecte une requête SQL interpolée contenant des opérateurs booléens
    typiques (AND/OR suivis de comparaisons) construite dynamiquement via
    f-string ou concaténation, exploitable pour inférer des données par
    vrai/faux.
  patterns:
    - "f[\"'].*\\bWHERE\\b.*\\{.*\\}.*\\b(AND|OR)\\b"
    - "[\"'].*\\bWHERE\\b.*[\"']\\s*\\+\\s*\\w+\\s*\\+\\s*[\"'].*\\b(AND|OR)\\b"
    - "cursor\\.execute\\(.*%\\s*\\(.*\\).*\\bWHERE\\b"
  exclude_if:
    - "la clause WHERE est entièrement statique sans variable interpolée"
    - "la requête utilise des paramètres liés au lieu de l'interpolation directe"

message: >
  Clause WHERE construite par interpolation permettant l'injection
  d'opérateurs booléens (AND/OR) pour extraire des données par inférence
  vrai/faux — utiliser des requêtes paramétrées.

false_positive_notes:
  - "Si la variable interpolée est validée par une liste blanche stricte de valeurs autorisées, le risque est réduit."
  - "Distinguer d'une simple requête statique contenant AND/OR sans entrée utilisateur."

remediation_ref: rules/remediation/boolean-sqli.md
knowledge_ref: knowledge/injections/boolean-sqli.md
