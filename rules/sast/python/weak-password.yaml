id: weak-password
language: python
category: auth
cwe: CWE-521
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte une création/modification de mot de passe sans politique de
    complexité minimale appliquée — absence d'appel à un validateur de mot
    de passe (Django AUTH_PASSWORD_VALIDATORS vide ou absent, ou création
    manuelle sans contrôle de longueur/complexité avant hachage).
  patterns:
    - "set_password($password)  # sans appel préalable à validate_password"
    - "User.objects.create_user(username=$u, password=$p)  # AUTH_PASSWORD_VALIDATORS non configuré ou vide"
  exclude_if:
    - "django.contrib.auth.password_validation.validate_password() est appelé avant set_password(), ou AUTH_PASSWORD_VALIDATORS contient au minimum MinimumLengthValidator et CommonPasswordValidator"
    - "une bibliothèque de validation tierce (zxcvbn ou équivalent) est appliquée en amont"

message: >
  Création de mot de passe sans validation de complexité minimale — les
  utilisateurs peuvent choisir des mots de passe triviaux, facilitant le
  brute force et le credential stuffing. Imposer une longueur minimale et
  une vérification contre les mots de passe courants (voir
  rules/remediation/weak-password.md).

false_positive_notes:
  - "La validation peut être déclarée uniquement dans settings.py (AUTH_PASSWORD_VALIDATORS) sans appel explicite visible dans le code applicatif — vérifier la configuration globale avant de conclure à une absence de contrôle."

remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
