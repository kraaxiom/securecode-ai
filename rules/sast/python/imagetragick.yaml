id: imagetragick
language: python
category: upload
cwe: CWE-78
owasp: A03:2021-Injection
severity: critical
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Detecte le traitement d'une image uploadee par ImageMagick via Wand ou un
    appel convert/identify externe, sans desactivation des coders
    dangereux (MSL, MVG, EPHEMERAL, URL) exploitables via ImageTragick.
  patterns:
    - "wand.image.Image(blob=uploaded_file.read()) sans policy.xml restreignant les coders MSL/MVG/EPHEMERAL/URL"
    - "subprocess.run(['convert', uploaded_path, ...]) sans policy ImageMagick durcie"
    - "PIL.Image.open($_) suivi d'un appel a un binaire ImageMagick externe sur le meme fichier non valide"
  exclude_if:
    - "Une politique ImageMagick (policy.xml) desactive explicitement les coders MSL, MVG, EPHEMERAL, URL, HTTPS"
    - "Le traitement d'image est fait exclusivement via Pillow sans invocation d'ImageMagick"

message: >
  Traitement d'une image uploadee par ImageMagick sans policy.xml durcie - un
  fichier specialement forge (extension .jpg mais contenu MSL/MVG) peut
  declencher une execution de commande cote serveur (ImageTragick, CVE-2016-3714
  et derives). Restreindre les coders dangereux via policy.xml et valider le
  contenu reel du fichier (magic bytes) avant traitement.

false_positive_notes:
  - "Si le pipeline utilise exclusivement Pillow (libjpeg/libpng natifs) sans jamais invoquer ImageMagick, ce pattern ne s'applique pas."

remediation_ref: rules/remediation/imagetragick.md
knowledge_ref: knowledge/upload/imagetragick.md
