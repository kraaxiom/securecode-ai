id: weak-jwt-secret
language: python
category: crypto
cwe: CWE-1391
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un secret JWT court, littéral, ou une vérification d'algorithme
    non épinglée avec les bibliothèques PyJWT ou python-jose.
  patterns:
    - "jwt.encode($payload, 'literal_short_secret', algorithm=_)"
    - "jwt.decode($token, $secret, algorithms=None)"
    - "jwt.decode($token, $secret)  # sans paramètre algorithms explicite"
    - "JWT_SECRET = 'secret'  # ou 'changeme', 'test', valeur par défaut de tutoriel"
  exclude_if:
    - "Le secret provient de os.environ ou d'un gestionnaire de secrets et fait au moins 32 octets"
    - "jwt.decode() est appelé avec algorithms=['RS256'] ou ['ES256'] (clé asymétrique, pas de risque de brute-force sur secret partagé)"

message: >
  Secret JWT faible, codé en dur, ou vérification d'algorithme non
  épinglée — utiliser un secret CSPRNG d'au moins 256 bits et forcer
  explicitement l'algorithme attendu dans jwt.decode()
  (voir rules/remediation/weak-jwt-secret.md).

false_positive_notes:
  - "Si le secret est chargé depuis l'environnement avec une longueur suffisante, ce n'est pas exploitable même si la variable s'appelle simplement 'secret' dans le code."
  - "Si algorithms=['RS256'] est déjà fixé, le risque de brute-force sur secret partagé ne s'applique pas — reclasser en `info` pour ce sous-cas."

remediation_ref: rules/remediation/weak-jwt-secret.md
knowledge_ref: knowledge/crypto/weak-jwt-secret.md
