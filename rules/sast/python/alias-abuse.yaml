id: alias-abuse
language: python
category: graphql
cwe: CWE-770
owasp: A04:2021-Insecure Design
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un serveur GraphQL Python (Graphene, Strawberry, Ariadne) exposé
    sans limite sur le nombre d'alias par requête, permettant de multiplier un
    même resolver des centaines de fois dans un seul appel HTTP.
  patterns:
    - "graphene.Schema(query=Query) exécuté via une vue Django/Flask sans validation_rules limitant le nombre d'alias"
    - "strawberry.Schema(query=Query) sans extension de limitation d'alias/complexité (ex: strawberry.extensions.QueryDepthLimiter seul, sans limite d'alias)"
    - "ariadne.graphql() appelé sans validation_rules personnalisées de comptage d'alias"
  exclude_if:
    - "un middleware ou une validation_rule compte explicitement les alias et rejette au-delà d'un seuil (ex: graphql-core NoSchemaIntrospectionCustomRule combiné à une règle de comptage)"
    - "l'API est strictement interne, authentifiée, et soumise à un rate-limiting au niveau de la complexité de requête (query cost)"

message: >
  Serveur GraphQL sans limite sur le nombre d'alias par requête — un
  attaquant peut multiplier les appels à un resolver sensible (ex: bruteforce
  de mot de passe) en une seule requête HTTP, contournant le rate-limiting
  classique (voir rules/remediation/alias-abuse.md).

false_positive_notes:
  - "Si un query cost analysis (ex: graphql-cost-analysis équivalent Python, ou limite manuelle dans les resolvers sensibles) est en place, reclasser en `low`."
  - "Un schéma exposant uniquement des données publiques non sensibles au bruteforce réduit fortement l'impact réel."

remediation_ref: rules/remediation/alias-abuse.md
knowledge_ref: knowledge/graphql/alias-abuse.md
