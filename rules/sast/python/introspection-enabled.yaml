id: introspection-enabled
language: python
category: graphql
cwe: CWE-200
owasp: A05:2021-Security Misconfiguration
severity: low
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un schéma GraphQL Python (Graphene, Strawberry, Ariadne) déployé
    sans désactivation de l'introspection en environnement de production, ou
    avec `GRAPHIQL`/l'explorateur interactif activé sans condition
    d'environnement.
  patterns:
    - "graphene_django.views.GraphQLView.as_view(graphiql=True) sans condition DEBUG/environnement"
    - "strawberry.Schema(query=Query) sans NoSchemaIntrospectionCustomRule ni extension de désactivation en production"
    - "ariadne.asgi.GraphQL(schema, debug=True) déployé sans vérification d'environnement (settings.DEBUG, os.environ['ENV'])"
  exclude_if:
    - "l'introspection est explicitement désactivée en production via une validation_rule (NoSchemaIntrospectionCustomRule) ou une condition d'environnement"
    - "graphiql/debug est conditionné par `if settings.DEBUG` ou équivalent, empêchant son activation en production"

message: >
  Introspection GraphQL et/ou explorateur interactif potentiellement actifs
  en production sans condition d'environnement — un attaquant peut
  cartographier l'intégralité du schéma de l'API, y compris des champs non
  documentés (voir rules/remediation/introspection-enabled.md).

false_positive_notes:
  - "Si le déploiement de production utilise un fichier de settings distinct qui force DEBUG=False et désactive graphiql, la variable de code source seule ne suffit pas à conclure — vérifier la configuration de déploiement."
  - "Une API strictement interne sans données sensibles exposées via le schéma réduit l'impact réel — reclasser en `info` si confirmé."

remediation_ref: rules/remediation/introspection-enabled.md
knowledge_ref: knowledge/graphql/introspection-enabled.md
