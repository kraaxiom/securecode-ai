id: weak-random
language: python
category: crypto
cwe: CWE-338
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation du module random (Mersenne Twister, non
    cryptographique) pour générer un token, une clé, un identifiant de
    session ou un code OTP, à la place du module secrets ou os.urandom.
  patterns:
    - "random.random()  # assigné à token/session_id/reset_code/otp"
    - "random.randint(_, _)  # assigné à un identifiant de sécurité"
    - "random.choice(_)  # utilisé pour construire un token/mot de passe"
    - "''.join(random.choices($alphabet, k=_))  # génération de token"
    - "random.seed($fixed_value)  # graine fixée dans un contexte sécuritaire"
  exclude_if:
    - "Le résultat est utilisé pour un tirage non sécuritaire (ex: échantillonnage de données, jeu, A/B testing sans impact sécurité)"

message: >
  Utilisation du module random (PRNG non cryptographique) pour une valeur
  de sécurité — remplacer par le module secrets (secrets.token_urlsafe,
  secrets.token_hex) ou os.urandom (voir rules/remediation/weak-random.md).

false_positive_notes:
  - "Si random est utilisé uniquement pour de la logique métier non sécuritaire (ordre d'affichage, échantillonnage statistique), reclasser en `info`."
  - "random.SystemRandom() repose sur os.urandom et est cryptographiquement sûr — ne pas remonter ce cas."

remediation_ref: rules/remediation/weak-random.md
knowledge_ref: knowledge/crypto/weak-random.md
