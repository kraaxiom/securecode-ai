id: jwt-none
language: python
category: auth
cwe: CWE-347
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un décodage JWT (PyJWT) qui inclut 'none' dans la liste des
    algorithmes autorisés, ou qui appelle jwt.decode avec verify=False /
    options={'verify_signature': False}, permettant à un attaquant de
    forger un jeton non signé accepté comme valide.
  patterns:
    - "jwt.decode($token, algorithms=['none'])"
    - "jwt.decode($token, options={'verify_signature': False})"
    - "jwt.decode($token, verify=False)"
  exclude_if:
    - "l'appel avec verify_signature désactivé est utilisé exclusivement pour lire des claims non sensibles avant une seconde validation complète avec signature vérifiée, documentée explicitement dans le code"

message: >
  Décodage JWT acceptant l'algorithme 'none' ou désactivant la vérification
  de signature — un attaquant peut forger un jeton arbitraire sans
  connaître aucun secret. Ne jamais désactiver la vérification de
  signature en dehors d'un contexte de debug isolé (voir
  rules/remediation/jwt-none.md).

false_positive_notes:
  - "Un decode sans vérification utilisé uniquement pour du logging de debug, jamais suivi d'une décision d'autorisation, reste une mauvaise pratique mais l'impact réel doit être confirmé au cas par cas."

remediation_ref: rules/remediation/jwt-none.md
knowledge_ref: knowledge/auth/jwt-none.md
