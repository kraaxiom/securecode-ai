id: dos-query
language: python
category: graphql
cwe: CWE-400
owasp: A04:2021-Insecure Design
severity: high
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un serveur GraphQL Python exposant des champs de liste avec
    pagination (`first`, `limit`, `offset`) sans borne maximale imposée
    côté resolver, ou sans analyse de coût de requête (query cost analysis)
    configurée au niveau du schéma.
  patterns:
    - "def resolve_items(self, info, first=None, **kwargs): Model.objects.all()[:first] sans plafond max(first, MAX_PAGE_SIZE)"
    - "graphene.Schema(query=Query) sans validation_rules de cost analysis (ex: règle personnalisée de calcul de coût)"
    - "strawberry.Schema sans extensions=[QueryDepthLimiter(...), ...] combinant profondeur ET complexité"
  exclude_if:
    - "chaque resolver de liste applique un plafond explicite (ex: min(first, 100)) avant la requête base de données"
    - "une règle de validation de complexité (query cost) rejette les requêtes dépassant un seuil configuré"

message: >
  Champs GraphQL paginés sans plafond de taille ni analyse de coût de
  requête — une requête combinant listes larges et alias multiples peut
  provoquer un déni de service par surcharge base de données/mémoire (voir
  rules/remediation/dos-query.md).

false_positive_notes:
  - "Si la base de données applique elle-même un LIMIT global via une contrainte de connexion ou un ORM configuré avec un plafond par défaut, le risque est atténué."
  - "Un endpoint accessible uniquement en interne avec authentification forte réduit la probabilité d'exploitation mais ne l'élimine pas."

remediation_ref: rules/remediation/dos-query.md
knowledge_ref: knowledge/graphql/dos-query.md
