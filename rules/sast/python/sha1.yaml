id: sha1
language: python
category: crypto
cwe: CWE-328
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation de hashlib.sha1 (ou hmac avec digestmod sha1)
    dans un contexte de hachage de mot de passe, de signature, ou de preuve
    d'intégrité opposable à un attaquant.
  patterns:
    - "hashlib.sha1($password_var)"
    - "hashlib.new('sha1', $_)"
    - "hmac.new($key, $msg, hashlib.sha1)"
    - "passlib.hash.sha1_crypt.hash(_)"
  exclude_if:
    - "Le résultat sert uniquement de clé de cache ou d'identifiant de déduplication non lié à l'authentification"

message: >
  Utilisation de SHA-1 (cassé cryptographiquement depuis l'attaque
  SHAttered) pour du hachage sensible ou une signature — remplacer par
  SHA-256/SHA-3 (intégrité) ou Argon2id (mot de passe)
  (voir rules/remediation/sha1.md).

false_positive_notes:
  - "Si sha1 est utilisé uniquement pour un checksum non adversarial (ex: détection de doublons sur fichiers internes), reclasser en `info`."
  - "Si utilisé dans un HMAC pour un protocole legacy imposé (ex: certains flux OAuth1), documenter la contrainte et reclasser en `low` si non modifiable."

remediation_ref: rules/remediation/sha1.md
knowledge_ref: knowledge/crypto/sha1.md
