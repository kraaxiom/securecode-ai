id: api-key-leakage
language: python
category: api
cwe: CWE-798
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Detecte une cle API, un token ou un secret code en dur dans le code
    source Python, ou expose via une reponse API (serialisation d'un objet
    contenant un champ secret non exclu).
  patterns:
    - "STRIPE_API_KEY = 'sk_live_...' ou toute affectation de chaine litterale ressemblant a une cle API/secret"
    - "openai.api_key = 'sk-...' code en dur dans le code source"
    - "serializers.ModelSerializer avec fields = '__all__' incluant un champ api_key/secret/token sans exclusion explicite"
    - "return jsonify(user.__dict__) exposant des attributs sensibles (api_key, password_hash) non filtres"
  exclude_if:
    - "La cle est chargee depuis os.environ / une variable d'environnement / un gestionnaire de secrets (Vault, AWS Secrets Manager)"
    - "Le champ sensible est explicitement exclu via exclude=[...] ou write_only=True dans le serializer"

message: >
  Cle API ou secret code en dur dans le code source, ou expose dans une
  reponse API sans filtrage explicite des champs sensibles. Charger tous les
  secrets depuis des variables d'environnement ou un gestionnaire de secrets,
  et exclure explicitement les champs sensibles des serializers de sortie.

false_positive_notes:
  - "Une cle placee dans un fichier de test/fixture clairement isole (jamais deploye) peut etre reclassee en `low`, a condition qu'elle ne soit pas une cle reelle valide."

remediation_ref: rules/remediation/api-key-leakage.md
knowledge_ref: knowledge/api/api-key-leakage.md
