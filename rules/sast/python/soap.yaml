id: soap
language: python
category: api
cwe: CWE-611
owasp: A05:2021-Security Misconfiguration
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Detecte un parsing XML/SOAP Python (lxml, xml.etree, zeep en mode
    serveur) sans desactivation de la resolution d'entites externes,
    exposant a une injection XXE lors du traitement d'une requete SOAP.
  patterns:
    - "lxml.etree.parse($_) ou lxml.etree.fromstring($_) sans resolve_entities=False dans le XMLParser"
    - "xml.etree.ElementTree.parse($_) utilise pour parser un payload SOAP externe (vulnerable par defaut a XXE selon la version)"
    - "xml.dom.minidom.parseString($_) sur un contenu SOAP entrant sans defusedxml"
  exclude_if:
    - "Le parsing utilise defusedxml.ElementTree ou defusedxml.lxml"
    - "lxml.etree.XMLParser(resolve_entities=False, no_network=True) est explicitement configure"

message: >
  Parsing de requete SOAP/XML sans desactivation de la resolution d'entites
  externes — expose a une injection XXE (lecture de fichiers locaux, SSRF,
  deni de service). Utiliser defusedxml ou configurer explicitement
  resolve_entities=False / no_network=True sur le parseur XML.

false_positive_notes:
  - "Python >= 3.7.1 desactive par defaut le traitement des DTD externes dans xml.etree pour certains cas, mais ce n'est pas garanti pour tous les parseurs (lxml reste vulnerable par defaut) — verifier la bibliotheque exacte."

remediation_ref: rules/remediation/soap.md
knowledge_ref: knowledge/api/soap.md
