id: sslv2
language: python
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'autorisation explicite de SSLv2 dans le module ssl standard
    de Python, via des options qui n'excluent pas le protocole ou des
    constructeurs de contexte historiques.
  patterns:
    - "ssl.wrap_socket(_, ssl_version=ssl.PROTOCOL_SSLv2)"
    - "ssl.SSLContext(ssl.PROTOCOL_SSLv2)"
    - "context.options non protégé par ssl.OP_NO_SSLv2 sur un SSLContext créé avec un protocole permissif"
  exclude_if:
    - "La constante ssl.PROTOCOL_SSLv2 n'existe pas dans l'environnement cible (retirée des versions récentes d'OpenSSL/Python) — signaler comme information de contexte, pas comme faux positif"

message: >
  Protocole SSLv2 autorisé explicitement (interdit par la RFC 6176,
  vulnérable à DROWN) — n'autoriser que TLS 1.2/1.3 via
  ssl.PROTOCOL_TLS_CLIENT ou ssl.PROTOCOL_TLS_SERVER
  (voir rules/remediation/sslv2.md).

false_positive_notes:
  - "Si le code cible une version de Python où PROTOCOL_SSLv2 n'est plus exposé par le module ssl (Python 3.6+), l'appel échouera à l'exécution — signaler quand même comme code mort dangereux à supprimer."

remediation_ref: rules/remediation/sslv2.md
knowledge_ref: knowledge/crypto/sslv2.md
