id: browser-cache-poisoning
language: python
category: modern
cwe: CWE-525
owasp: A04:2021-Insecure Design
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une réponse Flask/Django contenant des données spécifiques à
    l'utilisateur (profil, solde, session) renvoyée avec un en-tête
    `Cache-Control` absent ou trop permissif (`public`, sans `no-store`).
  patterns:
    - "return render(request, 'profile.html', {'user': request.user}) sans response['Cache-Control'] = 'no-store'"
    - "@app.route('/account') def account(): return jsonify(user_data) sans response.headers['Cache-Control']"
    - "response = make_response(sensitive_data); response.headers['Cache-Control'] = 'public, max-age=3600' # sur une page authentifiée"
  exclude_if:
    - "la réponse fixe explicitement Cache-Control: no-store (ou private, no-cache) sur toute vue exposant des données utilisateur"
    - "un middleware global (ex: django.middleware.cache avec cache_control(private=True)) applique cette politique à toutes les vues authentifiées"

message: >
  Réponse contenant des données spécifiques à l'utilisateur renvoyée sans
  en-tête Cache-Control restrictif — risque de réutilisation incorrecte par
  le cache du navigateur, notamment sur des postes partagés (voir
  rules/remediation/browser-cache-poisoning.md).

false_positive_notes:
  - "Si un middleware Django (`never_cache` ou `cache_control(private=True, no_store=True)`) est appliqué globalement aux vues authentifiées, reclasser en `low`."
  - "Les données réellement publiques (ex: contenu identique pour tous les utilisateurs) ne sont pas concernées par ce risque."

remediation_ref: rules/remediation/browser-cache-poisoning.md
knowledge_ref: knowledge/modern/browser-cache-poisoning.md
