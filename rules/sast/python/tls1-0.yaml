id: tls1-0
language: python
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte la fixation explicite de TLS 1.0 ou 1.1 comme version minimale
    ou unique autorisée via le module ssl ou la bibliothèque requests/urllib3.
  patterns:
    - "ssl.wrap_socket(_, ssl_version=ssl.PROTOCOL_TLSv1)"
    - "ssl.wrap_socket(_, ssl_version=ssl.PROTOCOL_TLSv1_1)"
    - "context.minimum_version = ssl.TLSVersion.TLSv1"
    - "context.minimum_version = ssl.TLSVersion.TLSv1_1"
    - "requests.adapters.HTTPAdapter avec ssl_version=ssl.PROTOCOL_TLSv1 passé à un urllib3.poolmanager.PoolManager"
  exclude_if:
    - "context.minimum_version est fixé à ssl.TLSVersion.TLSv1_2 ou supérieur ailleurs dans le même contexte, rendant la ligne détectée redondante et inoffensive"

message: >
  TLS 1.0/1.1 autorisé explicitement (obsolète, exclu par la RFC 8996 et
  des référentiels PCI-DSS) — fixer minimum_version à
  ssl.TLSVersion.TLSv1_2 au minimum, TLS 1.3 de préférence
  (voir rules/remediation/tls1-0.md).

false_positive_notes:
  - "Si la connexion cible un système tiers legacy documenté ne supportant que TLS 1.0, et que le trafic ne transite pas par un réseau non fiable, reclasser en `medium` avec justification écrite."

remediation_ref: rules/remediation/tls1-0.md
knowledge_ref: knowledge/crypto/tls1-0.md
