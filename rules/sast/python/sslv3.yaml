id: sslv3
language: python
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'autorisation explicite de SSLv3 dans le module ssl standard
    de Python, exposant l'application à l'attaque POODLE.
  patterns:
    - "ssl.wrap_socket(_, ssl_version=ssl.PROTOCOL_SSLv3)"
    - "ssl.SSLContext(ssl.PROTOCOL_SSLv3)"
    - "context = ssl.SSLContext(_) sans context.options |= ssl.OP_NO_SSLv3"
  exclude_if:
    - "La constante ssl.PROTOCOL_SSLv3 n'existe pas dans l'environnement cible (retirée des versions récentes) — signaler comme code mort dangereux plutôt que comme faux positif"

message: >
  Protocole SSLv3 autorisé explicitement (vulnérable à POODLE, interdit
  par la RFC 7568) — n'autoriser que TLS 1.2/1.3
  (voir rules/remediation/sslv3.md).

false_positive_notes:
  - "Si l'option ssl.OP_NO_SSLv3 est déjà appliquée sur le SSLContext juste après la création, ce n'est pas exploitable — reclasser en `info`."

remediation_ref: rules/remediation/sslv3.md
knowledge_ref: knowledge/crypto/sslv3.md
