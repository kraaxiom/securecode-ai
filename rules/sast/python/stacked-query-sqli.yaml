id: stacked-query-sqli
language: python
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: critical
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'exécution d'une requête SQL interpolée via une API supportant
    l'empilement de requêtes (multi-statements) séparées par ';' — notamment
    psycopg2/pymysql avec des drivers autorisant plusieurs instructions, ou
    connection.executescript en sqlite3 avec une variable injectée.
  patterns:
    - "connection.executescript(f\"... {var} ...\")"
    - "cursor.execute(f\"...; {var}\")"
    - "cursor.execute(\"...;\" + var)"
  exclude_if:
    - "var est un littéral constant (pas une variable/paramètre)"
    - "le driver/API n'autorise pas nativement le multi-statements (ex: cursor.execute standard sur la plupart des drivers MySQL/PostgreSQL le refuse par défaut)"

message: >
  Requête SQL interpolée exécutée via une API autorisant l'empilement
  d'instructions (executescript ou équivalent) — un attaquant peut ajouter
  des instructions SQL arbitraires (INSERT, DROP, etc.) séparées par ';'.
  Utiliser execute() avec paramètres liés et une seule instruction.

false_positive_notes:
  - "sqlite3.executescript() est parfois utilisé légitimement pour des migrations statiques sans entrée utilisateur — vérifier la source de la variable."
  - "Si le driver refuse explicitement les multi-statements (comportement par défaut de nombreux connecteurs), le risque réel est réduit."

remediation_ref: rules/remediation/stacked-query-sqli.md
knowledge_ref: knowledge/injections/stacked-query-sqli.md
