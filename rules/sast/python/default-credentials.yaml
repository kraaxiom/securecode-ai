id: default-credentials
language: python
category: auth
cwe: CWE-1392
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un identifiant/mot de passe par défaut codé en dur dans la
    création d'un compte administrateur, une fixture de seed, ou une
    configuration de démarrage (createsuperuser scripté avec mot de passe
    fixe, compte 'admin'/'admin' dans un script d'init).
  patterns:
    - "User.objects.create_superuser(username='admin', password='admin')"
    - "create_user(username=$u, password='changeme')"
    - "DEFAULT_PASSWORD = _"
  exclude_if:
    - "le mot de passe est généré aléatoirement à chaque déploiement (secrets.token_urlsafe) et non codé en dur"
    - "le compte est strictement limité à un environnement de développement local (fichier explicitement exclu du déploiement en production, ex: fixtures/dev_only.py)"

message: >
  Identifiants par défaut codés en dur pour un compte privilégié — si ce
  compte atteint un environnement de production, il constitue un accès
  administrateur trivialement devinable. Générer un mot de passe aléatoire
  unique par déploiement et forcer son changement au premier accès (voir
  rules/remediation/default-credentials.md).

false_positive_notes:
  - "Un script de seed clairement isolé dans un dossier dev/fixtures et jamais exécuté en production est à faible risque — vérifier le pipeline de déploiement avant de remonter en `critical`."

remediation_ref: rules/remediation/default-credentials.md
knowledge_ref: knowledge/auth/default-credentials.md
