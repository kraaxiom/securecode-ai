id: message-injection
language: python
category: websocket
cwe: CWE-20
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un message reçu sur un canal WebSocket (Django Channels `receive`/
    `receive_json`, `websockets` `async for message in websocket`, Flask-SocketIO
    `on('message')`) utilisé directement dans une requête SQL, une commande
    système, un rendu de template ou rediffusé (broadcast) sans validation ni
    échappement.
  patterns:
    - "async def receive(self, text_data): ... cursor.execute(text_data) ou f-string incluant text_data"
    - "async def receive_json(self, content): ... self.channel_layer.group_send(_, content) without schema validation"
    - "async for message in websocket: ... os.system(message) ou subprocess.run(message, shell=True)"
    - "@socketio.on('message') def handler(data): ... render_template_string(data)"
  exclude_if:
    - "le message est validé contre un schéma strict (Pydantic, Marshmallow, jsonschema) avant tout usage"
    - "le message est transmis à une requête paramétrée (placeholders liés) ou à subprocess sans shell=True et avec une liste d'arguments fixe"

message: >
  Contenu d'un message WebSocket utilisé sans validation dans une requête,
  une commande ou un rendu de template — vulnérable à l'injection SQL, de
  commande ou XSS diffusé en temps réel (voir
  rules/remediation/message-injection.md).

false_positive_notes:
  - "Si le message est immédiatement validé par un schéma Pydantic/Marshmallow strict avant tout traitement en aval, reclasser en `low`."
  - "Un simple relais (echo) vers d'autres clients sans traitement serveur applicatif reste un risque XSS côté client à évaluer séparément."

remediation_ref: rules/remediation/message-injection.md
knowledge_ref: knowledge/websocket/message-injection.md
