id: blind-sql-injection
language: python
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une requête SQL construite par interpolation d'une variable et
    utilisée dans un contexte booléen (résultat comparé à vide/non-vide,
    branche if/else) sans retour d'erreur ni de données exploitées
    directement — signature typique d'une injection SQL aveugle exploitable
    via cursor.execute.
  patterns:
    - "cursor.execute(f\"SELECT ... WHERE ... {var} ...\"); if cursor.fetchone(): ..."
    - "cursor.execute(\"...\" + var); result = cursor.fetchall(); if result: ..."
    - "connection.execute(f\"... {var} ...\").scalar()"
  exclude_if:
    - "var est un littéral constant (pas une variable/paramètre)"
    - "la requête utilise des paramètres liés (%s avec tuple/liste en second argument)"

message: >
  Requête SQL interpolée dont le résultat est utilisé dans une logique
  conditionnelle — un attaquant peut inférer des données bit par bit via des
  conditions booléennes. Utiliser des requêtes paramétrées systématiquement.

false_positive_notes:
  - "Si la variable est strictement un booléen/entier casté avant l'exécution (bool(), int()), le risque est neutralisé — reclasser en `info`."
  - "Confirmer que la branche conditionnelle est bien observable côté client (temps de réponse, code HTTP, contenu) avant de remonter en `high`."

remediation_ref: rules/remediation/blind-sql-injection.md
knowledge_ref: knowledge/injections/blind-sql-injection.md
