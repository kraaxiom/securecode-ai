id: credential-stuffing
language: python
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un endpoint de login qui ne détecte ni ne limite les tentatives
    provenant de multiples couples identifiant/mot de passe issus de la
    même source (absence de vérification contre des bases de fuites connues,
    absence de scoring de risque, absence de MFA adaptatif après échecs
    répétés sur des comptes distincts).
  patterns:
    - "def login($request): ...; User.objects.get(username=$u); check_password($p, $hash)"
  exclude_if:
    - "le mot de passe est vérifié contre un service de type Have I Been Pwned (k-anonymity) lors de l'inscription/changement"
    - "un mécanisme de détection d'anomalie (device fingerprinting, vélocité par IP) déclenche une MFA additionnelle"

message: >
  Endpoint de login sans défense contre le credential stuffing (réutilisation
  de couples identifiant/mot de passe fuités ailleurs) — absence de
  vérification contre les bases de fuites connues et de détection de
  vélocité anormale. Ajouter une vérification k-anonymity et un MFA
  adaptatif (voir rules/remediation/credential-stuffing.md).

false_positive_notes:
  - "Ce contrôle est souvent implémenté au niveau infrastructure (WAF, service anti-bot) et invisible dans le code applicatif — vérifier l'architecture globale avant de conclure à une absence totale de protection."

remediation_ref: rules/remediation/credential-stuffing.md
knowledge_ref: knowledge/auth/credential-stuffing.md
