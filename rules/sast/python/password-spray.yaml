id: password-spray
language: python
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un endpoint de login qui limite les tentatives par compte
    (verrouillage après N échecs sur le même username) mais n'a aucune
    limitation globale par IP/source — un attaquant peut tester un mot de
    passe commun sur de nombreux comptes différents sans déclencher le
    verrouillage par compte (password spraying).
  patterns:
    - "def login($request): ...; if failed_attempts[$username] > 5: lock_account($username)  # absence de limite par IP"
  exclude_if:
    - "un rate limiting global par IP/source (flask-limiter, django-ratelimit) est appliqué en complément du verrouillage par compte"
    - "un CAPTCHA ou une détection comportementale (device fingerprint) est déclenché après un seuil d'échecs agrégés par IP"

message: >
  Endpoint de login protégé uniquement par compte, sans limitation
  agrégée par IP/source — un attaquant peut mener une attaque de password
  spraying (un mot de passe commun testé sur de nombreux comptes) sans
  déclencher de blocage. Ajouter un rate limiting par IP en complément du
  verrouillage par compte (voir rules/remediation/password-spray.md).

false_positive_notes:
  - "Si la limitation par IP est gérée au niveau infrastructure (WAF, API gateway) et non visible dans le code applicatif, vérifier l'architecture globale avant de conclure à une absence de protection."

remediation_ref: rules/remediation/password-spray.md
knowledge_ref: knowledge/auth/password-spray.md
