id: deep-query
language: python
category: graphql
cwe: CWE-674
owasp: A04:2021-Insecure Design
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un schéma GraphQL Python exposant des types récursifs/imbriqués
    (relations `friends`, `children`, `replies`) sans limite de profondeur de
    requête configurée au niveau du serveur.
  patterns:
    - "graphene.Schema(query=Query) exécuté sans validation_rules incluant une règle de profondeur (ex: graphql-core depth_limit_validator)"
    - "strawberry.Schema(query=Query) sans strawberry.extensions.QueryDepthLimiter dans extensions=[...]"
    - "ariadne.graphql() sans validation_rules de limite de profondeur personnalisée"
  exclude_if:
    - "une règle de validation de profondeur (depth_limit_validator, QueryDepthLimiter, ou équivalent maison) est explicitement configurée avec un maximum raisonnable (ex: <= 10)"
    - "le schéma ne contient aucun type auto-référent ou relation cyclique exploitable en profondeur"

message: >
  Schéma GraphQL sans limite de profondeur de requête — une requête
  imbriquée récursivement (ex: `user { friends { friends { ... } } }`) peut
  provoquer un déni de service par consommation exponentielle de ressources
  (voir rules/remediation/deep-query.md).

false_positive_notes:
  - "Si le schéma ne contient aucune relation auto-référente, le risque de profondeur exponentielle est nul même sans limite explicite."
  - "Un timeout global d'exécution de requête (ex: au niveau du serveur WSGI/ASGI) atténue partiellement le risque sans le supprimer — signaler quand même."

remediation_ref: rules/remediation/deep-query.md
knowledge_ref: knowledge/graphql/deep-query.md
