id: des
language: rust
category: crypto
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte la dépendance et l'usage des crates `des` ou `des` via
    `block-modes`/`cipher` (des::Des, TdesEde3) pour chiffrer des données.
  patterns:
    - "des = \"_\" (Cargo.toml)"
    - "use des::Des"
    - "use des::TdesEde3"
  exclude_if:
    - "usage exclusif dans un test de compatibilité avec un format legacy externe, documenté comme tel"

message: >
  Le crate `des` implémente DES/3DES, un algorithme de chiffrement obsolète
  (clé effective 56 bits, vulnérable à Sweet32) — migrer vers le crate `aes-gcm`.

false_positive_notes:
  - "Si l'appel sert uniquement à déchiffrer des données legacy en lecture seule pour migration, reclasser en `medium` avec plan de migration explicite."
  - "Vérifier qu'aucune donnée sensible nouvelle n'est chiffrée avec cet algorithme avant de conclure."

remediation_ref: rules/remediation/des.md
knowledge_ref: knowledge/crypto/des.md
