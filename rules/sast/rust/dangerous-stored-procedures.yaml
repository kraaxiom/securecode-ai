id: dangerous-stored-procedures
language: rust
category: database
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un appel Rust (sqlx, diesel) à une procédure stockée ou fonction
    SQL dont les paramètres sont construits par concaténation/format! à
    partir d'une entrée non fiable, au lieu d'utiliser le bind paramétré
    natif.
  patterns:
    - "sqlx::query(&format!(\"CALL update_balance({})\", user_input)) — appel de procédure stockée par formatage de chaîne au lieu de sqlx::query(\"CALL update_balance($1)\").bind(user_input)"
    - "sql_query(format!(\"CALL {}('{}')\", proc_name, value)) (diesel) — nom de procédure ou paramètre construit par concaténation directe"
    - "sqlx::query(&format!(\"EXEC dbo.sp_Search '{}'\", query)) au lieu de .bind(query) avec un placeholder"
  exclude_if:
    - "l'appel utilise .bind()/paramètres liés natifs de sqlx ou diesel, ou tous les paramètres proviennent de constantes internes non influençables par l'utilisateur"

message: >
  Appel de procédure stockée ou fonction SQL avec des paramètres construits
  par concaténation/format! — équivalent à une injection SQL classique si un
  paramètre provient d'une entrée utilisateur. Utiliser .bind() avec un
  placeholder ($1, ?) plutôt que d'interpoler les valeurs dans le texte de la
  requête — voir rules/remediation/dangerous-stored-procedures.md.

false_positive_notes:
  - "Si tous les paramètres interpolés proviennent de constantes applicatives internes (jamais d'entrée utilisateur), non exploitable — reclasser en `info`."
  - "Le nom de la procédure elle-même n'est généralement pas injectable via bind — s'il est dynamique, vérifier qu'il provient d'une allowlist fermée."

remediation_ref: rules/remediation/dangerous-stored-procedures.md
knowledge_ref: knowledge/database/dangerous-stored-procedures.md
