id: weak-jwt-secret
language: rust
category: crypto
cwe: CWE-1391
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un secret JWT court ou littéral passé à EncodingKey::from_secret
    via le crate `jsonwebtoken` pour une signature HS256.
  patterns:
    - "EncodingKey::from_secret(\"_littéral_court_\".as_ref())"
    - "EncodingKey::from_secret(b\"secret\")"
    - "const JWT_SECRET: &str = \"_littéral_\""
  exclude_if:
    - "la clé est chargée depuis std::env::var/un gestionnaire de secrets avec une longueur générée aléatoirement (non vérifiable statiquement, à valider manuellement)"

message: >
  Secret JWT HS256 court ou codé en dur — un attaquant peut le retrouver par
  force brute hors ligne et forger des tokens valides ; utiliser un secret
  aléatoire d'au moins 256 bits stocké dans une variable d'environnement ou
  un gestionnaire de secrets.

false_positive_notes:
  - "Si l'algorithme est RS256/ES256 (clé asymétrique via EncodingKey::from_rsa_pem), ce pattern ne s'applique pas."
  - "Une clé chargée dynamiquement mais dont la valeur par défaut de fallback est faible reste vulnérable — vérifier le chemin de fallback."

remediation_ref: rules/remediation/weak-jwt-secret.md
knowledge_ref: knowledge/crypto/weak-jwt-secret.md
