id: csp-weakness
language: rust
category: frontend
cwe: CWE-693
owasp: A05:2021-Security Misconfiguration
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une Content-Security-Policy configurée côté Rust (en-tête manuel
    ou middleware tower/actix) contenant des directives trop permissives
    (unsafe-inline, unsafe-eval, joker large) ou son absence totale sur les
    routes HTML.
  patterns:
    - "HttpResponse::Ok().insert_header((\"Content-Security-Policy\", string_concat(_, \"unsafe-inline\", _)))"
    - "SetResponseHeaderLayer::overriding(HeaderName::from_static(\"content-security-policy\"), HeaderValue::from_static(\"default-src *\"))"
    - "response.headers_mut().insert(\"content-security-policy\", HeaderValue::from_str(string_concat(_, \"unsafe-eval\", _)))"
    - "App::new().route($path, web::get().to($handler))  # sert du HTML sans jamais définir Content-Security-Policy"
  exclude_if:
    - "unsafe-inline/unsafe-eval n'est actif que sous condition d'environnement de développement"
    - "la CSP utilise des nonces ou hashes générés dynamiquement plutôt que unsafe-inline"
    - "la directive est envoyée en Content-Security-Policy-Report-Only avec un suivi de durcissement référencé"

message: >
  La Content-Security-Policy définie par le backend Rust contient des
  directives trop permissives (unsafe-inline/unsafe-eval/joker *) ou n'est
  jamais définie sur les routes HTML, réduisant l'efficacité de cette défense
  en profondeur contre le XSS (voir rules/remediation/csp-weakness.md).

false_positive_notes:
  - "Si unsafe-inline/unsafe-eval n'est actif qu'en environnement de développement, l'impact en production est nul."
  - "Une CSP en mode Report-Only n'est pas bloquante mais reste un signal à corriger, pas un vrai positif critique."
  - "Vérifier qu'une couche de middleware plus spécifique en aval ne surcharge pas cette valeur avec une politique plus stricte."

remediation_ref: rules/remediation/csp-weakness.md
knowledge_ref: knowledge/frontend/csp-weakness.md
