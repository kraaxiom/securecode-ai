id: workflow-bypass
language: rust
category: business-logic
cwe: CWE-841
owasp: A04:2021-Insecure-Design
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un endpoint Rust d'une étape avancée d'un workflow multi-étapes
    (paiement, validation, publication) accessible sans vérification que les
    étapes précédentes ont bien été complétées et persistées côté serveur.
  patterns:
    - "async fn confirm_order(Path(order_id): Path<Uuid>) -> impl IntoResponse { update_status(order_id, \"confirmed\").await } — accessible directement sans vérifier order.status == \"payment_pending\" ou l'existence d'un paiement validé en base"
    - "async fn publish_article(Path(article_id): Path<Uuid>) -> impl IntoResponse { update_status(article_id, \"published\").await } — sans vérifier que article.status == \"reviewed\"/\"approved\" au préalable"
    - "machine à états implémentée par de simples match/if sur un champ status transmis par le client (req.status) au lieu d'être dérivé de l'état serveur précédent"
  exclude_if:
    - "chaque transition d'état vérifie explicitement l'état actuel persisté en base avant d'autoriser la transition suivante (machine à états stricte via un enum Rust avec transitions exhaustives), indépendamment de toute valeur fournie par le client"

message: >
  Transition d'étape d'un workflow métier autorisée sans vérifier que les
  étapes précédentes ont été complétées côté serveur — un attaquant peut
  appeler directement une étape avancée (confirmation, publication) en
  sautant les contrôles intermédiaires (paiement, validation). Vérifier
  explicitement l'état persisté avant chaque transition, idéalement via une
  machine à états stricte modélisée en enum Rust — voir
  rules/remediation/workflow-bypass.md.

false_positive_notes:
  - "Si l'endpoint est protégé par un contrôle d'autorisation qui de facto exige l'étape précédente (ex: token de confirmation généré uniquement après paiement), le contrôle peut être considéré équivalent — vérifier son caractère non contournable."
  - "Les workflows à étape unique (pas de séquence obligatoire) ne sont pas concernés."

remediation_ref: rules/remediation/workflow-bypass.md
knowledge_ref: knowledge/business-logic/workflow-bypass.md
