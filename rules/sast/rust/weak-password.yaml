id: weak-password
language: rust
category: auth
cwe: CWE-521
owasp: A07:2021-Identification and Authentication Failures
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte, dans du code Rust, des patterns caractéristiques de politique de mot de passe faible
    lorsqu'une entrée non fiable (utilisateur, requête HTTP, paramètre externe)
    atteint une opération sensible sans validation ni contrôle préalable.
  patterns:
    - "jsonwebtoken::decode::<Claims>(token, &DecodingKey::from_secret(b"secret"), &Validation::default())"
    - "Validation::new(Algorithm::None)  // acceptation explicite de alg none"
    - ".insecure_disable_signature_validation()"
  exclude_if:
    - "le secret/la clé provient d'un gestionnaire de secrets (Key Vault, Vault, KMS) avec rotation, pas d'une valeur hardcodée"
    - "la vérification de signature est explicitement forcée en amont (algorithme et clé imposés côté serveur)"

message: >
  Pattern potentiellement vulnérable à politique de mot de passe faible détecté — une entrée non validée
  semble atteindre une opération sensible. Vérifier la provenance de la donnée
  et appliquer une validation/liste blanche avant utilisation
  (voir rules/remediation/weak-password.md). Recommandation : utiliser une vérification de signature stricte avec un algorithme et une clé forte imposés côté serveur, jamais dérivés de l'entrée.

false_positive_notes:
  - "Si la valeur incriminée provient exclusivement d'une constante interne ou d'une configuration serveur, ce n'est pas exploitable — reclasser en `info`."
  - "Si une validation stricte (liste blanche, normalisation de chemin, vérification de signature/ownership) est appliquée immédiatement avant l'opération sensible, vérifier manuellement avant de remonter en `medium`."

remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
