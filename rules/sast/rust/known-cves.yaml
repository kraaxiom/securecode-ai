id: known-cves
language: rust
category: supply-chain
cwe: CWE-1104
owasp: A06:2021-Vulnerable-and-Outdated-Components
severity: high
confidence_default: high

match:
  type: dependency-scan
  description: >
    Détecte dans Cargo.toml / Cargo.lock des versions de crates figées
    correspondant à des CVE publiées connues (nécessite une base CVE à jour
    type RustSec Advisory Database/OSV).
  patterns:
    - "Cargo.toml: crate = \"X.Y.Z\" où (crate, X.Y.Z) correspond à une entrée de la RustSec Advisory Database pour l'écosystème crates.io"
    - "Cargo.lock: version verrouillée dans une plage vulnérable connue (ex: time<0.2.23, openssl<0.10.55)"
    - "Cargo.toml: contrainte de version sans borne supérieure ('*' ou '>=X') empêchant de garantir l'exclusion d'une version vulnérable lors de la résolution"
  exclude_if:
    - "un correctif backporté est documenté (changelog interne) rendant la CVE non exploitable malgré le numéro de version"
    - "la crate vulnérable est listée uniquement sous [dev-dependencies] et n'est jamais compilée dans le binaire release"

message: >
  Dépendance Rust figée à une version associée à une CVE publiée connue.
  Mettre à jour vers une version corrigée et intégrer un scan continu
  (cargo-audit, cargo-deny) — voir rules/remediation/known-cves.md.

false_positive_notes:
  - "Vérifier que la CVE s'applique réellement à la fonctionnalité utilisée (certaines advisories RustSec ne touchent qu'un feature flag non activé)."
  - "Une CVE 'low' sur un composant non exposé en frontière de confiance peut être reclassée en `medium`."

remediation_ref: rules/remediation/known-cves.md
knowledge_ref: knowledge/supply-chain/known-cves.md
