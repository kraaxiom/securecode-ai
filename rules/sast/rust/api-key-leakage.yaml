id: api-key-leakage
language: rust
category: api
cwe: CWE-798
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une clé API ou un secret codé en dur dans le code source Rust
    (constante ou littéral) au lieu d'être chargé via une variable
    d'environnement ou un gestionnaire de secrets.
  patterns:
    - "const $VAR: &str = \"$literal_key\";"
    - "let $var = \"$literal_key\";"
    - "header(\"Authorization\", \"$literal_key\")"
    - "static $VAR: &str = \"$literal_key\";"
  exclude_if:
    - "la valeur provient de std::env::var($_) ou d'une crate de gestion de secrets (ex: vaultrs, aws-sdk-secretsmanager)"
    - "le littéral est un exemple factice clairement non fonctionnel (ex: \"your-api-key-here\")"

message: >
  Clé API ou secret codé en dur dans le code source Rust — remplacer par
  std::env::var() ou un gestionnaire de secrets dédié
  (voir rules/remediation/api-key-leakage.md).

false_positive_notes:
  - "Si la chaîne n'apparaît que dans un module de test (#[cfg(test)]) avec une clé factice, reclasser en `info`."
  - "Vérifier que la constante n'est pas simplement le nom d'une variable d'environnement avant de remonter en `high`."

remediation_ref: rules/remediation/api-key-leakage.md
knowledge_ref: knowledge/api/api-key-leakage.md
