id: hardcoded-keys
language: rust
category: crypto
cwe: CWE-798
owasp: A02:2021-Cryptographic Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une clé, un secret HMAC ou une clé privée assignés littéralement
    à une constante/variable (const KEY, static API_SECRET) puis passés à une
    fonction cryptographique (Aes256Gcm::new, Hmac::new_from_slice).
  patterns:
    - "const API_SECRET: &str = \"_littéral_\""
    - "Aes256Gcm::new(Key::from_slice(b\"_littéral_\"))"
    - "Hmac::<Sha256>::new_from_slice(b\"_littéral_\")"
    - "let pem = \"-----BEGIN PRIVATE KEY-----...\""
  exclude_if:
    - "la valeur provient de std::env::var, d'un fichier de config chargé au runtime, ou d'un gestionnaire de secrets"
    - "la valeur est manifestement un exemple factice (\"changeme\", \"your-secret-here\") dans un fichier de documentation/test"

message: >
  Clé cryptographique ou secret codé en dur dans le source — extraire vers une
  variable d'environnement ou un gestionnaire de secrets, puis faire tourner
  la clé compromise.

false_positive_notes:
  - "Si la constante est un identifiant public (ex: clé publique, alias non secret), reclasser en `info`."
  - "Vérifier l'historique Git : même supprimée depuis, la clé doit être considérée compromise et rotée."

remediation_ref: rules/remediation/hardcoded-keys.md
knowledge_ref: knowledge/crypto/hardcoded-keys.md
