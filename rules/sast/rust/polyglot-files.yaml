id: polyglot-files
language: rust
category: upload
cwe: CWE-434
owasp: A04:2021-Insecure Design
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'acceptation d'un fichier téléversé sur la seule base d'une
    validation de signature/format réussie, sans re-encodage, combinée à
    un point de chargement dynamique ailleurs dans l'application (ex:
    parsing SVG/XML sans neutralisation, chargement de bibliothèque
    dynamique).
  patterns:
    - "std::fs::write($destPath, $data)"
    - "roxmltree::Document::parse($uploadedSvgStr)"
    - "libloading::Library::new($uploadedPath)"
  exclude_if:
    - "le fichier image est systématiquement re-encodé après décodage (crate image) après validation de signature, détruisant tout contenu polyglot superflu"
    - "aucune fonction de chargement dynamique (libloading, include!) n'est appliquée sur un fichier provenant d'un répertoire d'upload utilisateur"
    - "les fichiers SVG/XML sont traités par un parseur strict désactivant la résolution d'entités externes"

message: >
  Fichier téléversé accepté sur la seule base d'une validation de
  signature, sans re-encodage, dans un contexte où il pourrait être
  chargé/interprété dynamiquement — risque de fichier polyglot
  exploitable selon le contexte de traitement (voir
  rules/remediation/polyglot-files.md).

false_positive_notes:
  - "Si l'image est toujours re-encodée après réception via la crate image, tout contenu polyglot superflu est détruit — reclasser en `info`."
  - "Si le fichier téléversé n'est jamais rechargé par libloading ou un parseur XML permissif ailleurs dans l'application, le risque est fortement réduit."

remediation_ref: rules/remediation/polyglot-files.md
knowledge_ref: knowledge/upload/polyglot-files.md
