id: cookie-poisoning
language: rust
category: sessions
cwe: CWE-565
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte l'utilisation directe de la valeur d'un cookie (via
    actix_web::cookie ou tower_cookies) pour une décision d'autorisation ou
    métier sans vérification de signature (cookie privé/signé) ni
    revalidation côté serveur.
  patterns:
    - "req.cookie($name).map(|c| c.value().to_string())" # utilisé directement dans une condition d'autorisation
    - "if cookie.value() == $role_or_id { _ }"
    - "cookies.get($name)" # tower_cookies, valeur lue et utilisée directement pour une décision métier
  exclude_if:
    - "le cookie est lu via CookieJar::private() / PrivateCookieJar (chiffré+signé) ou signed() (signé) plutôt que la jar en clair"
    - "la valeur est un identifiant opaque de session (actix_session::Session, tower-sessions) revérifié côté serveur, pas un rôle/prix stocké directement"

message: >
  Valeur de cookie lue en clair et utilisée pour une décision de sécurité ou
  métier sans signature ni vérification d'intégrité — un attaquant peut
  modifier son propre cookie pour s'octroyer des privilèges (voir
  rules/remediation/cookie-poisoning.md).

false_positive_notes:
  - "Si la valeur provient d'une CookieJar signée ou privée (private()/signed()), le risque d'altération est neutralisé — reclasser en `info`."
  - "Si le cookie ne contient qu'un identifiant de session opaque géré par actix_session ou tower-sessions et que le rôle réel est relu en base à chaque requête, ce n'est pas exploitable."

remediation_ref: rules/remediation/cookie-poisoning.md
knowledge_ref: knowledge/sessions/cookie-poisoning.md
