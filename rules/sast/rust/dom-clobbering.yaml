id: dom-clobbering
language: rust
category: frontend
cwe: CWE-79
owasp: A03:2021-Injection
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un rendu de HTML utilisateur non sanitisé via le filtre `|safe`
    dans un template Askama/Tera, susceptible de contenir des attributs
    `id`/`name` contrôlés par l'attaquant, ouvrant la voie au DOM clobbering
    côté frontend.
  patterns:
    - "{{ $userContent|safe }}  # sans passage préalable par un sanitizer HTML"
    - "context.insert(\"body\", &$userContent)  # rendu ensuite via {{ body|safe }}"
    - "HttpResponse::Ok().content_type(\"text/html\").body($userContent)  # contenu utilisateur non sanitisé"
  exclude_if:
    - "$userContent passe par une bibliothèque de sanitisation HTML (ex: ammonia) avant le filtre |safe"
    - "les attributs id/name sont explicitement filtrés par la politique du sanitizer configuré"
    - "le contenu rendu provient strictement d'un auteur de confiance (administrateur applicatif)"

message: >
  Du HTML fourni par l'utilisateur est rendu via le filtre `|safe` sans
  sanitisation — des attributs id/name contrôlés par l'attaquant peuvent
  entrer en collision avec des variables globales JavaScript attendues côté
  frontend (DOM clobbering) (voir rules/remediation/dom-clobbering.md).

false_positive_notes:
  - "Si une bibliothèque de sanitisation HTML (ex: ammonia) est appliquée en amont et filtre id/name, ce n'est pas exploitable."
  - "Si le contenu rendu ne provient que d'auteurs de confiance (back-office administrateur), le risque est très réduit."
  - "Le DOM clobbering nécessite un script frontend qui fait confiance à window.X sans validation de type — vérifier le code JS associé."

remediation_ref: rules/remediation/dom-clobbering.md
knowledge_ref: knowledge/frontend/dom-clobbering.md
