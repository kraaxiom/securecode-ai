id: origin-bypass
language: rust
category: websocket
cwe: CWE-346
owasp: A01:2021-Broken Access Control
severity: high
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte une vérification d'origine WebSocket trop permissive dans un
    callback `accept_hdr_async` (tokio-tungstenite) ou un middleware
    actix-web : comparaison partielle (`contains`, `ends_with`,
    `starts_with`) au lieu d'une égalité stricte, ou expression régulière mal
    ancrée sur l'en-tête `Origin`.
  patterns:
    - "if origin.contains(\"trusted-domain.com\") { Ok(response) } else { Err(...) } // comparaison partielle au lieu d'égalité stricte"
    - "if origin.ends_with(\"trusted-domain.com\") { ... } // ne vérifie pas l'absence de préfixe malveillant type trusted-domain.com.evil.com"
    - "Regex::new(r\"trusted-domain\\.com\").unwrap().is_match(origin) // regex non ancrée avec ^...$"
    - "fn on_upgrade(req: &Request, response: Response) -> Result<Response, ErrorResponse> { Ok(response) } // callback accept_hdr_async qui accepte inconditionnellement sans lire req.headers().get(\"Origin\")"
  exclude_if:
    - "la comparaison utilise une égalité stricte (==) contre une allowlist explicite d'origines complètes (scheme+host+port)"
    - "l'expression régulière est correctement ancrée avec ^ et $ et échappe les points du domaine (\\.)"

message: >
  Vérification de l'en-tête Origin trop permissive (comparaison partielle,
  regex non ancrée, ou callback accept_hdr_async acceptant sans validation) —
  un attaquant peut héberger un domaine satisfaisant accidentellement la
  condition et réaliser un Cross-Site WebSocket Hijacking (voir
  rules/remediation/origin-bypass.md).

false_positive_notes:
  - "Si la liste des origines de confiance est fixe et ne contient aucun sous-domaine ambigu, le risque de bypass par sous-domaine reste théorique — évaluer au cas par cas."
  - "Une regex ancrée mais sans échappement du point reste exploitable via un domaine contenant un caractère quelconque à cette position — signaler quand même."

remediation_ref: rules/remediation/origin-bypass.md
knowledge_ref: knowledge/websocket/origin-bypass.md
