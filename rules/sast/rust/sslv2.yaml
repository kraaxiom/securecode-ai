id: sslv2
language: rust
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: critical
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'activation de SSLv2 via les bindings openssl (SslMethod::sslv2)
    ou une configuration native-tls/openssl-sys exposant ce protocole.
    rustls n'implémente pas SSLv2 ; ce pattern cible les bindings openssl.
  patterns:
    - "SslMethod::sslv2()"
    - "SslConnector::builder(SslMethod::sslv2())"
  exclude_if:
    - "aucune (SSLv2 ne doit jamais être activé, même conditionnellement)"

message: >
  SSLv2 est interdit par la RFC 6176 et vulnérable à l'attaque DROWN — retirer
  toute référence à SslMethod::sslv2 et utiliser rustls ou SslMethod::tls() avec
  min_proto_version fixé à TLS 1.2.

false_positive_notes:
  - "Aucun cas légitime connu : toute présence de ce flag doit être remontée en `critical`."

remediation_ref: rules/remediation/sslv2.md
knowledge_ref: knowledge/crypto/sslv2.md
