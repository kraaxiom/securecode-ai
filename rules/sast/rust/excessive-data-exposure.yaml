id: excessive-data-exposure
language: rust
category: api
cwe: CWE-213
owasp: API3:2023-Broken Object Property Level Authorization
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte un handler actix-web/axum qui sérialise directement une struct
    de modèle base de données complète (#[derive(Serialize)] sur le modèle
    lui-même) en réponse JSON, sans struct de sortie (DTO) restreinte,
    exposant potentiellement des champs internes ou sensibles.
  patterns:
    - "HttpResponse::Ok().json($dbModel)"
    - "Json($dbModel)"
    - "#[derive(Serialize, Queryable)] struct $Model { password_hash: $Type, ... }"
  exclude_if:
    - "la struct sérialisée est un DTO de sortie distinct du modèle de persistance, sans champs sensibles"
    - "les champs sensibles portent #[serde(skip_serializing)] les excluant systématiquement de la sortie JSON"

message: >
  Sérialisation directe d'une struct de modèle base de données en réponse
  API sans DTO de sortie — risque d'exposition de champs internes ou
  sensibles (password_hash, tokens) (voir rules/remediation/excessive-data-exposure.md).

false_positive_notes:
  - "Si la struct ne contient que des champs déjà publics, le risque réel est faible — reclasser en `low`."
  - "Vérifier les relations chargées (jointures ORM) qui pourraient exposer des données liées non voulues."

remediation_ref: rules/remediation/excessive-data-exposure.md
knowledge_ref: knowledge/api/excessive-data-exposure.md
