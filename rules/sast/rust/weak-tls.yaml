id: weak-tls
language: rust
category: crypto
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: medium
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une configuration TLS affaiblie malgré une version de protocole
    correcte : vérification de certificat désactivée via
    danger_accept_invalid_certs (reqwest/native-tls) ou
    dangerous().with_custom_certificate_verifier permissif (rustls), ou
    absence de HSTS.
  patterns:
    - "ClientBuilder::new().danger_accept_invalid_certs(true)"
    - "rustls::ClientConfig::dangerous().set_certificate_verifier(_) avec un vérificateur qui accepte tout"
    - "absence d'en-tête Strict-Transport-Security dans les réponses d'un handler HTTPS"
  exclude_if:
    - "danger_accept_invalid_certs est strictement conditionné à un environnement non-production vérifiable dans le code (feature flag de test)"

message: >
  Configuration TLS affaiblie (vérification de certificat désactivée ou
  absence de HSTS) — retirer danger_accept_invalid_certs / le vérificateur
  permissif et ajouter l'en-tête Strict-Transport-Security avec
  includeSubDomains.

false_positive_notes:
  - "Si la désactivation de vérification est strictement conditionnée à un environnement non-production vérifiable, reclasser en `low`."
  - "Vérifier que la configuration ne s'applique pas aussi au trafic sortant vers des services tiers sensibles."

remediation_ref: rules/remediation/weak-tls.md
knowledge_ref: knowledge/crypto/weak-tls.md
