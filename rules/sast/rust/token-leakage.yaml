id: token-leakage
language: rust
category: llm
cwe: CWE-522
owasp: LLM02:2025-Sensitive-Information-Disclosure
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une clé d'API de fournisseur LLM (async-openai, crates LLM Rust)
    codée en dur en tant que littéral de chaîne, ou une journalisation des
    en-têtes de requête HTTP sortante sans masquage du jeton d'autorisation.
  patterns:
    - "Config::new().with_api_key(string_literal)"
    - "OpenAIConfig::new().with_api_key(string_literal)"
    - "Client::with_config(Config::new().with_api_key(string_literal))"
    - "std::env::set_var(\"OPENAI_API_KEY\", string_literal)"
    - "println!(_, req.headers().get(\"Authorization\"))"
    - "log::info!(_, api_key)"
  exclude_if:
    - "la valeur provient de std::env::var, std::env::var_os, ou d'un crate de secrets (ex: secrecy::Secret, vaultrs)"
    - "le littéral est un placeholder évident (ex: \"sk-xxxx\", \"YOUR_API_KEY\", chaîne vide)"

message: >
  Clé d'API de service LLM codée en dur ou en-tête d'autorisation journalisé
  en clair — charger la clé via std::env::var ou un type enveloppant type
  secrecy::Secret, et masquer systématiquement les en-têtes sensibles avant
  toute journalisation (voir rules/remediation/token-leakage.md).

false_positive_notes:
  - "Si la chaîne littérale apparaît dans un module #[cfg(test)] avec une clé factice non fonctionnelle, reclasser en `info`."
  - "Si la valeur est enveloppée dans secrecy::Secret<String> et n'est jamais affichée via Debug/Display, ce n'est pas une fuite directe — vérifier manuellement."
  - "Si la valeur est lue depuis std::env::var immédiatement avant l'appel au client, ce n'est pas une fuite directe — vérifier le flux complet."

remediation_ref: rules/remediation/token-leakage.md
knowledge_ref: knowledge/llm/token-leakage.md
