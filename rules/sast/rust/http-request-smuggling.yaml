id: http-request-smuggling
language: rust
category: injections
cwe: CWE-444
owasp: A03:2021-Injection
severity: high
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte un usage non sécurisé d'une entrée utilisateur pouvant conduire à contrebande de requêtes http.
  patterns:
    - "hyper/reverse proxy réécrivant manuellement Content-Length et Transfer-Encoding sur la requête amont"
  exclude_if:
    - "la valeur est validée par liste blanche ou échappée via l'API dédiée de la crate avant usage"
    - "$var provient d'une constante interne (pas d'entrée utilisateur), non exploitable"

message: >
  Contrebande de requêtes HTTP détectée — valider/échapper strictement toute entrée utilisateur avant usage dans ce contexte (voir rules/remediation/http-request-smuggling.md).

false_positive_notes:
  - "Si la valeur est validée par une liste blanche stricte ou échappée via l'API dédiée du framework avant usage, ce n'est pas exploitable."
  - "Si $var provient d'une constante interne (pas d'entrée utilisateur), reclasser en `info`."

remediation_ref: rules/remediation/http-request-smuggling.md
knowledge_ref: knowledge/injections/http-request-smuggling.md
