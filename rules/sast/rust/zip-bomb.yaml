id: zip-bomb
language: rust
category: upload
cwe: CWE-409
owasp: A05:2021-Security Misconfiguration
severity: medium
confidence_default: high

match:
  type: ast-pattern
  description: >
    Détecte l'extraction d'une archive téléversée via la crate zip sans
    vérification préalable de la taille totale décompressée annoncée ni
    du ratio de compression, exposant à une bombe de décompression.
  patterns:
    - "ZipArchive::new($archiveFile)"
    - "$zipArchive.extract($destDir)"
    - "std::io::copy(&mut $zipEntry, &mut $dst)"
  exclude_if:
    - "la somme des ZipFile::size() (taille décompressée annoncée) est vérifiée par rapport à un seuil maximal avant toute extraction"
    - "le ratio ZipFile::size() / ZipFile::compressed_size() est vérifié pour chaque entrée et l'extraction est interrompue au-delà d'un seuil"
    - "std::io::copy est remplacé par une lecture bornée (ex: Read::take avec une limite explicite de taille par fichier extrait)"

message: >
  Extraction d'une archive téléversée via la crate zip sans vérification
  préalable de la taille décompressée annoncée ni du ratio de
  compression — risque de déni de service par bombe de décompression.
  Vérifier ZipFile::size() et le ratio de compression, et borner la
  lecture avec Read::take (voir rules/remediation/zip-bomb.md).

false_positive_notes:
  - "Si la somme des tailles décompressées annoncées (ZipFile::size()) est déjà vérifiée avant extraction et la copie est bornée, ce n'est pas exploitable — reclasser en `info`."
  - "Si l'extraction s'exécute dans un environnement isolé avec quotas stricts (conteneur avec limite mémoire/disque et timeout), l'impact réel est limité même sans contrôle applicatif explicite."

remediation_ref: rules/remediation/zip-bomb.md
knowledge_ref: knowledge/upload/zip-bomb.md
