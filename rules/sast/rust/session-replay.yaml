id: session-replay
language: rust
category: sessions
cwe: CWE-294
owasp: A07:2021-Identification and Authentication Failures
severity: high
confidence_default: medium

match:
  type: ast-pattern
  description: >
    Détecte une validation de jeton (JWT via jsonwebtoken) qui désactive la
    vérification d'expiration, ou un jeton à usage unique (reset password)
    qui n'est pas marqué comme consommé après utilisation.
  patterns:
    - "Validation::new($algorithm)" # avec validate_exp mis à false juste après, ou jamais activé explicitement
    - "let mut validation = Validation::new($algorithm); validation.validate_exp = false;"
    - "async fn reset_password($token: String, _) { _ }" # sans marquage du token comme utilisé (pas d'appel repository.mark_used/delete)
  exclude_if:
    - "validate_exp reste à sa valeur par défaut (true) ou est explicitement défini à true"
    - "le token à usage unique est marqué consommé (suppression en base, colonne used_at) immédiatement après une utilisation réussie"

message: >
  Jeton d'authentification ou de réinitialisation validé sans contrôle
  d'expiration ou sans mécanisme anti-rejeu — un jeton intercepté pourrait
  être réutilisé par un attaquant (voir rules/remediation/session-replay.md).

false_positive_notes:
  - "La crate jsonwebtoken active validate_exp par défaut ; ne signaler que les cas où ce champ est explicitement désactivé (validate_exp = false)."
  - "Si le token à usage unique est supprimé/marqué en base immédiatement après consommation, ce n'est pas un vrai positif."

remediation_ref: rules/remediation/session-replay.md
knowledge_ref: knowledge/sessions/session-replay.md
