id: xs-search
language: rust
category: modern
cwe: CWE-203
owasp: A01:2021-Broken Access Control
severity: medium
confidence_default: low

match:
  type: ast-pattern
  description: >
    Détecte un endpoint de recherche/filtrage actix-web/axum authentifié
    dont la taille ou le temps de réponse varie de façon observable selon
    le nombre de résultats trouvés (sérialisation JSON directe des
    résultats sans pagination normalisée), et qui ne fixe pas d'en-tête
    interdisant son inclusion cross-origin (`Cross-Origin-Resource-Policy`),
    ni ne vérifie `Sec-Fetch-Site`, permettant une mesure indirecte depuis
    un site tiers.
  patterns:
    - "async fn search(...) -> impl Responder { HttpResponse::Ok().json(results) } sans .insert_header((\"Cross-Origin-Resource-Policy\", \"same-origin\"))"
    - "axum: Json(results) renvoyé directement sur une route de recherche sans vérification de l'en-tête Sec-Fetch-Site ni normalisation de la taille de réponse"
    - "handler de recherche dont la taille du corps de réponse varie proportionnellement au nombre de résultats, sans pagination à taille fixe"
  exclude_if:
    - "l'en-tête Cross-Origin-Resource-Policy: same-origin (ou same-site) est fixé sur l'endpoint de recherche"
    - "le handler vérifie l'en-tête Sec-Fetch-Site et rejette les requêtes cross-site sur les endpoints de recherche sensibles"

message: >
  Endpoint de recherche actix-web/axum authentifié sans en-tête d'isolation
  cross-origin ni vérification de Sec-Fetch-Site — un site malveillant peut
  mesurer des différences observables (taille, temps de réponse) pour
  déduire terme par terme le contenu des résultats de recherche de la
  victime (voir rules/remediation/xs-search.md).

false_positive_notes:
  - "Si un middleware/tower Layer global applique Cross-Origin-Resource-Policy à toutes les réponses authentifiées, reclasser en `low`."
  - "La confirmation de l'exploitabilité réelle nécessite une mesure dynamique (timing/taille) ; la revue statique signale l'absence de contrôle préventif."

remediation_ref: rules/remediation/xs-search.md
knowledge_ref: knowledge/modern/xs-search.md
