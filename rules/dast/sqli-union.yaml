id: sqli-union
category: injections
cwe: CWE-89
owasp: A03:2021-Injection
severity: high
type: dast
test:
  method: GET|POST
  target: paramètre de requête, champ de formulaire ou en-tête utilisé dans une clause de filtre, tri ou pagination construite dynamiquement en SQL
  technique: boundary-value
  indicators:
    - "Différentiel du nombre de colonnes retournées ou d'erreur applicative lors du test de la limite de colonnes attendue par une clause UNION SELECT, sans jamais cibler de table réelle"
    - "Message d'erreur applicatif exposant un mismatch de type ou de nombre de colonnes typique d'une tentative d'alignement UNION"
    - "Apparition de données supplémentaires non liées à la requête d'origine (valeur constante de test injectée de façon neutre) dans la réponse après variation contrôlée du nombre de colonnes"
false_positive_notes:
  - "Une pagination ou un tri légitime avec un grand nombre de colonnes peut produire un différentiel similaire sans indiquer de vulnérabilité — confirmer par variation progressive du nombre de colonnes testées."
  - "Les messages d'erreur détaillés peuvent être désactivés en production, masquant le signal sans éliminer la vulnérabilité sous-jacente."
remediation_ref: rules/remediation/sqli-union.md
knowledge_ref: knowledge/injections/sqli-union.md
