id: weak-password
category: auth
cwe: CWE-521
owasp: A07:2021-Identification and Authentication Failures
severity: medium
type: dast
test:
  method: POST
  target: champ mot de passe du formulaire d'inscription/changement de mot de passe
  technique: boundary-value
  indicators:
    - "Un mot de passe court (proche de la limite minimale documentée, par exemple 6-8 caractères) est accepté sans rejet, indiquant une longueur minimale insuffisante"
    - "Un mot de passe figurant parmi les valeurs les plus couramment ciblées (motif générique, jamais une liste de mots de passe réels intégrée au test) est accepté sans avertissement ni rejet"
    - "Aucun signal de vérification contre une liste de mots de passe compromis n'est observé (pas d'appel réseau sortant ni de délai de traitement supplémentaire cohérent avec une telle vérification)"
false_positive_notes:
  - "Ce test utilise des valeurs de longueur/motif générique pour sonder la politique, jamais un mot de passe réellement compromis issu d'une fuite de données."
remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
