id: default-credentials
category: auth
cwe: CWE-1392
owasp: A07:2021-Identification and Authentication Failures
severity: high
type: dast
test:
  method: GET
  target: page de connexion exposée de panneaux d'administration, outils de monitoring ou services annexes détectés sur l'application testée
  technique: error-signature
  indicators:
    - "Présence d'une interface d'administration/outil tiers accessible publiquement sans avoir été inventoriée comme telle, avec un écran de connexion générique correspondant à une configuration d'installation par défaut connue (nom de produit + version)"
    - "Absence de mécanisme visible de changement forcé de mot de passe à la première connexion pour ce type de composant"
    - "Réponse du serveur exposant une bannière de version ou un chemin d'installation par défaut non modifié, cohérent avec une configuration jamais durcie après déploiement"
false_positive_notes:
  - "Cette règle DAST ne teste jamais un identifiant/mot de passe réel — elle se limite à signaler l'exposition d'une interface dont la configuration par défaut est documentée publiquement, à vérifier manuellement hors ligne."
remediation_ref: rules/remediation/default-credentials.md
knowledge_ref: knowledge/auth/default-credentials.md
