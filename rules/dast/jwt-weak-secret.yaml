id: jwt-weak-secret
category: auth
cwe: CWE-326
owasp: A02:2021-Cryptographic Failures
severity: high
type: dast
test:
  method: GET
  target: en-tête d'autorisation portant un jeton JWT signé en HMAC (Authorization: Bearer)
  technique: out-of-band
  indicators:
    - "Le jeton observé utilise un algorithme HMAC (HS256/HS384/HS512), ce qui rend théoriquement possible une attaque hors ligne par dictionnaire sur le secret — signal à documenter pour vérification hors ligne, sans jamais tenter de casser réellement le secret depuis le scan dynamique"
    - "Absence de rotation observée du secret entre plusieurs jetons émis à des sessions différentes sur une longue période (signal indirect, à corréler avec une revue de configuration)"
false_positive_notes:
  - "Un DAST ne peut pas mesurer directement l'entropie d'un secret côté serveur — ce test se limite à signaler l'usage d'un algorithme HMAC comme point à vérifier via la règle SAST/IAST correspondante ou une revue de configuration."
remediation_ref: rules/remediation/jwt-weak-secret.md
knowledge_ref: knowledge/auth/jwt-weak-secret.md
