id: credential-stuffing
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
type: dast
test:
  method: POST
  target: endpoint de connexion (identifiant + mot de passe)
  technique: differential-response
  indicators:
    - "Aucune limitation ni ralentissement observés lorsque des tentatives de connexion sont effectuées avec des identifiants différents (comptes distincts) depuis une même source, à un volume dépassant largement un usage humain normal"
    - "Absence de mécanisme de détection comportementale (challenge, CAPTCHA, MFA proposé) déclenché après un volume anormal de tentatives multi-comptes depuis la même origine"
    - "Réponses de connexion strictement identiques en structure/timing entre un identifiant valide et invalide, facilitant la validation automatisée en masse de couples identifiant/mot de passe"
false_positive_notes:
  - "Un test de charge légitime réalisé depuis la même plage d'IP peut produire un signal similaire — confirmer le contexte du test avant conclusion."
  - "La protection peut être déléguée à un service anti-bot tiers non visible depuis le trafic applicatif brut — vérifier les logs de ce service si présent."
remediation_ref: rules/remediation/credential-stuffing.md
knowledge_ref: knowledge/auth/credential-stuffing.md
