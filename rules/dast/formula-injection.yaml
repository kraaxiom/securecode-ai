id: formula-injection
category: injections
cwe: CWE-1236
owasp: A03:2021-Injection
severity: medium
type: dast
test:
  method: POST
  target: champ de formulaire dont la valeur est ensuite incluse dans un export CSV/XLSX/ODS
  technique: out-of-band
  indicators:
    - requête réseau sortante reçue sur un collecteur out-of-band suite à l'ouverture du fichier exporté contenant une formule non neutralisée
    - présence dans le fichier exporté d'une cellule commençant par un caractère déclencheur (=, +, -, @, tabulation, retour chariot) sans échappement préalable
  false_positive_notes:
    - un caractère déclencheur en tête de valeur peut être légitime (ex: numéro de téléphone commençant par +) et neutralisé correctement en amont
    - confirmer via le callback out-of-band avant de conclure à une évaluation effective côté tableur
remediation_ref: rules/remediation/formula-injection.md
knowledge_ref: knowledge/injections/formula-injection.md
