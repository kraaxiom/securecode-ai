id: password-spray
category: auth
cwe: CWE-307
owasp: A07:2021-Identification and Authentication Failures
severity: medium
type: dast
test:
  method: POST
  target: champ identifiant du formulaire/API d'authentification, avec un mot de passe fixe entre les requêtes
  technique: differential-response
  indicators:
    - "Aucune limitation ni ralentissement observés lorsqu'un même mot de passe (fixe, non fonctionnel — jamais une valeur réellement susceptible de correspondre à un compte) est soumis pour un nombre croissant d'identifiants distincts depuis la même source"
    - "Absence de corrélation globale des échecs d'authentification tous comptes confondus : le compte de test individuel ne se verrouille jamais tant que le nombre d'échecs par compte reste sous le seuil, quel que soit le volume total agrégé"
false_positive_notes:
  - "Une limitation de débit globale par IP/source (indépendante du compte) neutralise ce vecteur même si le verrouillage par compte reste bas — vérifier les deux couches avant conclusion."
remediation_ref: rules/remediation/password-spray.md
knowledge_ref: knowledge/auth/password-spray.md
