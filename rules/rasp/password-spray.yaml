id: password-spray
category: auth
cwe: CWE-307
type: rasp
guard:
  sink: fonction de vérification d'identifiants du contrôleur d'authentification
  block_condition: >
    Nombre d'échecs de vérification d'identifiants dépassant un seuil configuré, agrégé
    par IP/source sur des identifiants distincts (tous comptes confondus) dans une
    fenêtre glissante, indépendamment du compteur d'échecs par compte individuel.
  action: block
  fail_mode: fail-closed   # ce signal agrégé cible spécifiquement le contournement du verrouillage par compte ; blocage recommandé par défaut, avec fail-open laissé au choix explicite de l'opérateur si le risque de faux positif (IP partagée) est jugé trop élevé
severity: medium
remediation_ref: rules/remediation/password-spray.md
knowledge_ref: knowledge/auth/password-spray.md
