id: credential-stuffing
category: auth
cwe: CWE-307
type: rasp
guard:
  sink: fonction de vérification d'identifiants du contrôleur d'authentification
  block_condition: >
    Volume anormal de requêtes de connexion portant des identifiants différents
    (comptes distincts) en provenance de la même IP/empreinte client dans une
    fenêtre glissante courte, cohérent avec un test automatisé de couples
    identifiant/mot de passe volés.
  action: alert-only
  fail_mode: fail-open   # un blocage agressif sur ce signal comportemental présente un risque de faux positif plus élevé qu'un brute-force classique (NAT, proxy d'entreprise partagé) ; alert-only recommandé par défaut, block laissé au choix explicite de l'opérateur après calibration
severity: medium
remediation_ref: rules/remediation/credential-stuffing.md
knowledge_ref: knowledge/auth/credential-stuffing.md
