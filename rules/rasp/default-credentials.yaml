id: default-credentials
category: auth
cwe: CWE-1392
type: rasp
guard:
  sink: fonction de vérification d'identifiants pour un compte marqué comme compte de démonstration/service dans la configuration de l'application
  block_condition: >
    Authentification réussie sur un compte connu comme compte par défaut/de démonstration
    (identifiant présent dans une liste de comptes standards configurée par l'opérateur)
    alors que l'environnement d'exécution est marqué comme production.
  action: alert-only
  fail_mode: fail-open   # un blocage automatique d'un compte légitime en cas de faux positif sur la classification "production" présente un risque de déni de service ; alerte recommandée pour déclenchement d'une revue humaine immédiate
severity: high
remediation_ref: rules/remediation/default-credentials.md
knowledge_ref: knowledge/auth/default-credentials.md
