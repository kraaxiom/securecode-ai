id: privilege-escalation
category: authorization
cwe: CWE-269
type: rasp
guard:
  sink: "fonction de persistance d'un rôle/niveau de privilège pour un compte (mise à jour de profil, attribution de rôle, gestion d'équipe)"
  block_condition: "le rôle cible demandé est strictement supérieur au niveau de privilège du contexte d'authentification de l'appelant, ou aucune vérification hiérarchique de rôle n'a intercepté l'appel en amont"
  action: block
  fail_mode: fail-closed
severity: critical
remediation_ref: rules/remediation/privilege-escalation.md
knowledge_ref: knowledge/authorization/privilege-escalation.md
