id: weak-password
category: auth
cwe: CWE-521
type: rasp
guard:
  sink: fonction de création/mise à jour du mot de passe utilisateur (avant hachage et persistance)
  block_condition: >
    Le mot de passe soumis ne respecte pas la longueur minimale configurée (12 caractères
    recommandés) ou correspond à une entrée présente dans une liste de mots de passe
    compromis connus fournie par l'opérateur.
  action: block
  fail_mode: fail-closed   # accepter un mot de passe manifestement faible à ce stade compromet durablement le compte créé ; blocage recommandé par défaut, avec message explicite renvoyé à l'utilisateur pour corriger sa saisie
severity: medium
remediation_ref: rules/remediation/weak-password.md
knowledge_ref: knowledge/auth/weak-password.md
