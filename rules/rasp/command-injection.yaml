id: command-injection
category: injections
cwe: CWE-78
type: rasp
guard:
  sink: exécution de commande système (exec, system, popen, Runtime.exec, child_process.exec)
  block_condition: Une valeur taintée contenant un métacaractère shell (;, |, &, $, `, (, )) atteint le sink en mode d'interprétation shell.
  action: block
  fail_mode: fail-closed
severity: critical
remediation_ref: rules/remediation/command-injection.md
knowledge_ref: knowledge/injections/command-injection.md
