id: jwt-weak-secret
category: auth
cwe: CWE-326
type: rasp
guard:
  sink: fonction de signature/vérification HMAC utilisée par le composant de gestion des jetons JWT
  block_condition: >
    Le secret chargé au démarrage pour la signature HMAC est absent, vide, ou identique
    à une valeur d'exemple/par défaut connue référencée dans une liste de secrets faibles
    fournie par l'opérateur.
  action: alert-only
  fail_mode: fail-open   # bloquer la signature JWT au runtime provoquerait un déni de service applicatif immédiat ; ce contrôle vise à alerter pour correction avant que l'agent ne bascule éventuellement en block une fois la remédiation planifiée
severity: high
remediation_ref: rules/remediation/jwt-weak-secret.md
knowledge_ref: knowledge/auth/jwt-weak-secret.md
